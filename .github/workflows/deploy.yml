# Runs `make deploy` (deploy/README.md) on a hosted runner. Three ways in:
#   - a push to main whose head commit message contains `[deploy]`
#   - a pushed `v*` tag
#   - workflow_dispatch, from the Actions tab or the GitHub API
# `deploy/preflight.sh` refuses any commit not on origin/main, whichever way it arrived.
name: deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    # Identifiers are not sensitive, so they may be set as either environment variables or secrets.
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      MEDIA_BASE: ${{ vars.MEDIA_BASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Toolchain
        run: |
          scripts/setup.sh
          pnpm -C web exec playwright install-deps chromium
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends rclone

      - name: Deploy
        run: make deploy
