<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Earthlapse">
  <defs>
    <radialGradient id="sea" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#57a0cb"/><stop offset="1" stop-color="#1a4059"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="32" cy="32" r="21"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0f16"/>
  <circle cx="32" cy="32" r="21" fill="url(#sea)"/>
  <g clip-path="url(#ball)" fill="#57a55a">
    <ellipse cx="21" cy="24" rx="11" ry="7.5" transform="rotate(-18 21 24)"/>
    <ellipse cx="38" cy="42" rx="9.5" ry="7" transform="rotate(12 38 42)"/>
    <ellipse cx="47" cy="23" rx="6" ry="4.5"/>
  </g>
  <path d="M32 11A9 21 0 0 1 32 53A21 21 0 0 0 32 11Z" clip-path="url(#ball)" fill="#04080d" opacity=".62"/>
  <!-- A dark casing under the hands, drawn first and slightly wider: the amber then reads
       against flat dark in every direction instead of fighting whatever continent is beneath
       it. Standard trick, and the only reason this survives being laid over a busy sphere. -->
  <g stroke="#06101a" stroke-width="7.4" stroke-linecap="round" opacity=".85">
    <path d="M32 32 21 22.5"/><path d="M32 32 43.5 20"/>
  </g>
  <g stroke="#f0bd7c" stroke-width="4" stroke-linecap="round">
    <path d="M32 32 21 22.5"/><path d="M32 32 43.5 20"/>
  </g>
  <circle cx="32" cy="32" r="3.6" fill="#06101a"/>
  <circle cx="32" cy="32" r="2.4" fill="#f7d7a4"/>
</svg>
