# The significance roster (ADR-038): a hand-curated set of cities a general audience would
# recognise or that mattered historically -- imperial/national capitals, great trading ports,
# religious centres, famous ancient sites, modern megacities. Deliberately NOT every capital
# city, and NOT ranked by population (that was ADR-035's rule, which produced a globe with zero
# markers in sub-Saharan Africa, Oceania and most of South-East Asia -- see README.md
# "Significance roster" for the full account).
#
# `id` must match a `Feature.id` in the curated `cities` FeatureSet (data/curated/cities.parquet)
# -- the slug sources/cities/normalise.py assigns, e.g. "uruk-iraq". `pipeline.publish.
# apply_city_roster` raises naming any entry that doesn't resolve, so a typo here fails the build
# loudly rather than silently shrinking the published globe.


# ---- Mesopotamia / ancient Near East (trimmed to the handful a general audience would
# recognise, not the dataset's full ~30-entry Sumerian city-state list)

