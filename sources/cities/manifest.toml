# See docs/DATA_SOURCES.md for field meanings, and README.md for the dedupe policy and
# notability filter.
#
# Reba, Reitsma & Seto (2016), "Spatializing 6,000 years of global urbanization from 3700 BC
# to AD 2000", Scientific Data 3:160034, doi:10.1038/sdata.2016.34. SEDAC's own listing
# (doi:10.7927/H4ZG6QBX) requires a NASA Earthdata login for bulk access and ships no plain
# CSV download -- the paper's own "Data Records" section names the real distribution: three
# CSVs on figshare (Chandler, Modelski Ancient, Modelski Modern), each independently CC BY 4.0
# (confirmed via the figshare API's own licence field), downloadable with no auth via
# ndownloader.figshare.com. See README.md "Licence and access" for the full verification.

name = "cities"
title = "Historical Urban Population, 3700 BC - AD 2000 (Chandler + Modelski)"
url = "https://www.nature.com/articles/sdata201634"
sha256 = ""  # not applicable -- three independent artefacts, see [[artefacts]]
licence = "CC BY 4.0 (each of the three figshare deposits independently, confirmed via the figshare API)"
citation = "Reba, M., Reitsma, F. & Seto, K.C. Spatializing 6,000 years of global urbanization from 3700 BC to AD 2000. Sci Data 3, 160034 (2016). https://doi.org/10.1038/sdata.2016.34"
time_domain = [5.725e3, 25.0]  # years BP, [oldest, newest] -- 3700 BCE .. AD 2000, against the fixed AD 2025 present
output_shape = "FeatureSet"
interpolation = "n/a"  # FeatureSet has no interpolation policy -- each estimate is a discrete attested reading
volume_bytes = 1448474  # measured: sum of the three raw CSVs (see README.md "Measured volume")
storage_tier = "git"  # curated parquet is small (see README.md); raw CSVs are gitignored, re-fetched from figshare

