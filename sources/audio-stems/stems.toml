# lake/harbour-character alternative ("lake lapping water", CC0 filter); picked over thirteen
# other candidates in that search on title/character alone (a full spectrogram/licence pass was
# only done on this one -- the others were not run down, so this is not a claim they were worse,
# only that this one was checked and fits). Spectrogram (full clip and the loop region alike):
# irregular broadband lapping bursts scattered across 0-4 kHz, gentle and uneven in level (roughly
# -30 to -43 dB across the first 100 s), no continuous roar, no tonal ridge, siren, speech,
# birdsong or music -- reads as water lightly slapping a shore or hull, not open-ocean surf.
# 175.5 s raw clip; the last ~20 s runs measurably louder (down to -19.5 dB) and was avoided.
#
# Loop region 73.930-84.929 s (11.0 s) sits inside a quiet, splash-peak-free stretch (73-96 s is
# one long span with no per-second peak above -7 dB; the very end of that span, around 86.2 s,
# carries the one loud splash in the whole clip and was excluded), found by the same grid search
# (sample-matched, level-matched within 2 dB) `artillery`/`buzzing`/`knapping` used: wrap jump
# 4.7e-7 (48 kHz) / 7.0e-9 (44.1 kHz) against a ~1.1e-3 median sample step -- effectively 0. An
