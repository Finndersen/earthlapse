# The audio-stems catalogue (ADR-023, its 2026-09-14 "stem set v2" amendment, its 2026-09-15
# "era fit v3"/"era fit v3 fixes" amendments, its 2026-09-15 "human-history scene sounds,
# once-mode fix and Safari re-sourcing" amendment, and that amendment's own 2026-09-15 re-review
# corrections, pipeline/audio.py's StemBook). Twenty-four CC0/public-domain clips in two kinds:
#
# - Ambience stems (wind ... traffic) have a web `stemGains` row and loop at their curve gain.
# - Scene-only stems (geothermal, impact, rocket, aircraft, buzzing, knapping, mammoth, artillery,
#   lake-water) have no curve and are reached only through a scene's `sound`. `loop_safe = false`
#   marks a one-shot (`mode: once` only).
#
# Every clip below was spectrogram-checked (v2: 2026-09-14; the v3 additions `large-animal`,
# `buzzing`, `knapping`, `mammoth`: 2026-09-15; `forest`'s first pick same day, then re-sourced
# and re-checked, spectrogram independently re-verified, the same day by "era fit v3 fixes" after
# the first pick turned out to carry bird/primate-like anachronisms; nobody could listen;
# `archosaurs`/`livestock` re-sourced and `artillery` added the same day again by the
# "human-history scene sounds, once-mode fix and Safari re-sourcing" amendment; that amendment's
# `artillery` loop region and `archosaurs`' claimed "no loop needed" corrected, and `lake-water`
# added, the same day again by its re-review; `forest` re-sourced a THIRD time on 2026-09-16 after
# listening feedback found its second pick, though frog/bird-free, was a literal rain recording):
# decoded in headless Chromium, drawn 0-8 kHz / 0-1 kHz with an RMS strip, and inspected for
# sirens (periodic tonal sweeps), speech (formant arcs), music, vehicles, birds where birds would
# be an anachronism, frogs where frogs would be an anachronism, clipping and silence gaps, and
# (added 2026-09-16, after `forest`'s rain mistake) rain/downpour character: near-stationary
# broadband 1-8 kHz energy with a LOW block-RMS envelope variance (rain measures well under 1 dB
# of envelope stdev; genuine wind-driven rustle swells several dB as gusts come and go) and no
# discrete events -- checked quantitatively, not just by ear, since "nobody can listen" is exactly
# why the first two `forest` picks both shipped a clip nobody had verified this way. The per-entry
# comment records what the check found.
#
# `url` is the direct, machine-fetchable download URL -- the same convention every other
# source's manifest.toml `url` already follows (e.g. sources/co2-o2/manifest.toml), and what
# `fetch.py`'s `ensure_verified_artefact(..., download=lambda: _download(stem.url))` actually
# calls. It is also what ships to the web credits page as `AudioStem.source_url`. For a
# Freesound clip that is the CDN URL of Freesound's own unauthenticated "-hq" preview transcode
# (128 kbps MP3) -- Freesound's *original*-quality download requires a logged-in session and an
# OAuth/API-key flow this offline pipeline cannot perform, so the HQ preview, the only bitstream
# Freesound serves without auth, is what was fetched, hashed and shipped; this is still the
# genuine CC0-dedicated recording, just Freesound's own lossy transcode of it rather than the
# uploader's original file. Each entry's comment also cites the human-readable source page
# (the credited "story" URL a person would open) since that differs from the download URL.
#
# Levels and loop regions (ADR-023 amendment "stem levels and loop regions"): `loudness_db` and
# `peak_dbfs` were measured with sources/audio-stems/levels.py on the clip as Chromium decodes it;
# publish turns them into each stem's `level_trim_db`, so every stem reaches the mix at its
# reference loudness. A `loop` region, where present, was picked from the decoded samples to skip
# a silent head/tail, a fade or a splice, with both ends at matched level and near-equal samples.
#
# See sources/audio-stems/README.md for the schema and "Why levels are attested, not measured at
# build time".

# ------------------------------------------------------------------------------ ambience stems

