# https://freesound.org/people/craigsmith/sounds/486027/ -- CC0 1.0, craigsmith,
# "R12-31-Artillery Guns Firing.wav" (vintage Hollywood optical effect, the same trusted source
# as `impact`/the re-sourced `archosaurs`). New in the "human-history scene sounds, once-mode fix
# and Safari re-sourcing" amendment (2026-09-15): a distant-bombardment loop for `somme-1916`
# only -- `normandy-landings-dday` was considered but kept as `water` (that scene's own amendment
# text). No genuine period WWI/WWII field recording of distant artillery was found licensed
# CC0/PD on Freesound or Wikimedia Commons in the time this pass budgeted for sourcing (searched
# "distant artillery", "artillery barrage", "WWI shelling"; Commons' own WWI/WWII audio holdings
# are almost entirely speeches, marches or unlicensed film audio) -- this vintage optical library
# recording is a documented substitution, the same "library effect stands in for the real thing"
# precedent `impact`/`rocket`/`aircraft` already use. Spectrogram: several sustained bursts of
# broadband low-mid rumble (concentrated 100-800 Hz, reading as many overlapping reports rather
# than one shot) separated by quieter gaps; no tonal siren sweep, speech formants, music or
# ricochet/whistle effects.
#
# **Correction (2026-09-15, second pass):** the loop region this amendment originally shipped
# (20.831-24.623 s, a 3.79 s span) was wrong on both counts its own comment claimed. Re-measured
# with `Tone.Player`'s actual loop semantics (last sample before `loopEnd` against the first
# sample at `loopStart`, headless-Chromium-decoded at 44.1 and 48 kHz, not eyeballed): the wrap
# jump was 0.101 at 48 kHz against a 0.00366 median sample step -- about 27x the median and over
# 5x the p99 step, an audible click on every 3.79 s repeat, not the attested "3.0e-7 -- effectively
# 0". A region that short also repeats far too often for a "distant bombardment" bed. Re-searched
# the whole clip for a long, sample-matched, level-matched wrap: 13.0-28.0 s is one continuous
# sustained-burst span (no gap below -36 dB), inside which 13.269-27.984 s (14.715 s, comfortably
# over the "10 s or more" target) wraps at 3.97e-4 (48 kHz) / 4.56e-4 (44.1 kHz) -- both *under*
# each rate's own median step, not merely under its p99 -- with both ends within 0.05 dB.
# `loudness_db`/`peak_dbfs` below are re-measured on this new loop region (still not the full
# raw clip, the same "measure what will actually loop" precedent `forest`'s own comment
