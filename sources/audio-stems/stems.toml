# https://freesound.org/people/kangaroovindaloo/sounds/324590/ -- CC0 1.0, kangaroovindaloo,
# "Blowflies!" (page description: "The sweet sound of Australian blowflies in mass!"; tags:
# blowfly, buzz, buzzing, flies, insect, swarm -- no bird/traffic/cow mention, unlike the clip
# below it replaces). New wing-hum stage for `insects`' 385-300 Ma gap (2026-09-15 review of
# "era fit v3 fixes"' own "Unresolved" item: no non-stridulating wing-drone clip had been
# sourced): winged insects are unambiguously dated to ~325 Ma (Grimaldi, D. & Engel, M.S. (2005).
# *Evolution of the Insects*. Cambridge University Press) but the only insects clip is a
# cricket-stridulation loop, a character Song et al. 2020 dates no earlier than ~300 Ma -- a
# GENERIC wing-hum, not a stridulation or bee recording, fills the gap between the two dates.
#
# REPLACES bruno.auzet "swarm of flies.wav" (Freesound 692840), this stem's first pick, re-sourced
# 2026-09-15 after a review of that pick found four problems, all confirmed against a fresh
# headless-Chromium decode: (1) at 230.25 s it was by far the heaviest ambience-loop stem's decoded
# buffer (~44 MB even after `engine.ts`'s mono downmix) -- not, on a corrected live measurement,
# actually over `DECODED_BYTES_CAP` at any checkpoint (12 Ma: 95.5 MB decoded across 6 ready
# buffers; 10 ka: 122.8 MB across 8 -- both comfortably under the 190 MB cap once the downmix the
# original review's estimate omitted is accounted for), but it ate a disproportionate share of the
# budget's headroom for no audible benefit, being ducked ~13.5 dB under `forest` throughout; (2) a
# few faint (~-70 dB, 30-35 dB under the loop's own drone) narrowband tones inside the claimed
