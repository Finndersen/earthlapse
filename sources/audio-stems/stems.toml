# The audio-stems catalogue (ADR-023; pipeline/audio.py's StemBook). Thirty-eight CC0/public-domain
# clips in two kinds:
#
# - Ambience stems (wind ... traffic) have a web `stemGains` row and loop at their curve gain.
# - Scene-only stems (geothermal, impact, rocket, aircraft, buzzing, knapping, mammoth, artillery,
#   lake-water, geiger-counter, steam-whistle, ship-horn, chainsaw, street-traffic, howler-monkeys, klaxon-horn,
#   hippo, wall-chiselling, church-bell, ship-rigging, tram-bell, sauropod) have no curve and are reached only
#   through a scene's `sound`. `loop_safe = false` marks a one-shot (`mode: once` only).
#
# Every clip is spectrogram-checked against the anachronism/rain/rumble criteria in
# sources/audio-stems/README.md ("Sourcing checks"); each entry's comment records only what that
# clip's own check found, not the general method.
#
# `url` is the direct, machine-fetchable download URL `fetch.py` calls (same convention as every
# other source's manifest.toml `url`) and what ships to the web credits page as
# `AudioStem.source_url`. For a Freesound clip this is the CDN URL of Freesound's own
# unauthenticated "-hq" preview transcode (128 kbps MP3) -- Freesound's original-quality download
# needs a logged-in OAuth session this offline pipeline cannot perform, so the HQ preview, the only
# bitstream available without auth, is what is fetched and shipped; it is still the genuine
# CC0-dedicated recording, just Freesound's own lossy transcode of it. Each entry's comment leads
# with the human-readable source page instead, since that differs from the download URL.
#
# `loudness_db`/`peak_dbfs` are measured with sources/audio-stems/levels.py on the decoded clip;
# publish turns them into `level_trim_db` so every stem reaches the mix at its reference loudness.
# A `loop` region, where present, skips a silent head/tail, a fade or a splice, with both ends at
# matched level and near-equal samples -- `Tone.Player`'s loop semantics wrap from the last sample
# before `loopEnd` to the first at `loopStart`, so that is the pair to measure the wrap jump on,
# not `x[loopStart]` vs. `x[loopEnd]` directly.
#
# WebKit/Safari cannot decode Ogg-container audio, and this machine has no working ffmpeg/sox/
# afconvert transcode path for MP3 or Ogg -- a source only available as Ogg is re-sourced from
# Freesound (always MP3) instead of transcoded.
#
# See sources/audio-stems/README.md for the full schema.

# ------------------------------------------------------------------------------ ambience stems

