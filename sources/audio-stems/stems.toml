# https://freesound.org/people/kangaroovindaloo/sounds/324590/ -- CC0 1.0, kangaroovindaloo,
# "Blowflies!" (tags: blowfly, buzz, buzzing, flies, insect, swarm). A generic wing-hum fills
# `insects`' 385-300 Ma gap: winged insects are dated to ~325 Ma (Grimaldi, D. & Engel, M.S.
# (2005). *Evolution of the Insects*. Cambridge University Press), but the only `insects` clip is
# a cricket-stridulation loop, a character Song et al. 2020 dates no earlier than ~300 Ma -- this
# clip's non-stridulating drone bridges the gap.
#
# Replaces bruno.auzet "swarm of flies.wav" (Freesound 692840): that pick carried a few faint
# narrowband tones inside its claimed loop region (its own Freesound description mentions distant
# birds, traffic and cows, missed in the original read) and a close fly-pass recurring every ~22 s,
# and its decoded buffer was disproportionately large for its audible contribution.
#
# Spectrogram: continuous broadband texture to 8 kHz with harmonic bands at ~280/560 Hz (wingbeat
# fundamental and first harmonic, diffuse and swarm-wide rather than one close tonal insect, unlike
# `buzzing`'s single bee); no FM chirps, periodic croaking, siren sweep, speech or music. RMS
# transients (fly passes) recur every 1-3 s throughout -- expected swarm texture, not a periodic
# artefact -- so the loop region is chosen inside the clip's longest transient-light stretch rather
# than a fully transient-free one, since none run longer than about 15 s. `loudness_db`/`peak_dbfs`
# are measured on the loop region, since the full clip peaks louder elsewhere.
