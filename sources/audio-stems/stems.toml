# energy at 1.6-8 kHz; no traffic or engine hum under it (<150 Hz holds 1%), no voices, dogs or
# aircraft; two faint broadband clicks (~48 s, ~88 s). The first 0.4 s is digital silence followed
# by a handling bump, so the loop region starts at 1.84 s. Quiet recording (peak -20.9 dBFS),
# lifted by its level trim. Replaces Magnesus "Forest birds - ambient seamless loop" (723913):
# one songbird repeating the same phrase every ~2.8 s in a 27 s loop. Rejected: fs_ejh 199530
# (74% of energy below 150 Hz, town traffic), rubindaniel 794578 (steady 60-90 Hz hum band),
# cdoylee 628601 (dense 0-2 kHz rumble in its first 20 s), upkey 826326 (51% at 150-500 Hz,
# handling/wind noise).

