# https://freesound.org/people/mathiaslyhne1/sounds/798157/ -- CC0 1.0, mathiaslyhne1, "3. Forest,
# beech leaves, trees". Terrestrial ambience bed standing in for `wind`/`water`/`storm` once life
# moves inland at 370 Ma; a genuine, unprocessed field recording of leaves rustling in wind, tags
# beech/field-recording/forest/leaves/trees/wind only -- no birds, frogs, water or traffic.
#
# Distinguishing genuine leaf rustle from both rain and wind rumble is the load-bearing check for
# this stem specifically, since both failure modes are broadband and pass a naive "no tonal events"
# read: rain is near-stationary (block-RMS envelope stdev well under 1 dB, because it has no gusts
# to swell and ease off), while wind-on-microphone rumble is broadband but bass-heavy (most energy
# below 200 Hz). A genuine rustle candidate needs a non-stationary envelope (gusts swell and ease
# off) AND most of its spectral energy above 2 kHz. This clip's loop region clears both: envelope
# stdev 1.67 dB (one smooth rise-and-decay gust across the 8.9 s loop, not a periodic cadence),
# median-energy frequency 2491 Hz with 32% of power in 2-8 kHz, and no tonal peakiness at
# siren/hum/bird-chirp levels or at 50/60/100/120 Hz mains-hum bins. The loop region is found by a
# joint grid search over both 44.1 kHz and 48 kHz decodes together, minimising the worse of the two
# rates' wrap jump -- checking one rate and trusting the other to match can miss a wrap that only
# reproduces cleanly at the tested rate. `loudness_db`/`peak_dbfs` are measured on the loop region
# itself, not the full clip, since the full clip peaks louder a few seconds outside the loop.
[[stems]]
id = "forest"
title = "3. Forest, beech leaves, trees"
author = "mathiaslyhne1"
url = "https://cdn.freesound.org/previews/798/798157_4977295-hq.mp3"
licence = "CC0 1.0"
sha256 = "d19ca9dc96747dbc75905d2d3d1109102533a0d61db4152f02ad6ca38da7c74d"
raw_filename = "forest.mp3"
format = "mp3"
duration_seconds = 27.12
loop_safe = true
loudness_db = -48.8
peak_dbfs = -29.8
loop = { start_seconds = 17.308, end_seconds = 26.224 }

