# See docs/DATA_SOURCES.md for field meanings, and README.md for the schema deep-dive,
# roster, thinning and licence verification.
#
# Cliopatria (Seshat Global History Databank / Complexity Science Hub Vienna / Alan Turing
# Institute / Oxford): a single GeoJSON of ~1,600 political entities, 3400 BCE - 2024 CE,
# confirmed directly against the real data (README.md "Schema"). This source keeps only
# Type == "POLITY" rows (14,108 of 14,945 features -- LEADER/GROUP/EVENT/ARMY rows are a
# different kind of record entirely) and, of those, only the polities the hand-picked empire
# roster names (`roster.toml`, ADR-059), each over its full lifespan up to 1900 CE, thinned to
# the snapshots where its territory meaningfully changes (README.md "Thinning").

name = "cliopatria"
title = "Cliopatria: historical empires, 3400 BCE - 1900 CE"
url = "https://zenodo.org/api/records/13363121/files/Seshat-Global-History-Databank/cliopatria-v0.0.1.zip/content"
sha256 = "8ecffea9a5fe4b52e497886f56eabe6188d91c7cd1cdf7dd01054762112337ef"
licence = "CC BY 4.0 (confirmed both via the Zenodo record's own metadata, license.id == \"cc-by-4.0\", and the repository's committed LICENSE.md)"
citation = "Chalstrey, E., Bennett, J. & Mutch, E. (2024). Cliopatria: A geospatial database of world-wide political entities from 3400BCE to 2024CE (v0.0.1) [Data set]. Zenodo. https://doi.org/10.5281/zenodo.13363121. Methods: Bennett, J. et al., \"Cliopatria: a geospatial dataset of world historical polities\", SocArXiv preprint osf.io/24wd6. Seshat Global History Databank: https://seshatdatabank.info/"
# years BP, [oldest, newest] -- 3400 BCE .. 1900 CE against the fixed AD 2025 present (README.md
# "Time convention"). The raw dataset itself runs to 2024 CE; the curated domain stops at 1900 CE
# inclusive, so the newest snapshot ends at t = 124.0 -- README.md "Domain cutoff: 1900 CE".
time_domain = [5.425e3, 1.24e2]
output_shape = "FeatureSet"  # cliopatria_polities: one Feature per territory snapshot (label anchor, area, span)
interpolation = "step"  # a snapshot holds over its half-open span; the web crossfades between active sets, never morphs polygons
volume_bytes = 49215745  # measured: the Zenodo repository-archive zip actually downloaded (see README.md "Measured volume")
storage_tier = "git"  # the curated FeatureSet parquet and the ~3 MB geometry JSON are both plain git
outputs = [
    "data/media/vectors/cliopatria_territories-*.json",  # written by normalise.py's write_outputs() hook, content-hashed
]
