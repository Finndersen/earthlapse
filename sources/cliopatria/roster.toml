# The empire roster (ADR-059): the hand-picked lineages the globe's "Historical empires" layer
# draws. A lineage groups the Cliopatria polities a general audience reads as one continuing
# power (Rome -> Byzantium, the Chinese dynasties, the Mongol successor khanates), so they share
# one colour on the globe.
#
# `polity` must be a canonical Cliopatria name (normalise.py's `_canonical_name`: paren-stripped,
# aliases applied); normalise.py refuses the build naming every member that matches no window.
# A polity may appear in only one lineage. `from`/`to` (CE years, inclusive, negative = BCE)
# clamp a member's windows; `label` replaces the polity name on the globe. `anchor = [lat, lon]`
# places the label of every snapshot of the member, in place of each snapshot's representative
# point; it is set only where that point is a poor label spot (overseas for a colonial series,
# somewhere unrecognisable for a far-flung empire, or jumping between snapshots), and names the
# member's capital or core for its era. `wikipedia` is the English Wikipedia article title,
# copied from the raw rows' own `Wikipedia` property except where that names a place or a
# process rather than the polity, or differs across the member's windows; there it is one
# chosen title.
#
# `description` (at most 320 characters) is the lineage's info-card text and `events` the
# data/events.yaml ids that concern it; publish refuses an id that is not a published event.
# Neither, nor `wikipedia`, changes the curated data.
#
# `colour_slot` (0..7) indexes the web's empire palette. Slots come from a greedy colouring,
# most famous lineages first, so two lineages that are ever active at the same time within ~10
# degrees of each other never share one. They are written out explicitly so inserting a
# lineage later does not recolour the rest.


