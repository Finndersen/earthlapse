# Optional. Repo-relative glob patterns for side-effect files an optional write_outputs()
# hook in normalise.py writes outside data/curated/ (e.g. generated globe textures). Omit
# entirely if this source has none. pipeline.databuild records, per glob, how many files it
# matched at build time, and treats the source as stale again if a later run finds a
# declared glob matching nothing, or fewer files than were recorded -- e.g. someone deleted
# the generated media. See CONTRIBUTING.md "Optional write_outputs hook".
# outputs = ["data/media/textures/<name>/*.png"]
