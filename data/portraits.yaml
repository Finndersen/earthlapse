      - "Dayel, M.J. & King, N. (2014) 'Prey Capture and Phagocytosis in the Choanoflagellate Salpingoeca rosetta', PLOS ONE (PMC4012994): apical flagellum within a collar of actin-filled microvilli; rosette cells face radially outward"
    gaps:
      - the stem holozoan itself is unknown; it is modelled on a living choanoflagellate colony, a model and not a claim of identity
    subject:
