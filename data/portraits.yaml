# portraits -- one "photoreal specimen plate" per lineage node (ADR-015, VISUAL_SPEC §10).
#
# Keyed by lineage node id (data/lineage.yaml). Rendered from text only (ADR-010):
#
#   prompt = PORTRAIT_STYLE + PLATE_TYPE[plate] + render_portrait_subject(subject)
#
# (pipeline/prompts.py). The plate camera is invariant; only the organism changes.
#
# Fields
# ------
#   plate      SPECIMEN (multicellular, whole organism, side profile facing right) or
#              MICROSCOPE (a cell or small colony, darkfield micrograph).
#   evidence   fossil | extant-proxy | reconstruction. `reconstruction` and `extant-proxy`
#              are enforced to appear in `subject.organism` (as "reconstruction" / "proxy"),
#              so a hypothetical ancestor is never prompted as if it were a specimen.
#   sources    what the subject text was checked against, in September 2026, by web search
#              and fetch of the paper or an authoritative page. Primary literature where it
#              could be reached; where only a secondary summary was reachable, `gaps` says so.
#   gaps       what those sources do not settle. The anatomy text never fills a gap with an
#              unchecked claim; the model's own plausible rendering fills it, and review
#              judges it. Empty when nothing is open.
#   subject    organism / anatomy / surface / size (null where no source gave one) / absent.
#   pin        written by `earthtime review portraits pick`; never edit by hand.
#
# Not every lineage node needs a plate: the viewer shows the nearest older plate.
#
# Deliberately omitted: `deuterostomia`. Its lineage representative, Saccorhytus coronarius,
# was reinterpreted as an early ecdysozoan, not a deuterostome (Liu, Y. et al. 2022 Nature,
# "Saccorhytus is an early ecdysozoan and not the earliest deuterostome",
# doi:10.1038/s41586-022-05107-z). A plate of it would show a non-ancestor. The representative in
# data/lineage.yaml needs a human decision; until then the viewer holds the Kimberella plate.
#
# Style gate (generate these four first and approve the look before the rest):
#   leca (MICROSCOPE), bilateria (early animal), tetrapodomorpha, homo-erectus.

portraits:
  # ------------------------------------------------------------------ microscope plates

  - id: luca
    plate: MICROSCOPE
    evidence: reconstruction
    sources:
      - "Moody, E.R.R. et al. (2024) Nature Ecology & Evolution 8, 1654-1666, doi:10.1038/s41559-024-02461-1 (LUCA 'a prokaryote-grade anaerobic acetogen')"
    gaps:
      - cell shape, size and motility are not constrained by the source
    subject:
      organism: "A reconstruction of LUCA, the last universal common ancestor of all cellular life, a single prokaryote-grade cell; no fossil of it exists"
      anatomy: "one small, simple cell with no nucleus and no internal compartments, a plain unornamented outline and a smooth cell envelope"
      surface: "translucent and colourless, glowing faintly against the black field"
      size: null
      absent: ["a nucleus", "visible organelles", "flagella or hairs of any kind", "a group of cells"]
    pin: {asset_digest: "55a8a83a3e0b58ad", path: "data/candidates/portraits/luca/bf40cc93c7d28d1b/01-55a8a83a3e0b58ad.jpg"}

  - id: archaeal-host-lineage
    plate: MICROSCOPE
    evidence: extant-proxy
    sources:
      - "Imachi, H. et al. (2020) 'Isolation of an archaeon at the prokaryote-eukaryote interface', Nature 577, 519-525 (PubMed 31942073): small non-motile cocci ~300-750 nm, membrane vesicles, chains of blebs, long often branching protrusions"
    gaps:
      - the ancestral host cell is unknown; the living proxy stands in for it
    subject:
      organism: "A living Asgard archaeon, Promethearchaeum syntrophicum, shown as a modern proxy for the archaeal lineage that became the host of the eukaryotic cell"
      anatomy: "a small round cell (a coccus) sending out long, thin, often branching membrane protrusions, with chains of small blebs and tiny membrane vesicles around it; non-motile"
      surface: "a translucent pale membrane, glowing faintly against the black field"
      size: "a cell body about 300 to 750 nanometres across"
      absent: ["a nucleus", "a flagellum", "visible internal organelles", "a photo print border, mat or mount", "a book, album page or table surface", "a curled or torn photo corner"]
    pin: {asset_digest: "cbaa84828438551c", path: "data/candidates/portraits/archaeal-host-lineage/835f3602c6440e42/01-cbaa84828438551c.jpg"}

  - id: leca
    plate: MICROSCOPE
    evidence: reconstruction
    sources:
      - "Koumandou, V.L. et al. (2013) 'Molecular paleontology and complexity in the last eukaryotic common ancestor', Crit. Rev. Biochem. Mol. Biol. (PMC3791482): LECA a flagellated heterotroph with mitochondria, nucleus, endomembrane system"
      - "Mills, D.B. et al. (2022) 'Ancestral State Reconstructions Trace Mitochondria But Not Phagocytosis to the Last Eukaryotic Common Ancestor', Genome Biol. Evol. evac079: mitochondria, no plastids; phagotrophy contested"
      - "Skejo, J. et al. (2021) 'Evidence for a Syncytial Origin of Eukaryotes from Ancestral State Reconstruction', Genome Biol. Evol. 13(7) evab096 (PMC8290118): a multinucleated stage likely"
    gaps:
      - the number of flagella is not constrained by these sources
      - whether LECA fed by phagocytosis is contested, so no engulfed prey is shown
      - a multinucleate (syncytial) stage is proposed; the plate shows one uninucleate cell
    subject:
      organism: "A reconstruction of LECA, the last eukaryotic common ancestor, a single-celled heterotrophic protist; no fossil of it exists"
      anatomy: "a single rounded cell with a large, clearly visible nucleus, many small granular mitochondria in the cytoplasm, fine internal membranes, and flagella"
      surface: "a translucent, colourless cell, its internal structures faintly lit in darkfield"
      size: null
      absent: ["chloroplasts or any green pigment", "a cell wall, shell or scales", "engulfed prey", "a group of cells"]
    pin: {asset_digest: "c276b4a3154b29a5", path: "data/candidates/portraits/leca/96d97bf5af289df9/01-c276b4a3154b29a5.jpg"}

