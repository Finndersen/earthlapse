      - "Nature News & Views (2024) 'Spongy but not glassy: Ediacaran fossil provides insight into early animal evolution', d41586-024-02033-0: Ediacaran sponges without mineral spicules"
      - "Nettersheim, B.J. et al. (2019) Nature Ecology & Evolution, doi:10.1038/s41559-020-01334-7: sponge biomarkers negated; earliest sponge timing contested"
    gaps:
      - that the first animals were sponge-grade is widely held but contested
      - sponge body-wall anatomy (pores, a top opening) was not confirmed against a source this session
    subject:
      organism: "A reconstruction of an early sponge-grade animal from the base of the animal tree, no fossil of the ancestor itself is known"
      anatomy: "a small, soft, hollow body standing upright, attached to the surface at its base by a single flat attachment point, not forked or split into limbs, its wall perforated by many tiny pores, one larger opening at the top, entirely soft-bodied with no mineral spicules"
      surface: "a pale, soft, slightly translucent body wall; no source gives its colour, so muted natural tones"
      size: null
      absent: ["glassy or chalky spicules", "tentacles", "a head, face, mouth or eyes", "a snout, nose or mouth-like mark", "a gut", "limbs", "a forked or foot-like base", "a coral, sea anemone or jellyfish", "a plant, seaweed, fungus or mushroom", "a vase, bottle, bag or any other made object"]
