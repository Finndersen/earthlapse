      size: null
      absent: ["tissues or organs", "a shell or spicules", "chloroplasts or any green pigment"]
    pin: {asset_digest: "5973dd6f36eff417", path: "data/candidates/portraits/holozoa/b72835947554c506/01-5973dd6f36eff417.jpg"}

