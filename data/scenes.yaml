      vegetation: the same broadleaf trees, bald cypress and fan palms, now bare and grey with ash, their leaves and needles gone
      fauna: no living dinosaur; the carcass of one of the duck-billed dinosaurs from kpg-arrival's herd lies half in the shallows, undisturbed
      main_subject: the carcass of one of the same duck-billed dinosaurs, its flat beak and heavy tail still recognisable, lying on its side half in the shallows where it died
      ground: ash-grey mud littered with charred fallen branches and a thin drift of fine grey ash
