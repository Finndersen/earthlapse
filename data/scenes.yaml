  # rock (the Parthenon itself keeps its freshly painted marble -- it is newly finished, per the
  # caption, so its own surfaces are not aged); `sky_and_light` changes from a clear cloudless sky
  # to a hazy, sun-bleached one with dust in the air, matching the pale, hazy skies already used
  # in mohenjo-daro and qin-xianyang-epang-palace. No architectural, crowd or composition change.
