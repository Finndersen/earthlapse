      vegetation: on the wet rock just above the waterline, a thin, dark-green crust of tiny liverwort-grade plants only millimetres tall, with no stems, leaves or roots; nothing grows further inland, which stays bare rock
      fauna: straight-shelled nautiloid cephalopods drifting in the shallows; brachiopods and crinoids encrusting the reef rock; no animals on land
      main_subject: a dark-green film of tiny liverwort-grade plants spreading across the wet rock at the tideline
      ground: bare, pale, wave-smoothed limestone, grey everywhere but for the plant patches near the water
