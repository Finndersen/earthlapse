  # 1995, the Brazilian Amazon's worst year of satellite-recorded deforestation (events.yaml
  # amazon-deforestation, t_min/t_max 21-37, 2004-1988); t = 2025 - 1995 = 30. Removes and replaces
  # aral-sea-drying (2026-09-18, the user found "The Shrinking Aral Sea" too obscure and asked for
  # "amazon deforestation and chernobyl" instead). Year chosen for having an actual per-year figure
  # to cite, not a round guess: Wikipedia "Deforestation of the Amazon rainforest" (accessed
  # 2026-09-18), citing INPE's PRODES satellite programme, gives annual clearing of 21,050 km^2
  # (1988), 29,059 km^2 (1995) -- by a wide margin the highest annual total in the record up to
  # then, roughly double every neighbouring year (18,161 km^2 in 1996, 13,227 km^2 in 1997) -- and
  # 27,772 km^2 (2004), a second peak; by 1995, 70% of previously forested land in the Amazon (91%
  # of land deforested since 1970) had been converted to cattle ranching. The brief's chosen
  # subject: "the hard edge between cleared, burning or burnt ground and standing primary forest --
  # the 'fishbone' pattern of roads and side-clearings is the visually distinctive signature."
  # Rondônia is the standard example of this pattern (colonisation along highway BR-364 from the
  # 1970s, Wikipedia "Rondônia"), used here as a representative setting for the fishbone signature
  # rather than one surveyed clearing, like green-revolution-fields' composite Punjab field.
  # GROUND's low, close, shallow-depth-of-field framing cannot show the pattern from above the way
  # a satellite image does, so it is read in the frame instead as a freshly cut side-road opening
  # into the forest wall at an angle, with more such cuts repeating into the middle distance -- the
  # signature rendered at ground level rather than aerially. Kept in open-ground (GROUND),
  # continuing the run from chernobyl-exclusion-zone and berlin-wall-fall. TONE: documentary, no
  # people, matching aral-sea-drying's own convention for a scene about environmental loss.
  - id: amazon-deforestation-fishbone
