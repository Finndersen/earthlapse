  # t = 6.604299999e7 (66,042,999.99 yr ago): ~3.65 days after kpg-arrival's impact instant
  # (66,043,000 yr ago). Inside events.yaml's k-pg-impact window (66.032-66.054 Ma) and its
  # k-pg-aftermath fern-spike window (66.038-66.043 Ma). The extra decimal digits are needed to
  # keep this scene's t distinct and correctly ordered between its neighbours
  # (pipeline/scenes.py forbids a duplicate t) while staying "a few days," not "a few years."
  #
  # By this point fine silicate dust, soot and sulfate aerosol lofted by the impact had spread
  # worldwide and cut incoming light well below the photosynthesis threshold, a darkness
  # modelled to last a year or more (Senel, C.B. et al. (2023), "Chicxulub impact winter
  # sustained by fine silicate dust," Nature Geoscience — exact volume/page not verified this
  # session; Tabor, C.R. et al. (2020), "Causes and climatic consequences of the impact winter
  # at the Cretaceous-Paleogene boundary," Geophysical Research Letters 47(3) — issue/page not
  # re-verified this session). The dead, part-scorched trees reflect the ejecta-spherule
  # re-entry heat pulse in the hours after impact (Robertson, D.S. et al. (2004), "Survival in
  # the first hours of the Cenozoic," GSA Bulletin 116(5-6), 760-768), but how far that pulse
  # actually ignited vegetation worldwide is contested: Robertson's own 2013 reassessment (J.
  # Geophys. Res. Biogeosci. 118(3), 1006-1014 — title not re-verified this session) and
  # Belcher, C.M. et al. (2003), "Fireball passes and nothing burns... evidence from the
  # charcoal record of North America," Geology 31(12), 1061-1064, argue the charcoal record
  # does not support a truly global firestorm. Kept honestly open here: the forest reads as
  # killed and part-scorched, not mid-blaze, and the caption says the fire's reach is debated.
  # No dinosaur appears alive, at most a carcass, and no crater or asteroid is visible — this is
  # the same ~3,300 km-distant Hell Creek-type coastal plain as kpg-arrival and cretaceous-forest.
  - id: kpg-darkness
    t: 6.604299999e7
    chapter: waters-edge
    shot: WATER_EDGE
    caption: Days after the impact, a pall of dust and soot blots out the sun over the same estuary; whether the impact's heat set forests alight this far away is still debated.
    unsourced:
      o2_percent: 27  # rounded, unchanged from kpg-arrival: atmospheric O2 does not move on a scale of days
      mean_temp_c: 18  # rounded: only days in, cooling has barely begun; the modelled impact winter deepens over the following months (Tabor et al. 2020)
    subject:
