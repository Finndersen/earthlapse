  # About 2300 BCE, the Mature ("Integration Era") Harappan phase of the Indus Valley
  # Civilisation, conventionally c. 2600-1900 BCE (Wikipedia "Indus Valley Civilisation"); t =
  # 2025 + 2300 = 4,325: mid-phase, so it does not sit beside giza-great-pyramid (t = 4,585)
  # and still falls before the 4.2 ka aridification (events.yaml 4-2-kiloyear-event). Mohenjo-daro, on the
  # Indus floodplain in Sindh, grew to tens of thousands of people in this phase (30,000-60,000
  # is the commonly cited range for the largest Harappan cities) laid out on a strict street
  # grid, with fired-brick houses drained by covered brick sewers running beneath the streets --
  # "waste water was channeled to covered drains that lined the major streets" -- and served by
  # over 700 wells, "one well for every three houses" (Wikipedia "Mohenjo-daro"). Framed on a
  # street corner, not another riverbank: giza-great-pyramid already ends the run on water, and
  # the brief asks for open ground/a street here. No palace or temple is shown, and no ruler:
  # decades of excavation have found no monumental royal or religious architecture at
  # Mohenjo-daro, and the so-called "Priest-King" is a modern archaeological label for a
  # sculpture, not an attested title (Wikipedia "Mohenjo-daro") -- the absence of a visible
  # elite is as distinctive and attested as the Great Bath itself, so the scene depicts
  # ordinary street life, not a monument. The Indus script remains undeciphered, so no legible
  # writing is shown. New event indus-valley-urbanism added (events.yaml) since no existing
  # event covers the Indus civilisation.
