  # earliest megafossils are Silurian, so the plants are shown as a millimetre-scale film. Reef life
  # per great-ordovician-biodiversification (Fan et al. 2020, Science 367(6475), 272-277).
  - id: ordovician-reef-shore
    t: 4.5e8
    chapter: waters-edge
    shot: WATER_EDGE
    caption: The first land plants, known only from their spores and probably no bigger than a film on wet rock, cling to the tideline while a reef of shelled animals builds offshore.
