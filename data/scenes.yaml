  # ~425 Ma, at the Cooksonia end of events.yaml land-plants (t_min = 425 Ma): Edwards, D., Fanning,
  # U. & Richardson, J.B. (1994), Silurian Cooksonia macrofossils. Cooksonia is a transitional
  # stem-group form, not demonstrably vascular: only one species shows conducting tissue, the
  # oldest species (C. barrandei) is ~432 Ma, and the plants were a few centimetres tall. In
  # over-under (ADR-025), the last split scene before life comes ashore at rhynie-chert.
  # One environment only: a shallow, restricted Euramerican lagoon. Eurypterus lived on the coasts
  # and in the shallow, hypersaline inland seas of Laurussia, 432-418 Ma, 13-23 cm long (Wikipedia,
  # Eurypterus), so there is no reef patch and no brachiopods. The fish are small anaspid-grade
  # jawless fish like Birkenia (up to 10 cm, Silurian of Great Britain, Scandinavia and Estonia;
  # Wikipedia, Birkenia), the same region as Estonian Eurypterus; direct co-occurrence in one bed
  # is UNVERIFIED this session. Jawed fish are left out: Guiyu oneiros (~425 Ma; Zhu, M. et al.
  # 2009, Nature 458, 469-474) comes from open-marine strata in South China, a different continent
  # and setting.
