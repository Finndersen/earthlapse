  # About 6000 BCE / 8,000 BP, within the African Humid Period ("Green Sahara"); distinct from
  # neolithic-river-settlement's t = 9,000 (Fertile Crescent, unrelated region and story) as the
  # brief requires. One of the many seasonal and permanent lakes that filled the central and eastern
  # Sahara at this time, comparable to the lake documented at Gobero in the Ténéré Desert, Niger,
  # where a fisher-forager community (the "Kiffian", to about 8,000 BP) and a later cattle-herding
  # community (the "Tenerian", from about 7,000 BP) are both attested at the same lakeside site
  # (Sereno et al. 2008, "Lakeside Cemeteries in the Sahara: Five Thousand Years of Holocene
  # Population and Environmental Change", PLOS ONE; Wikipedia "African humid period", "Gobero").
  # t = 8,000 sits at the transition between the two attested cultures, so this scene shows fishing
  # and early cattle-herding together, both plausible at this date. Dromedary camels are excluded:
  # they were not present in the Sahara until roughly the 1st millennium BCE.
