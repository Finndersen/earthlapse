  - id: modern-city
    t: 0.0
    chapter: waters-edge
    shot: WATER_EDGE
    caption: The present, where a city of glass and concrete lines a river and one species reshapes the planet's surface in a geological instant.
    unsourced:
      o2_percent: 21  # modern
      mean_temp_c: 15  # rounded: present global mean
    subject:
      setting: The waterfront of a large modern city on a wide river in the present day
      left_mass: a cluster of tall modern glass-and-concrete high-rise towers
      vegetation: planted street trees along the embankment promenade
