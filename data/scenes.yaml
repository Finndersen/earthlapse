  # About 430 BCE, the Age of Pericles; t = 2025 + 430 = 2,455. New scene, continuing the gap
  # between giza-great-pyramid and imperial-rome-pantheon. Pericles' building programme, funded
  # from the Delian League's treasury, "generated most of the surviving structures on the
  # Acropolis, including the Parthenon" (Wikipedia "Pericles"); the Parthenon itself was
  # dedicated 438/439 BCE with its sculptural decoration finished by 432 BCE (Wikipedia
  # "Parthenon"), so by 430 BCE it stands newly complete, its marble "originally coloured" --
  # picked out in paint and gilding, not the bare white stone of today. The Propylaea gatehouse
  # was likewise finished in 432 BCE and is shown complete; the Temple of Athena Nike (begun c.
  # 427 BCE) and the Erechtheion (begun 421 BCE, after the Peace of Nicias) both postdate this
  # scene and are named in `absent` against the model adding either by default. Framed from the
  # Athenian Agora looking up at the Acropolis, per the brief, rather than at another riverbank:
  # the Agora is Athens's inland civic marketplace, well back from the port at Piraeus, so no
  # water belongs in the frame. New event periclean-athens added (events.yaml) since no existing
  # event covers classical Greece.
  #
  # Revision 2026-09-17: the single candidate generated from the record above was rejected on
  # review by both an agent and the human lead, for three reasons. (1) It read as a CGI/
  # video-game render, not a photograph. (2) Several foreground men had individually
  # distinguishable faces. (3) The large two-storey colonnaded building at left matched the Stoa
  # of Attalos -- "built by and named after King Attalos II of Pergamon, who ruled between 159
  # and 138 BC" (Wikipedia "Stoa of Attalos"), a Hellenistic building of roughly 150 BCE, about
  # 280 years too late for this 430 BCE scene. Fixes:
  # - `left_mass` now names the Stoa Poikile (Painted Stoa) instead of a generic "stoa": it was
  #   "erected around 460 BC on the north side of the Ancient Agora of Athens" (Wikipedia "Stoa
  #   Poikile") and combined "a Doric colonnade on the southern (front) facade" with an interior
  #   Ionic order -- already three decades old and an unremarkable fixture of the square by 430
  #   BCE, unlike the Stoa of Attalos, which did not yet exist. Two other period-appropriate
  #   buildings named in the task brief were considered and set aside: the Royal Stoa (Stoa
  #   Basileios), in continuous use since the Archaic period but "one of the smallest known Greek
  #   stoas" at "17.72 metres long ... and 7.18 metres wide" (Wikipedia "Stoa Basileios"), too
  #   modest to read as the composition's left mass; and the Hephaisteion, whose "construction
  #   started in 449 BC" but whose cult images were only installed during "the Peace of Nicias
  #   (421-415 BC)" (Wikipedia "Hephaestus Temple"), so it cannot honestly be shown finished in
  #   430 BCE. The generic term "a colonnaded stoa" is itself suspected of pulling the model
  #   toward the Stoa of Attalos, the only Agora stoa substantially reconstructed and
  #   photographed today, so `left_mass` now also gives an explicit single-storey physical
  #   description rather than relying on the building type alone, and `absent` forbids the
  #   two-storey building by name.
  # - `main_subject` no longer stages a man addressing two listeners -- a composition close to
  #   genre-game promotional art for this exact setting (Athenian Agora, himation-wearing crowd,
  #   Acropolis behind) -- and instead puts market-goers at a stall in the middle distance, backs
  #   turned or in profile, incidental to the frame and too far and too obliquely angled for any
  #   face to resolve. `absent` now also forbids any figure posed toward the camera or grouped in
  #   conversation facing the viewer, rather than relying on "identifiable faces" alone to rule
  #   out a failure the composition itself invited.
  #
  # Revision 2026-09-17 (b): the architecture and figure fixes above landed, but the human lead
  # judged the pinned candidate still reads as an architectural/game render rather than a
  # photograph -- compared side by side against mohenjo-daro and qin-xianyang-epang-palace, both
  # of which pass. The two passing records share dust, haze, surface grime, uneven weathering and
  # atmospheric depth that this record's `subject` fields lacked: its sky was a cloudless, evenly
  # graded blue with no haze, its stoa plaster and ground read uniformly clean, and nothing
  # anchored the scene in dust or grime the way the other two do. Fixes, all physical/in-world,
  # none a camera or post-processing instruction: `left_mass` now gives the Stoa Poikile
  # sun-bleached, stained plaster and chipped, dust-filmed stucco; `ground` adds chipped paving
