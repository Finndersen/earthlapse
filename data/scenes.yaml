  # permian-conifer-forest (294 Ma) without colliding with either. Gondwanan ice sheets at this time
  # covered large areas of present-day South America, southern Africa, India, Antarctica and
  # Australia (Isbell et al. 2003, "Timing of late Paleozoic glaciation in Gondwana", Journal of
  # African Earth Sciences; Montañez & Poulsen 2013, "The Late Paleozoic Ice Age: An Evolving
  # Paradigm", Annual Review of Earth and Planetary Sciences; Wikipedia "Late Paleozoic icehouse").
  # Direct glacial evidence — striated pavements, tillites, dropstones in marine sediment — is well
  # documented at Gondwanan high latitudes for this interval. Glossopteris, the index seed-fern of
  # the Gondwanan Permian flora, first appears close to the Carboniferous-Permian boundary and
  # colonised freshly deglaciated ground; shown here sparse and pioneering, not as an established
  # forest, since dense Glossopteris forests are better attested somewhat later in the Permian. No
