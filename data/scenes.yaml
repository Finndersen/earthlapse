    pin: {asset_digest: "38be5a9c75c4f90a", path: "data/candidates/ordovician-reef-shore/2c83c3436cd15b3f/02-38be5a9c75c4f90a.jpg"}

  # ~425 Ma, at the Cooksonia end of events.yaml land-plants (t_min = 425 Ma): Edwards, D., Fanning,
  # U. & Richardson, J.B. (1994), Silurian Cooksonia macrofossils. Only one Cooksonia species shows
  # conducting tissue and the plants were a few centimetres tall. Eurypterus-type sea scorpions were
  # ~13-23 cm long. Guiyu oneiros, ~425.6 Ma: Zhu, M. et al. (2009), Nature 458, 469-474. Jawed
  # vertebrates are older still: Zhu, Y.-a. et al. (2022), "The oldest complete jawed vertebrates
  # from the early Silurian of China," Nature 609, 954-958 (Xiushanosteus, ~435 Ma), so the caption
  # does not call these the first jawed fish.
  - id: silurian-shore
    t: 4.25e8
    chapter: waters-edge
    shot: WATER_EDGE
    caption: Cooksonia, among the earliest plants with water-conducting stems, fringes a Silurian shore where sea scorpions crawl and early bony fish swim in the shallows.
    unsourced:
      o2_percent: 16  # rounded
