  # ~450 Ma, inside events.yaml land-plants (425-470 Ma) on the cryptospore side: Rubinstein, C.V. et
  # al. (2010), "Early Middle Ordovician evidence for land plants in Argentina," New Phytologist
  # 188(2), 365-369. Ordovician land plants are known only from cryptospores (~470 Ma onward); the
  # earliest megafossils are Silurian, so the plants are shown as a millimetre-scale film. Reef life
  # per great-ordovician-biodiversification (Fan et al. 2020, Science 367(6475), 272-277). In
  # over-under (ADR-025), so the reef becomes the subject below the surface and the plant film
  # sits above it. Land plants came from freshwater green algae and the earliest ones needed
  # waterlogged ground (Wikipedia, Evolutionary history of plants), so the film grows on damp
  # rock by a freshwater seep above the splash zone, not in the salt-spray tideline. Late
  # Ordovician tabulate and rugose corals, bryozoans and crinoids: Webby, B.D. et al., eds. (2004),
  # The Great Ordovician Biodiversification Event, Columbia University Press (UNVERIFIED this
  # session: not re-checked). Endoceras-type orthocone nautiloids are 470-443 Ma with shells to
  # ~3 m; 1 m is deliberately smaller. Mature Endoceras were probably ambush predators lying on
  # the sea floor, so the animal hovers low over the reef rather than cruising. Only the shell is
  # known: tentacle count and form, and the shell's colour banding, are reconstructions from
  # living cephalopods. Starfish and jawless fish both existed, so neither is forbidden.
  - id: ordovician-reef-shore
