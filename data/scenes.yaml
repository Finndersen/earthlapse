  # The present day, t = 0 (events.yaml present), and the last scene of the timeline: Shenzhen,
  # designated China's first Special Economic Zone in May 1980, when it was a largely rural area of
  # about 30,000 people, and by 2025 a city of about 18.2 million, called "China's Silicon Valley"
  # and home to Huawei, Tencent, DJI and Oppo (Wikipedia "Shenzhen"). Framed on the Shenzhen Bay
  # waterfront, a composite of real landmarks rather than one surveyed sightline: Shenzhen Bay Park,
  # 13 km along the bay's north shore across Nanshan and Futian, opened in full 6 August 2011, with
  # mangroves and migrating birds (Wikipedia "Shenzhen Bay Park"); China Resources Headquarters,
  # "Spring Bamboo", 392.5 m, 2018, Houhai, Nanshan (Wikipedia "China Resources Headquarters");
  # Shenzhen Bay Sports Center, "Spring Cocoon", a perforated external steel skin on reclaimed land,
  # opened April 2011 (Wikipedia "Shenzhen Bay Sports Center"); Shenzhen Bay Bridge, cable-stayed,
  # opened 1 July 2007, from Nanshan to Ngau Hom Shek, Hong Kong (Wikipedia "Hong Kong–Shenzhen
  # Western Corridor"). The left-to-right placement is composed, not surveyed, but `far_bank` holds
  # only what really lies across the bay from the Houhai shore: the bridge and the New Territories
  # hills. Ping An Finance Centre and the Futian skyline are left out because they stand about
  # 10 km east, set back from the shore, not across the water, and a 599 m skyline would fight the
  # composition's low far bank. The white CR HQ crown, the white "cocoon" shell and the mangroves
  # carry the present-day read, not generic glass towers and a railed embankment. The drone is a generic small quadcopter: DJI is
  # Shenzhen-based (Wikipedia "Shenzhen"), but Meituan's 2023 urban drone deliveries are sourced
