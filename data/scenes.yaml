  # About 7000 BCE, when Çatalhöyük "flourished" per the excavation record (occupation c.
  # 7500-5600 BC; Wikipedia "Çatalhöyük", drawing on Mellaart's original 1961-1965 excavation
  # and Ian Hodder's Çatalhöyük Research Project, Cambridge, 1993-2018 -- Hodder's own
  # synthesis, "Çatalhöyük: The Leopard's Tale" (2006, Thames & Hudson), is the standard
  # popular account and is cited below for the site's architecture and social organisation);
  # t = 2025 + 7000 = 9,025, rounded to 9,000, the same slot neolithic-river-settlement held.
  # Replaces that record outright (user direction 2026-09-17): its "Neolithic village... beside
  # a slow river" was generic rather than naming a real site, and sat as the third of three
  # near-identical reed-boat waterlines in a row with green-sahara and uruk-city either side of
  # it. Çatalhöyük's own defining, attested feature is its layout, not a waterline: mudbrick
  # houses built wall to wall in a dense honeycomb "with no footpaths or streets" between them,
  # entered by ladder through a hole in the roof, so the rooftops served as the settlement's
  # thoroughfares (Wikipedia "Çatalhöyük"; Hodder 2006). Framed at rooftop level on open ground
  # (open-ground/GROUND), deliberately dry: this extends gobekli-tepe's open-ground run and
  # breaks the waterside repetition either side of the old slot (green-sahara, uruk-city), and
  # matches the site's own rooftop vantage rather than a riverbank. Wall paintings (hunting
  # scenes, aurochs and vultures, a landscape sometimes read as the world's oldest map) and
  # bucrania (cattle skulls mounted on walls) are both attested but are interior-room features
  # of individual houses, not visible from an exterior rooftop view, so neither is shown, and
  # both are named in `absent` against the model adding one to an outside wall. Obsidian tools
  # were used and traded for Mediterranean shell and Syrian flint (Wikipedia "Çatalhöyük"); a
  # hafted obsidian blade stands in for that trade, since a trade network itself has no visual
  # form. Sheep and goats show "animal penning and dung remains" consistent with herding or
  # management by this date; cattle are herded but not yet fully domesticated by the same
  # evidence, so the scene shows penned sheep/goats close in and wild aurochs only at a
  # distance, never a herded cattle herd. Retains the deleted record's start-of-farming story
  # via the same `agriculture` event link (events.yaml, 10,025-11,525 BP): Çatalhöyük's own
  # crops -- wheat, barley, peas, pistachio (Wikipedia "Çatalhöyük") -- sit squarely inside that
  # established farming economy, so the link carries forward unchanged.
