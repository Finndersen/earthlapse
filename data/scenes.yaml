  # "Urbanization", citing UN population data: "just 15% of the world's population lived in
  # cities" in 1900; "in 2007, more than 50% of the world population was living in cities, for
  # the first time in human history" -- the sourced figure behind this scene's caption and its
  # linked event, urban-majority-milestone. Kept in waters-edge (WATER_EDGE), continuing the run
  # unbroken from smartphone-seafront-2018 through to shenzhen-bay-present: no chapter cut is
  # introduced by this scene.
  # Review fixes (2026-09-15): dated "about 2021" specifically, the setting contradicted the
  # picture -- packed crowds and full office floors with no face masks read wrong for the
  # pandemic-era low point in commuting -- so `t` keeps its 2021 value (the >=3-year spacing from
  # smartphone-seafront-2018/shenzhen-bay-present) but setting/caption now read "the early 2020s"
  # rather than naming the year. `setting` dropped its camera-position clause (ADR-008 -- the WATER_EDGE
  # shot already fixes the viewpoint, and "along a crowded pedestrian bridge" contradicted its own
  # "looking level along the shore"). The desk workers (the brief's "desk jobs shown from outside,
  # keeping the outdoor shot") moved from the office tower's upper floors and the far bank's whole
  # grid of windows -- both physically unreadable from a camera 1 m above the waterline, looking
  # into daylight-lit glass across a wide river -- onto the lowest two floors of the near left_mass
  # building, close enough and low enough to read at eye level; far_bank is now a plain skyline
  # with no claimed interior detail. main_subject dropped the pedestrian bridge (composition caps
  # it at about a fifth of frame width; a metro entrance, a crowd descending it, and a crowd also
  # streaming onto a bridge above was three subjects competing for that space), leaving the metro
  # entrance and its commuter stream. left_mass/vegetation/fauna/water were also reworded --
  # different building height and material, different tree and bird species, a tidal river rather
  # than a lake-calm one -- so the frame reads as its own place rather than a generic river
  # embankment. It replaces the earlier generic `modern-city` waterfront (t = 15) outright, at
  # the user's request (2026-09-15): the two frames were too alike to earn both slots.
