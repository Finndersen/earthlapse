      left_mass: a wall of intact primary rainforest canopy, dense and unbroken, towering at the clearing's edge
      vegetation: on the cleared side, blackened stumps, felled trunks and ash-grey scorched undergrowth; on the forest side, dense vines, buttress roots and understorey palms
      fauna: none visible; a haze of smoke drifts low across the clearing
      main_subject: a freshly cut side-clearing running back at an angle from the road into the forest -- the fishbone pattern of colonisation roads -- cut logs stacked along its edge and a burn still smouldering across the newly cleared ground
      ground: a rutted red-earth dirt road running along the clearing's edge, littered with fallen branches and burnt debris
      water: none in the frame
      far_bank: no far bank; more side-clearings recede into the forest in the middle distance, each cut at the same angle from the road, smoke rising from several
