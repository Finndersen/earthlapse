      ground: wet, rippled grey sand and flat grey rock slabs streaked with rusty orange iron staining
      water: shallow, calm, warm tidal water, faintly green-grey
      far_bank: low, bare volcanic hills in grey and rust tones, with no green anywhere
      sky_and_light: a hazy, pale orange sky rather than a blue one; soft, slightly dim, warm diffuse light
