  # 210 BCE, the year Qin Shi Huang dies; t = 2025 + 210 = 2,235 (within the Qin dynasty's own
  # 221-206 BCE span, events.yaml qin-unification). Chosen over the alternatives the brief
  # raised -- a Han Chang'an Silk Road caravan, or the Ming Great Wall everyone already
  # pictures -- because neither fits 210 BCE: Han Chang'an did not yet exist (founded 202 BCE,
  # its walls finished 191 BCE, Wikipedia "Chang'an"), and the Silk Road caravan trade the brief
  # suggested only opens under Emperor Wu decades later, after Zhang Qian's mission of the
  # 130s BCE -- roughly eighty years after this scene's date; the Great Wall the brief warns
  # against is Ming-era stone, whereas the Qin wall itself (General Meng Tian's project) was
  # "rock over mountain ranges, rammed earth over the plains" (Wikipedia "Qin Shi Huang") and,
  # regardless of material, lies far to the north of the capital this scene frames. Xianyang,
  # the actual Qin capital, is "the only capital city in China that did not require walls to be
  # built around it" (Wikipedia "Qin dynasty") and by tradition held a network of "over 200"
  # palaces across the Wei valley linked by covered elevated roads (Wikipedia "Qin Shi Huang",
  # "Xianyang"). Framed instead on the one Qin building project that is both distinctive and
  # precisely dateable to this year: the Epang (Efang) Palace, begun 212 BCE and still
  # unfinished at Qin Shi Huang's death in 210 BCE -- 1950s-60s excavation of its rammed-earth
  # foundation platform (1,320 m by 420 m, 8 m high) found "possibly only the front hall"
  # raised on it, not the lavish completed palace later legend describes (Wikipedia "Epang
  # Palace"). The scene therefore shows the platform still under construction, not a finished
  # building. Black was the Qin state colour by the Mandate of the Five Elements, "the
  # preferred colour for Qin garments, flags, and pennants" (Wikipedia "Qin Shi Huang"), worn
  # here by the overseeing official. New event qin-unification added (events.yaml) since no
  # existing event covers Qin China.
