  # "Precise age of Bangiomorpha pubescens dates the origin of eukaryotic photosynthesis,"
  # Geology 46(2), 135-138 — the oldest fossil with differentiated reproductive cells and
  # complex multicellular organisation, a red alga.
  - id: boring-billion-shallows
    t: 1.047e9
    chapter: waters-edge
    shot: WATER_EDGE
    caption: In the climatically stable "Boring Billion," Bangiomorpha — the oldest known organism with differentiated sexual cells — grows in tidal pools on an otherwise still-lifeless shore.
    unsourced:
      o2_percent: 4  # rounded, contested: pre-Neoproterozoic-oxygenation estimates for this interval are low and disputed
      mean_temp_c: 18  # rounded: the "Boring Billion" is generally characterised as climatically stable and non-glacial
    subject:
      setting: A shallow intertidal pool on a barren coast, in the long, climatically stable interval nicknamed the "Boring Billion"
      left_mass: a low, weathered ledge of pale grey-buff dolostone, undercut at the waterline by tidal action
      vegetation: "none on land; in the shallows, dense mats of hair-fine, reddish-purple Bangiomorpha-like algal filaments lie slicked flat against the submerged rock like fine wet hair, their tips faintly banded where reproductive cells are differentiated, alongside plain microbial mats; nothing stands upright out of the water"
      fauna: none; no animals exist yet, nothing grazes or moves among the algae
      main_subject: "dense reddish-purple fringes of hair-fine Bangiomorpha-like algal filaments carpeting the submerged rocks of a broad tidal pool, lying low and slicked flat by the water like fine wet hair, their tips swaying just below the surface"
      ground: bare, pale, ripple-marked dolostone, with a thin dried microbial crust above the tideline
      water: shallow, clear, still tidal water lying in rock pools
      far_bank: "a flat, barren tidal platform of pale rock running unbroken to a low grey coastline of bare rock only, utterly bare of anything green beyond the algae at the shore"
      sky_and_light: a clear, pale sky, less hazy than deep Archean time but not the saturated blue of a modern one; calm, even, cool light
      absent: ["land plants", "trees", "grass", "moss on land", "animals", "fish", "shells", "insects", "birds", "people", "grass tussocks", "reeds", "buildings", "ruins", "walls", "structures on the horizon", "boats"]
