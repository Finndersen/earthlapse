  # 5 m tall and weighing many tonnes, stand in circular/oval enclosures and are carved in low
  # relief with wild animals — foxes, boars, vultures, snakes, scorpions, aurochs, cranes — never
  # domesticated species. Framed on open ground on the ridge itself (ADR-020), not at water: the
  # site sits on a dry hilltop with no permanent spring or river nearby, part of what makes its
  # scale striking for a pre-agricultural society.
