      left_mass: a low bank of pale Silurian sandstone and shale, undercut where it meets the water
      vegetation: a low, wiry fringe of Cooksonia, leafless branching stems only a few centimetres tall, forked at the tips into small rounded spore capsules, growing in a band just above the waterline; nothing grows more than a few steps inland
      fauna: a eurypterid sea scorpion about 20 cm long, with a broad head shield, a pair of paddle-shaped rear legs and a narrow spine-like tail, resting half-buried in the sediment at the water's edge; small, bony-armoured jawed fish schooling in the shallows
      main_subject: a slender, bony-armoured jawed fish about 25 cm long with paired fins and a simple jaw lined with small teeth, swimming just below the surface near the Cooksonia fringe
      ground: bare, pale, ripple-marked sand and mud, with the Cooksonia fringe the only green in sight
      water: shallow, clear, calm coastal water
