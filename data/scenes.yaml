  # ~518 Ma, the Chengjiang biota (Yunnan, China): Yang, C., Li, X.-H., Zhu, M. & Condon, D.J.
  # (2018), "Geochronological constraint on the Cambrian Chengjiang biota, South China," Journal of
  # the Geological Society 175(4), 659-666. Shu, D. et al. (1999), "Lower Cambrian vertebrates from
  # south China," Nature 402, 42 (Haikouichthys, ~2.5 cm, on the vertebrate stem). Chengjiang was a
  # shallow, muddy, fast-sedimenting delta front (Maotianshan Shales), so the sea floor is shown
  # through slightly silty shallows at a shoreline, the way ediacaran-shallows shows its fauna, in
  # the one waters-edge chapter (ADR-014). Trilobites and Hallucigenia are documented at Chengjiang;
  # the radiodont is described as Amplectobelua-grade (up to ~90 cm), since the Chengjiang specimen
  # once assigned to Anomalocaris has been reclassified. Opabinia is Burgess Shale only and is not
  # depicted. No archaeocyathid reefs are recorded at Chengjiang.
  - id: cambrian-seafloor
    t: 5.18e8
    chapter: waters-edge
    shot: WATER_EDGE
    caption: On the Cambrian sea floor, most of the major animal groups alive today have appeared within a geologically brief interval, including, as a jawless swimmer no longer than a fingertip, our own.
    unsourced:
      o2_percent: 12  # rounded, contested: rising but still well below modern by the mid-Cambrian
      mean_temp_c: 25  # rounded: Cambrian climate is generally reconstructed as warm
    subject:
      setting: The shore of a shallow, muddy Cambrian sea, its sea floor crowded with newly diversified animal life and plainly visible through the shallows beside a barren coast
      left_mass: a tall, bare bank of layered grey-green mudstone and siltstone with no plants on it
      vegetation: none on land, which is bare rock and mud; underwater, only sparse patches of microbial mat on the mud, with a low mound of settled debris colonised by upright vase-shaped and stalked sponges
      fauna: "numerous trilobites crawling and half-buried in the mud; a small, soft-bodied, worm-like lobopodian with stubby paired clawed legs and spines along its back (Hallucigenia-grade) clinging to debris; a loose shoal of tiny, slender, translucent jawless swimmers about 2.5 cm long, eel-shaped with no separate tail fin and no paired fins, each with a pair of large eyes, a row of small gill openings behind the head, a single low fin fold along the back and zigzag muscle bands down the body"
      main_subject: "an Amplectobelua-grade radiodont up to 90 cm long, a flattened, soft-bodied swimming arthropod, its body built from broad, low, overlapping segments running its length, each segment carrying a soft, flexible flap along its side; along its back the segments meet in a smooth, even line with no ridge or crest of any kind; at the rear, a small fan of short, paired tail flaps, quite unlike a single continuous tail; large stalked eyes on the head; two jointed, spiny appendages reaching down and forward from the front of the head to grasp prey; on the underside of the head, a round mouth ringed with overlapping hard plates; its flanks are a uniform mottled grey-green with no paler underside; it glides low over the mud of the shallows toward a cluster of trilobites"
      ground: wet, soft grey-brown mud at the waterline, rippled and bare
      water: shallow, slightly silty, pale green-blue sea water, clear enough near the shore that the muddy sea floor and its animals are plainly visible
      far_bank: a low, barren coastline of grey mud and rock, with no green anywhere
      sky_and_light: a clear, pale-blue sky with thin high cloud; bright sunlight throwing soft caustics across the sea floor
      absent: ["land plants", "green vegetation on land", "jawed fish", "scaled fish", "ammonites", "corals", "crabs", "lobsters", "sharks", "modern fish", "reptiles", "mammals", "birds", "people", "fish-shaped predator", "dorsal fin", "dorsal ridge or crest", "forked tail fin", "two-lobed tail fin", "ray-striated tail rays", "fish-like countershading", "sleek torpedo-shaped body", "gill slits on the predator", "gill markings on the predator's head", "shark-like shapes", "centipedes"]
    pin: {asset_digest: "18445a4ae4e6c53c", path: "data/candidates/cambrian-seafloor/94120c4582b2fe38/03-18445a4ae4e6c53c.jpg"}

  # ~450 Ma, inside events.yaml land-plants (425-470 Ma) on the cryptospore side: Rubinstein, C.V. et
