# Scene records — the curated source of truth for `earthtime plan / build / review / publish`.
#
# One record per generated still. `t` is years before present (pipeline/shapes.py), chosen to
# sit inside the matching interval in data/events.yaml. Prompts are rendered from each record
# (pipeline/prompts.py): invariant style + shot + chapter composition + conditions + subject.
# Text only, no reference image (ADR-010).
#
# Conditions
# ----------
# CO2, day length, solar luminosity, land fraction and "your ancestor" come from
# `load_world(data/curated).at(t)`; where no source covers `t` the prompt says so rather than
# inventing a value. `unsourced` holds what no curated source covers yet: rounded, plausible
# figures, not citations, each commented. `null` means no defensible single figure exists.
#
# Chapters
# --------
# A chapter is a held composition: one shot and one framing (DESIGN §6). It may recur as several
# non-adjacent runs (ADR-020), but every boundary between runs of different chapters reads as a
# cut, so chapters follow composition, never one per scene. Gate v2 showed the WATER_EDGE framing
# holding across very different worlds (ADR-010), so waters-edge is the default. over-under holds
# one early run, archean-shore to silurian-shore, where the story is life under the water
# (ADR-025).
#
# Pins
# ----
# `pin` stays `null` until a human runs `earthtime review pick <scene_id> <n>`, which rewrites
# that one line. Keep each `pin:` on a single line. A pinned scene is never regenerated (ADR-005).

chapters:
  - id: molten-earth
    label: Molten Earth
    shot: WIDE_RIDGE
    composition: ridge-vista
  - id: waters-edge
    label: At the water's edge
    shot: WATER_EDGE
    composition: water-edge-series
  - id: open-ground
    label: On open ground
    shot: GROUND
    composition: open-ground
  - id: over-under
    label: Above and below the surface
    shot: SPLIT_LEVEL
    composition: split-waterline

scenes:
  # Moon-forming impact 4.35-4.52 Ga (events.yaml moon-forming-impact).
  - id: magma-ocean
    t: 4.5e9
    chapter: molten-earth
    shot: WIDE_RIDGE
    title: "The Magma Ocean"
    caption: In the aftermath of the Moon-forming impact, Earth's whole surface is a glowing ocean of magma beneath a looming, newborn Moon.
    unsourced:
      o2_percent: 0  # no free oxygen before biology
      mean_temp_c: null  # a molten surface has no meaningful global mean
    subject:
      setting: The surface of the newborn Earth in the aftermath of the Moon-forming impact, seen from a ridge of freshly chilled black crust
      left_mass: a jagged crag of black, glassy basalt crust, its cracks glowing orange-red with the heat beneath
      vegetation: none; the planet is lifeless, every surface bare rock or molten
      fauna: none
      main_subject: a towering lava fountain rising from a slowly churning current of incandescent magma, crusting black at its edges
      ground: cracked, still-hot black crust with orange light glowing through its fissures and wisps of rock vapour rising
      water: none; in place of any sea, a molten ocean of glowing orange-red magma runs to the horizon, skinned with drifting plates of black crust
      far_bank: no far bank; the magma ocean runs unbroken to the horizon under towering plumes of steam and ash
      sky_and_light: a dark, dense sky of vapour and ash lit orange from below by the glowing magma; an enormous Moon, many times its present apparent size, hangs low through a gap in the clouds
      absent: [water, snow, ice, plants, any living thing, green colour, people, buildings]
    # ADR-023 (v2): `volcanic` (felix.blume's Yasur crater-rim roar and eruption bursts) as a
    # `loop` above its 0.75 ambient -- the lava fountain in the foreground is the loudest thing here.
    sound: {stem: volcanic, mode: loop, gain: 1.0}
    framing: {focus: [0.68, 0.4], pan: 180}
    pin: {asset_digest: "28a947b4b5aa181a", path: "data/pins/scenes/magma-ocean/28a947b4b5aa181a.jpg"}

  # After the first ocean condensed (~4.4 Ga zircons) and before any evidence of life
  # (events.yaml first-life: 3.4-4.1 Ga).
  - id: hadean-ocean
    t: 4.3e9
    chapter: waters-edge
    shot: WATER_EDGE
    title: "Earth's First Ocean"
    caption: The first ocean steams against black volcanic shores, a world of water and rock with no life anywhere.
    unsourced:
      o2_percent: 0  # no free oxygen before biology
      mean_temp_c: 60  # contested: hot-early-ocean estimates run 40-80 °C, others argue temperate
    subject:
      setting: A shore of the first ocean on the young Hadean Earth, where a volcanic island rises from a hot, shallow sea
      left_mass: a tall, dark sea stack of black pillow basalt, streaked rust-red and white with mineral crust, steam rising from its base
      vegetation: none anywhere; bare rock only, with no green at all
      fauna: none; the planet is lifeless
      main_subject: a low volcanic vent at the waterline, hissing a white plume of steam up out of the sea
      ground: coarse black volcanic sand and angular basalt boulders crusted with white and yellow mineral deposits
      water: a hot, shallow, steaming sea, greenish-grey and opaque with dissolved iron, wisps of steam drifting over its surface
      far_bank: a line of low black volcanic cones on the horizon, one trailing a plume of ash
      sky_and_light: a thick, hazy, pale orange-brown sky with no blue in it; a large, close Moon faint through the haze; dim, diffuse, warm light
      absent: [plants, algae, moss, green tint on rocks, animals, birds, people, buildings, blue sky, snow]
    framing: {focus: [0.53, 0.45], pan: 270}
    pin: {asset_digest: "4d674a11701a39a0", path: "data/pins/scenes/hadean-ocean/4d674a11701a39a0.jpg"}

  # ~3.9 Ga, inside events.yaml first-life (3.4-4.1 Ga). Setting is explicitly CONTESTED between
  # deep-sea hydrothermal vents and shallow volcanic hot-spring pools: Dodd et al. (2017), "Evidence
  # for early life in Earth's oldest hydrothermal vent precipitates," Nature 543, 60-64
  # (Nuvvuagittuq Greenstone Belt, Quebec: vent hypothesis; the belt's age is itself contested,
  # 3.75-4.3 Ga, and the biogenicity of the putative microfossils is disputed). The pool alternative
  # traces to Darwin's 1871 "warm little pond" letter, formalised by Oparin (1924) and Haldane
  # (1929). This scene depicts the pool side of the debate, because the WATER_EDGE composition
  # needs a shoreline and a horizon that an abyssal vent cannot give; the caption says so.
  - id: origin-of-life
    t: 3.9e9
    chapter: waters-edge
    shot: WATER_EDGE
    title: "Where Life May Have Begun"
    caption: On a young, lifeless Earth, shallow volcanic pools cycle wet and dry in one of two contested settings where the first self-replicating chemistry may have begun.
    unsourced:
      o2_percent: 0  # no free oxygen before biology
      mean_temp_c: 70  # rounded, contested: matches file convention for early hot-spring/ocean scenes
    subject:
      setting: A broad, shallow geothermal lake fed by volcanic hot springs on a young, mostly barren continent, at a time before any confirmed evidence of life anywhere on Earth
      left_mass: a tall mound of layered white and orange mineral sinter terraces close to the water, steam rising from vents at its base
      vegetation: none; no plant, algal or microbial life is yet in evidence anywhere in this scene
      fauna: none
      main_subject: a shallow, stone-rimmed terrace pool at the lake's edge, its cloudy, mineral-laden water skinned with a thin film of pale mineral froth, visibly shrinking at one edge where it is evaporating
      ground: bare volcanic rock and crumbling white-and-ochre mineral crust, with no soil and no organic matter of any kind
      water: a broad, shallow geothermal lake, warm and cloudy with dissolved minerals, its surface threaded with rising bubbles
      far_bank: the lake's far shore, a rim of layered white and orange sinter terraces stepping up into a steaming volcanic hillside
      sky_and_light: a hazy, pale orange-brown sky, thicker and dimmer than a modern one, with a faint young Sun and a large, close Moon pale through the haze; dim, diffuse, warm light
      absent: [plants, algae, moss, lichen, any visible organism, animals, fish, birds, blue sky, snow, people, buildings]
    # ADR-023 (v2): scene-only `geothermal` (a real hot-spring caldeira recording) as a `loop`:
    # the setting is literally volcanic hot springs and an evaporating mineral pool.
    sound: {stem: geothermal, mode: loop, gain: 1.0}
    framing: {focus: [0.6, 0.5], pan: 180}
    pin: {asset_digest: "a9fede0cdaca2a7e", path: "data/pins/scenes/origin-of-life/a9fede0cdaca2a7e.jpg"}

  # Oldest robust stromatolites, ~3.43 Ga Pilbara (events.yaml first-life, lower bound);
  # before the Great Oxidation Event (2.1-2.4 Ga). Coniform and domical Strelley Pool
  # stromatolites, ~3.43 Ga: Allwood, A.C. et al. (2006), "Stromatolite reef from the Early
  # Archaean era of Australia," Nature 441, 714-718 (cited identically in events.yaml first-life).
  # Older claims of life are disputed, so the setting says "among the oldest", not "the oldest".
  # In over-under (ADR-025), so the stromatolites stand in full on the sea floor. No oxygen
  # bubbles: oxygenic photosynthesis is not clearly evidenced this early (contested; events.yaml
  # origin-of-photosynthesis), and the bubbles are what set great-oxidation apart.
  - id: archean-shore
    t: 3.45e9
    chapter: over-under
    shot: SPLIT_LEVEL
    title: "A Stromatolite Shore"
    caption: Microbial stromatolites crowd the floor of an Archean tidal sea under a faint young Sun and a hazy, oxygen-free sky.
    unsourced:
      o2_percent: 0  # below 0.001% of present levels before the Great Oxidation Event
      mean_temp_c: 30  # contested: isotope proxies argue hot (55-85 °C), models temperate
    subject:
      setting: An Archean tidal shelf on the edge of a small volcanic continent, seen half above and half below the surface, among the oldest sea floors with convincing traces of life
      left_mass: a tall, weathered cliff of dark greenstone and banded red-and-grey rock rising straight out of the sea, its submerged foot crusted with dark microbial mat
      vegetation: none on land, which is bare rock; underwater, the only life is microbial, slimy olive-brown and dark-green mats coating every rock and ripple of the shallow sea floor
      fauna: none; no animals exist yet
      main_subject: underwater, a cluster of low conical and domed stromatolites from a hand-span to knee-high, finely layered grey rock skinned with dark olive microbial mat, rising from the rippled sea floor
      ground: the shallow sea floor, rippled grey sand and flat rock slabs streaked with rusty orange iron staining, filmed with microbial mat
      water: warm, calm, faintly green-grey, clear enough that the sea floor is plainly visible
      far_bank: low, bare volcanic hills in grey and rust tones, with no green anywhere
      sky_and_light: a hazy, pale orange sky rather than a blue one; soft, slightly dim, warm diffuse light
      absent: [plants, trees, grass, moss on land, animals, fish, shells, birds, people, blue sky, streams of rising bubbles, seaweed, kelp, sea grass, corals, sponges, anemones]
    framing: {focus: [0.62, 0.72], pan: 180, portrait_zoom: 1.4}
    pin: {asset_digest: "5dc36fb18edad44f", path: "data/pins/scenes/archean-shore/5dc36fb18edad44f.jpg"}

  # ~2.4 Ga, at the onset of the Great Oxidation Event: Gumsley, A.P. et al. (2017), "Timing and
  # tempo of the Great Oxidation Event," PNAS 114(8), 1811-1816 (onset 2.46-2.426 Ga); Lyons,
  # Reinhard & Planavsky (2014), Nature 506, 307-315. Banded iron formations are far older than
  # this scene (oldest ~3.7-3.8 Ga at Isua, peak 2.8-2.5 Ga; events.yaml banded-iron-formations),
  # so the cliff is shown as already-deposited rock, not forming now. The red banding and the
  # oxygen bubbles are what set this frame apart from archean-shore (3.45 Ga). Photosynthesising
  # mats visibly release oxygen bubbles today; they rise through the water, not onto the lens, so
  # they are consistent with over-under's composition (ADR-025). The caption avoids "for the first
  # time": Lyons et al. (2014) review earlier transient oxygen "whiffs".
  - id: great-oxidation
    t: 2.4e9
    chapter: over-under
    shot: SPLIT_LEVEL
    title: "The Great Oxidation"
    caption: As oxygen from cyanobacteria finally builds up in the shallows and the air, banded iron formations record it in stone and the haze over the sea slowly begins to clear.
    unsourced:
      o2_percent: 2  # rounded: the GOE's early rise, a small fraction of modern levels, contested pace
      mean_temp_c: 20  # rounded, contested: some models tie the GOE's onset to Huronian glaciation, more securely dated slightly later, so this scene is kept temperate rather than icy
    subject:
      setting: A shallow tidal shelf on the edge of a barren continent, beside cliffs of banded iron formation laid down on the sea floor over the preceding hundreds of millions of years, seen half above and half below the surface
      left_mass: a tall wave-cut cliff of banded iron formation, bold alternating stripes of rust-red iron oxide and silvery-grey silica, rising out of the sea, its submerged base draped in microbial mat
      vegetation: none on land; the only life is microbial — underwater, thick, wrinkled, olive-and-rust-coloured cyanobacterial mats carpet the shelf and drape low stromatolite mounds
      fauna: none; no animals exist yet
      main_subject: underwater, a broad, dark, wrinkled cyanobacterial mat spread over low mounds on the shelf floor, its surface pearled with thousands of tiny trapped oxygen bubbles, thin silver threads of bubbles rising from it up through the clear water column toward the surface
      ground: the sea floor, an iron-banded rock shelf and coarse red-grey sand fringed with microbial mat
      water: shallow, still, clear, faintly green water
      far_bank: low grey-red hills of layered rock, banded where iron formation is exposed at the surface, with no green anywhere
      sky_and_light: a sky in transition — still pale and hazy rather than a saturated blue, but faintly clearer than the thick orange-brown haze of deeper Archean time; soft, even light
      absent: [land plants, trees, grass, moss, animals, fish, shells, birds, people, a fully clear blue sky, seaweed, kelp, sea grass, corals, sponges, anemones]
    framing: {focus: [0.66, 0.8], pan: 270, portrait_zoom: 1.3}
    pin: {asset_digest: "295c1601ff5c1ece", path: "data/pins/scenes/great-oxidation/295c1601ff5c1ece.jpg"}

  # ~1.047 Ga, exactly inside events.yaml multicellularity-sexual-reproduction (1.030-1.064
  # Ga): Bangiomorpha pubescens, Somerset Island, Arctic Canada. Gibson, T.M. et al. (2018),
  # "Precise age of Bangiomorpha pubescens dates the origin of eukaryotic photosynthesis,"
  # Geology 46(2), 135-138 — the oldest fossil with differentiated reproductive cells and
  # complex multicellular organisation, a red alga. In over-under (ADR-025): the filaments are a
  # fraction of a millimetre wide, so the main subject is restated as a landscape-scale turf
  # (ADR-014).
  - id: boring-billion-shallows
    t: 1.047e9
    chapter: over-under
    shot: SPLIT_LEVEL
    title: "The Oldest Known Sexual Cells"
    caption: In the "Boring Billion," Bangiomorpha — the oldest known organism with differentiated sexual cells — carpets the rocks of sunlit tidal shallows off an otherwise lifeless shore.
    unsourced:
      o2_percent: 4  # rounded, contested: pre-Neoproterozoic-oxygenation estimates for this interval are low and disputed
      mean_temp_c: 18  # rounded: the "Boring Billion" is generally characterised as climatically stable and non-glacial
    subject:
      setting: A shallow, sheltered tidal inlet on a barren coast, in the long, climatically stable interval nicknamed the "Boring Billion", seen half above and half below the surface
      left_mass: a weathered ledge of pale grey-buff dolostone, undercut at the waterline by tidal action, its submerged face bare pale rock filmed with thin microbial mat
      vegetation: "none on land; underwater, dense reddish-purple turf of Bangiomorpha-like filaments on the boulders of the floor, plain microbial mats and a few low stromatolite domes on the floor; nothing stands upright out of the water"
      fauna: none; no animals exist yet, nothing grazes or moves among the algae
      main_subject: "underwater, a low, rounded boulder mound on the sea floor, carpeted in a low, soft, velvety reddish-purple film of hair-fine Bangiomorpha-like algal filaments; each filament is a fraction of a millimetre wide, so the turf reads only as a soft coloured pelt"
      ground: the sea floor, rippled pale dolostone under microbial mat
      water: shallow, clear and still
      far_bank: "a flat, barren tidal platform of pale rock running unbroken to a low grey coastline of utterly bare rock"
      sky_and_light: a clear, pale sky, less hazy than deep Archean time but not the saturated blue of a modern one; calm, even, cool light
      absent: ["land plants", "trees", "grass", "moss on land", "animals", "fish", "shells", "insects", "birds", "people", "grass tussocks", "reeds", "buildings", "ruins", "walls", "structures on the horizon", "boats", "kelp", "seaweed fronds", "sea grass", "corals", "anemones", "sponges", "large upright fronds"]
    framing: {focus: [0.62, 0.75], pan: 0, portrait_zoom: 1.5}
    pin: {asset_digest: "1a40aabd80b4def7", path: "data/pins/scenes/boring-billion-shallows/1a40aabd80b4def7.jpg"}

  # Mid-Sturtian glaciation (~717-661 Ma; events.yaml snowball-earth's first ice-shell window),
  # so the globe shows the ice shell while this scene holds. 650 Ma fell in the ice-free
  # interval between the Sturtian and Marinoan windows. In over-under (ADR-025) to keep that
  # chapter's run unbroken. Dropstones are characteristic of Cryogenian glacial deposits.
  # Eukaryote lineages found before and after the glaciation imply life survived, but not where,
  # so no organism is shown, above or below the surface. Whether any tropical sea stayed open is
  # contested: a hard snowball allows none, slushball models a band of open water, and refugia such
  # as polynyas are hypotheses. The broad polynya here is one such hypothesis, needed because the
  # over-under composition requires calm open water out to the horizon; the caption hedges it.
  - id: cryogenian-snowball
    t: 6.9e8
    chapter: over-under
    shot: SPLIT_LEVEL
    title: "Snowball Earth"
    caption: During a Snowball Earth glaciation, ice reaches toward the equator, open water may survive only in scattered gaps in the ice, and life hangs on out of sight.
    unsourced:
      o2_percent: 8  # contested: Neoproterozoic oxygen estimates span a few percent to near-modern
      mean_temp_c: -40  # rough: snowball climate models give global means of -40 to -50 °C
    subject:
      setting: A frozen coast near the equator during a Snowball Earth glaciation, seen half above and half below the surface of a broad polynya of calm open water
      left_mass: a tall, sheer cliff of blue-white glacier ice, layered and streaked with dark wind-blown dust, rising from the sea floor and plunging below the surface as a pale blue underwater wall
      vegetation: none visible; life survives only as microbial films in meltwater and in dark dust holes on the ice, too thin to see
      fauna: none; no animals are visible
      main_subject: underwater, a large ice-rafted dropstone boulder resting on the grey sea floor, its top dusted with fine silt, its shape plainly readable in the clear water
      ground: the sea floor, grey glacial mud strewn with gravel and dropstones, with no visible life
      water: clear, cold blue-green water, very still; the surface glassy and open all the way out to the distant ice
      far_bank: a distant, low, endless flat white ice shelf along the horizon, beyond a wide stretch of open water
      sky_and_light: a hard, clear, deep-blue cloudless sky; brilliant, cold, glaring sunlight reflecting off the ice; crisp, sharp shadows; below the surface, clear, cold blue-green light through open water, bright enough to show the sea floor
      absent: [plants, trees, grass, moss, animals, birds, penguins, polar bears, seals, people, buildings, footprints, fish, jellyfish, seaweed, kelp, corals, sponges, any visible organism underwater]
    events: [snowball-earth]
    # ADR-023 (v2): `wind` `loop` slightly above its 0.6 ambient -- a frozen, lifeless
    # equatorial shore has nothing else to hear.
    sound: {stem: wind, mode: loop, gain: 0.9}
    framing: {focus: [0.6, 0.72], pan: 180}
    pin: {asset_digest: "b282ea0ed3284209", path: "data/pins/scenes/cryogenian-snowball/b282ea0ed3284209.jpg"}

  # Inside the Ediacaran biota's range (events.yaml ediacaran-biota: 538.8-571 Ma). In over-under
  # (ADR-025), so these are the first animals the viewer clearly sees. Dickinsonia (567-550 Ma), a
  # shallow-water mat feeder, is an animal by its cholesteroid biomarkers: Bobrovskiy, I. et al.
  # (2018), Science 361(6408), 1246-1249 (volume and pages checked against Wikipedia's Dickinsonia
  # article; the title's "steroids"/"sterols" wording is still unconfirmed). Charnia itself is not
  # depicted: it is mainly a deep-water Avalon taxon, living well below the photic zone. The
  # shallower White Sea assemblage (~560-550 Ma) does include rangeomorphs and other fronds
  # (Wikipedia, Ediacaran biota), so the fronds are generic and small, standing behind the
  # Dickinsonia. Their affinity is unresolved, hence "some of them early animals". Kimberella and
  # Tribrachidium date ~555 Ma, after this t, and are not depicted.
  - id: ediacaran-shallows
    t: 5.6e8
    chapter: over-under
    shot: SPLIT_LEVEL
    title: "Life Grows Large"
    caption: Soft-bodied Ediacaran organisms, among the first large living things and some of them early animals, lie on and rise from microbial mats in sunlit shallows beside a barren coast.
    unsourced:
      o2_percent: 12  # contested: Ediacaran oxygen estimates range widely below modern
      mean_temp_c: 18  # rounded: post-glacial Ediacaran climate, poorly constrained
    subject:
      setting: A shallow, sunlit Ediacaran sea floor off a barren coast, seen half above and half below the surface
      left_mass: a tall, bare outcrop of layered tan and grey sandstone with no plants on it, its base underwater
      vegetation: none on land, which is bare rock and sand; underwater, a wrinkled olive-brown microbial mat carpets the sea floor
      fauna: underwater, soft-bodied Ediacaran organisms, flat oval quilted Dickinsonia of several sizes lying on the mat, a few small, pale, frond-shaped organisms a hand-span tall standing up from the mat on disc holdfasts in the background, and small disc-shaped holdfasts
      main_subject: underwater, a large, flat, quilted oval Dickinsonia about half a metre long lying on the mat, its fine rib-like segments running out from a central line and plainly readable in the clear water, with a few small, pale fronds standing on disc holdfasts behind it
      ground: the sea floor, rippled pale sand under the microbial mat
      water: very clear, calm turquoise water, soft dappled sunlight across the sea floor
      far_bank: a low, barren coastline of reddish rock and sand, with no green
      sky_and_light: a clear, pale-blue sky with thin high cloud; bright, clean sunlight
      absent: [plants on land, green vegetation, trees, grass, fish, crabs, shelled animals, trilobites, birds, people, jellyfish, seaweed, kelp, sea grass, corals, anemones, sponges, starfish]
    framing: {focus: [0.7, 0.85], pan: 0, portrait_zoom: 1.5}
    pin: {asset_digest: "b1473d8e9161781f", path: "data/pins/scenes/ediacaran-shallows/b1473d8e9161781f.jpg"}

  # ~518 Ma, the Chengjiang biota (Yunnan, China): Yang, C., Li, X.-H., Zhu, M. & Condon, D.J.
  # (2018), "Geochronological constraint on the Cambrian Chengjiang biota, South China," Journal of
  # the Geological Society 175(4), 659-666. Shu, D. et al. (1999), "Lower Cambrian vertebrates from
  # south China," Nature 402, 42 (Haikouichthys, ~2.5 cm, on the vertebrate stem). Chengjiang was a
  # shallow, muddy, fast-sedimenting delta front (Maotianshan Shales), so the sea floor is shown
  # beside a shoreline. Moved into over-under by chapter and shot only (ADR-025): the pinned image
  # already has the split framing that chapter's composition was measured from, so its subject and
  # caption are kept verbatim and its pin stays. Trilobites and Hallucigenia are documented at Chengjiang;
  # the radiodont is described as Amplectobelua-grade (up to ~90 cm), since the Chengjiang specimen
  # once assigned to Anomalocaris has been reclassified. Opabinia is Burgess Shale only and is not
  # depicted. No archaeocyathid reefs are recorded at Chengjiang.
  - id: cambrian-seafloor
    t: 5.18e8
    chapter: over-under
    shot: SPLIT_LEVEL
    title: "The Cambrian Explosion"
    caption: On the Cambrian sea floor, most major animal groups alive today have appeared within a brief interval — including our own, a jawless swimmer no longer than a fingertip.
    unsourced:
      o2_percent: 12  # rounded, contested: rising but still well below modern by the mid-Cambrian
      mean_temp_c: 25  # rounded: Cambrian climate is generally reconstructed as warm
    subject:
      setting: The shore of a shallow, muddy Cambrian sea, its sea floor crowded with newly diversified animal life and plainly visible through the shallows beside a barren coast
      left_mass: a tall, bare bank of layered grey-green mudstone and siltstone with no plants on it
      vegetation: none on land, which is bare rock and mud; underwater, only sparse patches of microbial mat on the mud, with a low mound of settled debris colonised by upright vase-shaped and stalked sponges
      fauna: "numerous trilobites crawling and half-buried in the mud; a small, soft-bodied, worm-like lobopodian with stubby paired clawed legs and spines along its back (Hallucigenia-grade) clinging to debris; a loose shoal of tiny, slender, translucent jawless swimmers about 2.5 cm long, eel-shaped with no separate tail fin and no paired fins, each with a pair of large eyes, a row of small gill openings behind the head, a single low fin fold along the back and zigzag muscle bands down the body"
      main_subject: "an Amplectobelua-grade radiodont up to 90 cm long, a flattened, soft-bodied swimming arthropod, its body built from broad, low, overlapping segments running its length, each segment carrying a soft, flexible flap along its side; along its back the segments meet in a smooth, even line with no ridge or crest of any kind; at the rear, a small fan of short, paired tail flaps, quite unlike a single continuous tail; large stalked eyes on the head; two jointed, spiny appendages reaching down and forward from the front of the head to grasp prey; on the underside of the head, a round mouth ringed with overlapping hard plates; its flanks are a uniform mottled grey-green with no paler underside; it glides low over the mud of the shallows toward a cluster of trilobites"
      ground: wet, soft grey-brown mud at the waterline, rippled and bare
      water: shallow, slightly silty, pale green-blue sea water, clear enough near the shore that the muddy sea floor and its animals are plainly visible
