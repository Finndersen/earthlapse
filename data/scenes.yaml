  # ~2.4 Ga, at the onset of the Great Oxidation Event: Gumsley, A.P. et al. (2017), "Timing and
  # tempo of the Great Oxidation Event," PNAS 114(8), 1811-1816 (onset 2.46-2.426 Ga); Lyons,
  # Reinhard & Planavsky (2014), Nature 506, 307-315. Banded iron formations are far older than
  # this scene (oldest ~3.7-3.8 Ga at Isua, peak 2.8-2.5 Ga; events.yaml banded-iron-formations),
  # so the cliff is shown as already-deposited rock, not forming now. The red banding and the
  # oxygen bubbles are what set this frame apart from archean-shore (3.45 Ga).
  - id: great-oxidation
    t: 2.4e9
    chapter: waters-edge
    shot: WATER_EDGE
    caption: As cyanobacteria flood the shallows with oxygen for the first time, banded iron formations record it in stone and the haze over the sea begins, almost imperceptibly, to clear.
    unsourced:
      o2_percent: 2  # rounded: the GOE's early rise, a small fraction of modern levels, contested pace
      mean_temp_c: 20  # rounded, contested: some models tie the GOE's onset to Huronian glaciation, more securely dated slightly later, so this scene is kept temperate rather than icy
    subject:
      setting: A shallow tidal shelf on the edge of a barren continent, beside cliffs of banded iron formation laid down on the sea floor over the preceding hundreds of millions of years
      left_mass: a tall wave-cut cliff of banded iron formation, bold alternating stripes of rust-red iron oxide and silvery-grey silica
      vegetation: none in the botanical sense; the only life is microbial — thick, wrinkled, olive-and-rust-coloured cyanobacterial mats coating the submerged rock and the pool margins
      fauna: none; no animals exist yet
      main_subject: a broad, dark cyanobacterial mat in a tidal pool, its surface frothed with thousands of tiny trapped oxygen bubbles
      ground: bare grey-red rock and coarse sand, fringed where it stays wet by slick, dark microbial mat
      water: shallow, still, faintly cloudy pale-green water lying over the iron-banded rock shelf
      far_bank: low grey-red hills of layered rock, banded where iron formation is exposed at the surface, with no green anywhere except the microbial mats at the shore
      sky_and_light: a sky in transition — still pale and hazy rather than a saturated blue, but faintly clearer than the thick orange-brown haze of deeper Archean time; soft, even light
      absent: [land plants, trees, grass, moss, animals, fish, shells, birds, people, a fully clear blue sky]
    pin: {asset_digest: "a9f9e02cef236b42", path: "data/candidates/great-oxidation/f46f815b31ff9226/03-a9f9e02cef236b42.jpg"}

