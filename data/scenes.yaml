  # About 1998, the Aral Sea's collapse (events.yaml aral-sea-shrinkage, t_min/t_max 21-65,
  # 2004-1960); t = 2025 - 1998 = 27. Wikipedia "Aral Sea": Soviet irrigation of the Amu Darya and
  # Syr Darya, begun in the early 1960s, shrank the sea's surface area by 60% and its volume by 80%
  # between 1960 and 1998; by 2004 it covered just 17,160 km^2, 25% of its 1960 extent of 68,000
  # km^2. The fishing fleet, which once employed some 40,000 people and supplied a sixth of Soviet
  # fish catches, had no commercial catch left by 1987; the port of Moynaq, Uzbekistan, now lies
  # 30-90 km from the shore, its trawlers stranded on the dry bed. Kept in open-ground (GROUND),
  # continuing the run from berlin-wall-fall: the whole point of the scene is a dry former seabed
  # with no water anywhere in the frame, so waters-edge cannot make it. TONE: documentary, no
  # people -- the abandoned vessels alone carry the scale of the loss.
  - id: aral-sea-drying
    t: 27.0
    chapter: open-ground
    shot: GROUND
    caption: By 1998, Soviet-era irrigation of the Amu Darya and Syr Darya has shrunk the Aral Sea's surface area by 60% and its volume by 80% since 1960, stranding whole fishing fleets — once the source of a sixth of Soviet fish catches — kilometres from any water.
    unsourced:
      o2_percent: 21  # modern
      mean_temp_c: 15  # rounded: late-1990s global mean
    subject:
      setting: The cracked, salt-crusted former seabed of the Aral Sea near the port town of Moynaq, Uzbekistan, about 1998, where the shoreline has retreated tens of kilometres
      left_mass: a large rusted steel fishing trawler resting on its side in the sand, its hull streaked with corrosion, decades since it last floated
      vegetation: sparse, salt-tolerant scrub and drought-killed reed stubble scattered across the dry lakebed
      fauna: none
      main_subject: two more fishing vessels sitting stranded and listing on the cracked, salt-white sand, their painted names faded and unreadable, far from any water
      ground: a vast expanse of cracked, salt-crusted dry lakebed, ridged like a dry riverbed, littered with wind-scoured shells
      water: none in the frame; the Aral Sea's shoreline has retreated far beyond the horizon
      far_bank: no far bank; the flat, pale former seabed runs unbroken to a hazy horizon, with the outline of an abandoned fish-cannery building just visible in the distance
      sky_and_light: a pale, dusty, wind-hazed sky; flat, harsh midday light
      absent: [water, boats afloat, modern clothing, identifiable faces, vehicles, tourists, modern signage, green vegetation, healthy reed beds]
    events: [aral-sea-shrinkage]
