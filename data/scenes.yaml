  # stem-group form, not demonstrably vascular: only one species shows conducting tissue, the
  # oldest species (C. barrandei) is ~432 Ma, and the plants were a few centimetres tall. In
  # over-under (ADR-025), the last split scene before life comes ashore at rhynie-chert.
