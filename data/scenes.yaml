# Scene records — the curated source of truth for `earthtime plan / build / review / publish`.
#
# One record per generated still. `t` is years before present (pipeline/shapes.py), chosen to
# sit inside the matching interval in data/events.yaml. Prompts are rendered from each record
# (pipeline/prompts.py): invariant style + shot + chapter composition + conditions + subject.
# Text only, no reference image (ADR-010).
#
# Conditions
# ----------
# CO2, day length, solar luminosity, land fraction and "your ancestor" come from
# `load_world(data/curated).at(t)`; where no source covers `t` the prompt says so rather than
# inventing a value. `unsourced` holds what no curated source covers yet: rounded, plausible
# figures, not citations, each commented. `null` means no defensible single figure exists.
#
# Chapters
# --------
# A chapter is a run of consecutive scenes sharing one composition (DESIGN §6). The viewer
# dissolves slowly within a chapter and near-cuts across a boundary (web/src/scene/scene.ts),
# so chapters follow composition, never one per scene. Gate v2 showed the WATER_EDGE framing
# holding across very different worlds, so every scene that can stand at a water's edge does
# (ADR-010). Only the magma ocean, which has no water, cannot.
#
# Pins
# ----
# `pin` stays `null` until a human runs `earthtime review pick <scene_id> <n>`, which rewrites
# that one line. Keep each `pin:` on a single line. A pinned scene is never regenerated (ADR-005).

chapters:
  - id: molten-earth
    label: Molten Earth
    shot: WIDE_RIDGE
    composition: ridge-vista
  - id: waters-edge
    label: At the water's edge
    shot: WATER_EDGE
    composition: water-edge-series

scenes:
  # Moon-forming impact 4.35-4.52 Ga (events.yaml moon-forming-impact).
  - id: magma-ocean
    t: 4.5e9
    chapter: molten-earth
    shot: WIDE_RIDGE
    caption: In the aftermath of the Moon-forming impact, Earth's whole surface is a glowing ocean of magma beneath a looming, newborn Moon.
    unsourced:
      o2_percent: 0  # no free oxygen before biology
      mean_temp_c: null  # a molten surface has no meaningful global mean
    subject:
      setting: The surface of the newborn Earth in the aftermath of the Moon-forming impact, seen from a ridge of freshly chilled black crust
      left_mass: a jagged crag of black, glassy basalt crust, its cracks glowing orange-red with the heat beneath
      vegetation: none; the planet is lifeless, every surface bare rock or molten
      fauna: none
      main_subject: a towering lava fountain rising from a slowly churning current of incandescent magma, crusting black at its edges
      ground: cracked, still-hot black crust with orange light glowing through its fissures and wisps of rock vapour rising
      water: none; in place of any sea, a molten ocean of glowing orange-red magma runs to the horizon, skinned with drifting plates of black crust
      far_bank: no far bank; the magma ocean runs unbroken to the horizon under towering plumes of steam and ash
      sky_and_light: a dark, dense sky of vapour and ash lit orange from below by the glowing magma; an enormous Moon, many times its present apparent size, hangs low through a gap in the clouds
      absent: [water, snow, ice, plants, any living thing, green colour, people, buildings]
    pin: null

  # After the first ocean condensed (~4.4 Ga zircons) and before any evidence of life
  # (events.yaml first-life: 3.4-4.1 Ga).
  - id: hadean-ocean
    t: 4.3e9
    chapter: waters-edge
    shot: WATER_EDGE
    caption: The first ocean steams against black volcanic shores, a world of water and rock with no life anywhere.
    unsourced:
      o2_percent: 0  # no free oxygen before biology
      mean_temp_c: 60  # contested: hot-early-ocean estimates run 40-80 °C, others argue temperate
    subject:
      setting: A shore of the first ocean on the young Hadean Earth, where a volcanic island rises from a hot, shallow sea
      left_mass: a tall, dark sea stack of black pillow basalt, streaked rust-red and white with mineral crust, steam rising from its base
      vegetation: none anywhere; bare rock only, with no green at all
      fauna: none; the planet is lifeless
      main_subject: a low volcanic vent at the waterline, hissing a white plume of steam up out of the sea
      ground: coarse black volcanic sand and angular basalt boulders crusted with white and yellow mineral deposits
      water: a hot, shallow, steaming sea, greenish-grey and opaque with dissolved iron, wisps of steam drifting over its surface
      far_bank: a line of low black volcanic cones on the horizon, one trailing a plume of ash
      sky_and_light: a thick, hazy, pale orange-brown sky with no blue in it; a large, close Moon faint through the haze; dim, diffuse, warm light
      absent: [plants, algae, moss, green tint on rocks, animals, birds, people, buildings, blue sky, snow]
    pin: null

  # Oldest robust stromatolites, ~3.43 Ga Pilbara (events.yaml first-life, lower bound);
  # before the Great Oxidation Event (2.1-2.4 Ga).
  - id: archean-shore
    t: 3.45e9
    chapter: waters-edge
    shot: WATER_EDGE
    caption: Microbial stromatolites crowd an Archean tidal shore under a faint young Sun and a hazy, oxygen-free sky.
    unsourced:
      o2_percent: 0  # below 0.001% of present levels before the Great Oxidation Event
      mean_temp_c: 30  # contested: isotope proxies argue hot (55-85 °C), models temperate
    subject:
      setting: An Archean tidal flat on the edge of a small volcanic continent, the oldest shore with life on it
      left_mass: a tall, weathered cliff of dark greenstone and banded red-and-grey rock
      vegetation: none on land, which is bare rock; the only life is microbial, slimy olive-brown and dark green mats coating the wet rock in the shallows
      fauna: none; no animals exist yet
      main_subject: a cluster of dome-shaped stromatolites, knee-high rounded mounds of finely layered grey rock skinned with dark microbial mat, breaking the still surface of the shallows
      ground: wet, rippled grey sand and flat grey rock slabs streaked with rusty orange iron staining
      water: shallow, calm, warm tidal water, faintly green-grey
      far_bank: low, bare volcanic hills in grey and rust tones, with no green anywhere
      sky_and_light: a hazy, pale orange sky rather than a blue one; soft, slightly dim, warm diffuse light
      absent: [plants, trees, grass, moss on land, animals, fish, shells, birds, people, blue sky]
    pin: null

  # Marinoan glaciation, ~650-635 Ma, inside the Cryogenian (events.yaml snowball-earth: 635-720 Ma).
  - id: cryogenian-snowball
    t: 6.5e8
    chapter: waters-edge
    shot: WATER_EDGE
    caption: During a Snowball Earth glaciation, ice reaches toward the equator and the sea survives only as dark leads between the ice.
    unsourced:
      o2_percent: 8  # contested: Neoproterozoic oxygen estimates span a few percent to near-modern
      mean_temp_c: -40  # rough: snowball climate models give global means of -40 to -50 °C
    subject:
      setting: A frozen shore near the equator during a Snowball Earth glaciation
      left_mass: a tall, sheer cliff of blue-white glacier ice, layered and streaked with dark wind-blown dust
      vegetation: none visible; life survives only as microbial films in meltwater and in dark dust holes on the ice
      fauna: none; no animals are visible
      main_subject: a low, dark, frost-rimed boulder of ice-rafted rock at the edge of the open water
      ground: hard, wind-scoured snow and bare blue ice with patches of dark dust and scattered gravel
      water: a still meltwater lead, black and glassy, its edges skinned with thin new ice and small floating slabs
      far_bank: an endless flat white ice shelf along the horizon
      sky_and_light: a hard, clear, deep-blue cloudless sky; brilliant, cold, glaring sunlight reflecting off the ice; crisp, sharp shadows
      absent: [plants, trees, grass, moss, animals, birds, penguins, polar bears, seals, people, buildings, footprints]
    pin: null

  # Inside the Ediacaran biota's range (events.yaml ediacaran-biota: 538.8-571 Ma).
  - id: ediacaran-shallows
    t: 5.6e8
    chapter: waters-edge
    shot: WATER_EDGE
    caption: Soft-bodied Ediacaran organisms, among the first large living things, lie on microbial mats in clear, sunlit shallows beside a barren coast.
    unsourced:
      o2_percent: 12  # contested: Ediacaran oxygen estimates range widely below modern
      mean_temp_c: 18  # rounded: post-glacial Ediacaran climate, poorly constrained
    subject:
      setting: A shallow, sunlit Ediacaran sea floor seen through clear water at the edge of a barren coast
      left_mass: a tall, bare outcrop of layered tan and grey sandstone with no plants on it
      vegetation: none on land, which is bare rock and sand; underwater, a wrinkled olive-brown microbial mat carpets the sea floor
      fauna: soft-bodied Ediacaran organisms visible through the clear water, flat oval quilted Dickinsonia up to half a metre long, feather-like Charnia fronds standing up from the mat, and small disc-shaped holdfasts
      main_subject: a group of tall, pale Charnia fronds rising from the mat in the clear shallows, just below the surface
      ground: a wet beach of rippled pale sand and flat sandstone slabs, bare of any plants
      water: very clear, calm, shallow turquoise water through which the textured sea floor is plainly visible
      far_bank: a low, barren coastline of reddish rock and sand, with no green
      sky_and_light: a clear, pale-blue sky with thin high cloud; bright, clean sunlight throwing sparkling caustics across the sea floor
      absent: [plants on land, green vegetation, trees, grass, fish, crabs, shelled animals, trilobites, birds, people]
    pin: null

  # Tiktaalik, ~375 Ma (data/lineage.yaml tetrapodomorpha); inside events.yaml tetrapods (365-395 Ma).
  - id: devonian-estuary
    t: 3.75e8
    chapter: waters-edge
    shot: WATER_EDGE
    caption: The first forests of Archaeopteris shade a Devonian estuary where lobe-finned fishes haul themselves into the shallows.
    unsourced:
      o2_percent: 18  # rounded: GEOCARBSULF-type estimates put Late Devonian O2 below modern
      mean_temp_c: 24  # rounded: Late Devonian greenhouse
    subject:
      setting: A Late Devonian estuary where a river meets a shallow sea, on the coastal lowland of a bare continent
      left_mass: a stand of Archaeopteris, the first true trees, straight slender trunks up to 20 m tall carrying flat horizontal sprays of fern-like foliage, open and airy with sky visible between the branches
      vegetation: Archaeopteris trees, with scattered low tufts of leafless green Psilophyton stems and small clubmosses, much bare ground between them
      fauna: lobe-finned fishes in the shallows; no land animals larger than a small arthropod
      main_subject: a Tiktaalik-like tetrapodomorph, a 2 m flat-headed lobe-finned fish with a crocodile-like head, resting in the shallows with its head and front fins raised out of the water
      ground: bare, wet grey-brown mud and sand
      water: shallow, calm, slightly silty brackish water
      far_bank: a low, barren upland of thin rocky soil, grey and ochre, with only faint patches of low green and no forest
      sky_and_light: a clear, pale blue sky with a few small fair-weather cumulus; bright, crisp sunlight with clean, defined shadows; clear air, the far distance sharp
      absent: [flowers, grass, broadleaf trees, palms, conifers, cycads, dinosaurs, mammals, birds, flying insects]
    pin: null

  # Late Carboniferous coal swamps; Hylonomus-grade amniotes (events.yaml amniotes: 307-359 Ma).
  - id: carboniferous-swamp
    t: 3.1e8
    chapter: waters-edge
    shot: WATER_EDGE
    caption: Giant lycopsid trees wall a Carboniferous coal swamp, where oxygen-rich air lets insects and millipedes grow to record sizes.
    unsourced:
      o2_percent: 32  # rounded: the Late Carboniferous oxygen peak, commonly put near 30-35%
      mean_temp_c: 16  # rounded: Late Paleozoic Ice Age, polar ice with a hot, wet equator
    subject:
      setting: A Late Carboniferous coal swamp on a hot, wet lowland near the equator
      left_mass: a dense wall of towering Lepidodendron and Sigillaria lycopsid trees, 30 m pole-like trunks patterned with diamond-shaped leaf scars and topped by forked crowns of long grass-like leaves, dark inside
      vegetation: lycopsid trees, giant Calamites horsetails 10 m tall and Psaronius tree ferns packed beneath them, with ferns and seed-fern fronds
      fauna: giant insects and arthropods; no reptiles in view
      main_subject: a Meganeura, a giant griffinfly with a 70 cm wingspan, hovering low over the water, and beneath it an Arthropleura, a 2 m armoured millipede, crawling along a fallen log at the water's edge
      ground: fallen, rotting lycopsid trunks half sunk in black mud, crowded with ferns and seed-fern fronds
      water: still, black, tannin-dark standing swamp water, glassy, with floating debris
      far_bank: more swamp forest of lycopsid poles fading into the humid haze
      sky_and_light: a low, even overcast of white-grey cloud; soft, diffuse, almost shadowless light; the air saturated and heavy, a dense humid haze tinted green-grey that swallows the distance
      absent: [flowers, grass, broadleaf trees, palms, conifers, dinosaurs, mammals, birds]
    pin: null

