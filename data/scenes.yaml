    chapter: waters-edge
    shot: WATER_EDGE
    caption: Deep in the arid interior of Pangaea, massive synapsids drink from a shrinking seasonal river.
    unsourced:
      o2_percent: 26  # rounded: declining from the Carboniferous peak
      mean_temp_c: 20  # rounded: warming out of the Late Paleozoic Ice Age
    subject:
      setting: The arid interior of the supercontinent Pangaea in the Middle Permian, far from any sea
      left_mass: a sparse, ragged stand of Walchia-like early conifers and Glossopteris trees clinging to the river bank, dusty grey-green, several dead and leafless, open ground visible between the trunks
      vegetation: sparse early conifers and Glossopteris only; the land is mostly bare
      fauna: large synapsids at the river; nothing else in view
      main_subject: two Moschops-like dinocephalians, massive barrel-bodied synapsids about 3 m long with thick skulls and sprawling limbs, standing in the shallows, one drinking
      ground: cracked red mud and dry banks of layered red sandstone and mudstone, bare of plants
      water: a shallow, shrinking seasonal river, opaque red-brown with silt
      far_bank: flat-lying red beds and low dunes, bare to the horizon under dust
      sky_and_light: a cloudless sky bleached almost white by suspended dust; a hard, glaring sun and short, sharp, dark shadows; heat shimmer and a tan dust haze over the distance
      absent: [flowers, grass, broadleaf trees, palms, dinosaurs, mammals, birds, swamp forest, lush green vegetation]
    pin: null

