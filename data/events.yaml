    t_min: 1175
    t_max: 2375
    t: 2075
    tags: [human-origins]
    importance: 0.4
    description: >
      Madagascar is among the last major landmasses settled by humans. A critical review
      of the island's radiocarbon record finds human presence by at least 2000 calibrated
      years BP, with an earlier, isolated claim of cut-marked megafauna bone pushing
      possible visits back to roughly 10,500 years ago -- contested, since the species
      and even the human origin of those cut marks is not established. Definite,
      continuous colonisation is dated to roughly 1350-1100 years BP. Genomic evidence
      shows the Malagasy descend from an admixture of Austronesian and Bantu-speaking
      African settlers; the Austronesian side is linguistically closest to the Barito
      languages of southeast Borneo, the traditional source region shown here.
    citation: >
      Douglass, K. et al. (2019). "A critical review of radiocarbon dates clarifies the
