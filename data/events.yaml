  - id: pasteur-koch-germ-theory
    label: Germ theory of disease established
    kind: period
    t_min: 142
    t_max: 166
    tags: [science-technology, life]
    importance: 0.75
    description: >
      Louis Pasteur's 1859 swan-neck flask experiments show that a sterilised broth does
      not spontaneously generate life, undermining spontaneous generation; Robert Koch
      then identifies the specific bacteria causing anthrax (1876) and tuberculosis
      (1882), and his assistant Friedrich Loeffler formalises Koch's postulates in 1883
      — together establishing that specific microorganisms cause specific infectious
      diseases, a foundation of modern medicine and public health.
    citation: >
      Wikipedia, "Louis Pasteur" and "Robert Koch" (accessed 2026-09-14). Swan-neck
      flask experiment dated 1859 per Wikipedia, "Spontaneous generation" (accessed
      2026-09-14) — corrects an earlier draft's 1861. Koch's anthrax (1876) and
      tuberculosis (1882) identifications, and the 1883 postulates credited to Loeffler,
      confirmed live; the bounding interval is a curatorial choice among several
      credible milestones in a continuous scientific development, not a single
      literature-defined span.

