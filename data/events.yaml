  - id: thule-arctic-expansion
    label: Thule expansion across the Arctic
    kind: period
    t_min: 725
    t_max: 800
    tags: [human-origins, society]
    importance: 0.45
    description: >
      The Thule culture, ancestral to modern Inuit, emerges among Bering Strait maritime
      hunters in coastal Alaska and expands rapidly eastward across the Canadian Arctic
      archipelago to Greenland, carrying skin boats, dog sleds and toggling harpoons
      adapted to open-water whaling. Ancient-genome analysis shows Thule people almost
      completely replaced, with little or no admixture, the earlier Palaeo-Inuit Dorset
      culture, which had occupied the eastern Arctic for the previous two millennia and
      had vanished within a few centuries of Thule contact.
    citation: >
      Friesen, T.M. & Arnold, C.D. (2008). "The Timing of the Thule Migration: New Dates
      from the Western Canadian Arctic." American Antiquity, 73(3), 527-538.
      doi:10.1017/S0002731600046850 (western Canadian Arctic transit corridor sites not
      occupied before the 13th century AD, refuting an ~1000 CE onset for the eastward
      migration). Raghavan, M. et al. (2014). "The Genetic Prehistory of the New World
      Arctic." Science, 345(6200), 1255832. doi:10.1126/science.1255832 (Thule
      populations largely replace, with no detected Dorset admixture, the earlier Dorset
      culture across northern Canada and Greenland by about 1300 CE). Wikipedia, "Thule
      people" (accessed 2026-09-17): Thule tradition develops in coastal Alaska by
      1000 CE — a claim about the culture's Alaskan origin, not the eastward migration's
      own start — and expands east across the Canadian Arctic, displacing the Dorset
      culture by the 13th-15th century.
    effect:
