  - id: east-asia-arrival
    label: Arrival in East Asia
    kind: moment
    t_min: 4.5e4
    t_max: 5.0e4
    t: 4.75e4
    tags: [human-origins]
    importance: 0.5
    description: >
      Ancient-DNA and multimethod redating (AMS radiocarbon, optically stimulated
      luminescence) of purported early modern-human remains in southern China places
      their actual arrival within the ~50,000-45,000-year window set by molecular data,
      consistent with Tianyuan man (~42,000-39,000 years ago, near Beijing). This
      contradicts much older contested claims for the region, including U-Th dating of
      flowstones at Fuyan Cave (Daoxian) suggesting 120,000-80,000 years, which the
      redating study found to be substantially younger, some Holocene in age.
    citation: >
      Sun, X. et al. (2021). "Ancient DNA and multimethod dating confirm the late
      arrival of anatomically modern humans in southern China." PNAS, 118(8),
      e2019158118. doi:10.1073/pnas.2019158118.
    effect:
