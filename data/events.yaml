      into Remote Oceania: pottery appears at Mussau by around 3250 calibrated years BP,
      then in Vanuatu and Fiji within a couple of centuries, reaching Samoa by roughly
      2700 calibrated years BP. This was not the first human presence anywhere in Remote
      Oceania -- the Mariana Islands were settled independently, and earlier, from the
