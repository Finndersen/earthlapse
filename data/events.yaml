      Human Evolution, 47(1-2), 25-63. doi:10.1016/j.jhevol.2004.05.005. Anderson, A. et
      al. (2018). "New evidence of megafaunal bone damage indicates late colonization of
      Madagascar." PLOS ONE, 13(10), e0204368. doi:10.1371/journal.pone.0204368
      (colonisation 1350-1100 BP; contested >10,500-year-old cut marks). Pierron, D. et
      al. (2017). "Genomic landscape of human diversity across Madagascar." PNAS,
