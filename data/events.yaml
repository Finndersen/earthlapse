  - id: transatlantic-slave-trade
    label: Transatlantic slave trade
    kind: period
    t_min: 137
    t_max: 450
    tags: [society]
    importance: 0.6
    description: >
      From Portugal's 1575 colonisation of Angola, and decisively after the
      Portuguese-Brazilian recapture of Luanda from the Dutch in 1648, European traders
      and colonial powers force millions of captive West and Central Africans onto ships
      bound for the Americas to work as forced labour, mostly on plantations and in
