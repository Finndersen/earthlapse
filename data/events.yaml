  - id: periclean-athens
    label: Age of Pericles in Athens
    kind: period
    t_min: 2454
    t_max: 2486
    tags: [society, science-technology]
    importance: 0.55
    description: >
      From his political ascendancy in 461 BC to his death in 429 BC, Pericles dominates
      Athenian politics and, drawing on the Delian League's treasury, funds the building
      programme that produces most of the surviving structures on the Acropolis,
      including the Parthenon (dedicated 438/439 BC, its sculptural decoration finished
      by 432 BC) and the Propylaea gatehouse (finished 432 BC). This "Golden Age" also
      sees Athenian naval power and direct democracy at their height, shortly before the
      Peloponnesian War (431-404 BC) begins.
    citation: >
      Via Wikipedia "Pericles" and "Parthenon" (accessed 2026-09-17): Pericles' political
      dominance 461-429 BC; Parthenon dedicated 438/439 BC, sculptures finished 432 BC;
      Propylaea finished 432 BC. Primary sources (Thucydides, Plutarch) not independently
      read.

  # Added for the qin-xianyang-epang-palace scene (data/scenes.yaml), filling the gap
  # between great-pyramid-giza and roman-empire-peak. No existing event covered Qin China.
  - id: qin-unification
    label: Qin dynasty unifies China
    kind: period
    t_min: 2231
    t_max: 2246
    tags: [society, science-technology]
    importance: 0.55
    description: >
      King Zheng of Qin completes the conquest of China's rival Warring States in 221 BC,
      becoming its first emperor (Qin Shi Huang) and standardising its currency, weights
      and measures, and writing system across the newly unified territory. His capital,
      Xianyang, is by tradition ringed by a network of over two hundred palaces across
      the Wei valley, and needs no defensive wall of its own. The dynasty he founds
      collapses within four years of his death in 210 BC, falling to rebellion in 206 BC.
    citation: >
      Via Wikipedia "Qin dynasty" and "Qin Shi Huang" (accessed 2026-09-17): unification
      221 BC; dynasty ends 206 BC; standardisation of currency, weights/measures and
      writing; Xianyang "the only capital city in China that did not require walls to be
      built around it"; a network of "over 200" palaces linked by covered roads. Primary
      sources (Sima Qian's Records of the Grand Historian) not independently read.

  - id: roman-empire-peak
    label: Roman Empire at its height
    kind: period
    t_min: 1845
    t_max: 1929
    tags: [society, science-technology]
    importance: 0.6
    description: >
      Trajan's reign (AD 98-117) carries the Roman Empire to its greatest territorial
      extent, about 5 million square kilometres from Britain to Mesopotamia; the
      Nerva-Antonine "Five Good Emperors" who follow, through AD 180, preside over
      the Pax Romana's most stable and prosperous span. Hadrian's rebuilt Pantheon in
      Rome, its huge unreinforced-concrete dome the largest built anywhere for the
      next 1,300 years, is dedicated within this period, around AD 126.
    citation: >
      Wikipedia, "Roman Empire" (accessed 2026-09-15): territorial peak under Trajan,
