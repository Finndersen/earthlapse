      loaded onto slave ships, up to 2 million died in the Middle Passage. Wikipedia,
      "Slavery in Brazil" (accessed 2026-09-17): approximately 5.5 million enslaved
      Africans brought to Brazil between 1540 and the 1860s, out of an estimated 12
      million transported to the Americas overall. Heywood, L.M. & Thornton, J.K.
      (2007). Central Africans, Atlantic Creoles, and the Foundation of the Americas,
      1585-1660. Cambridge University Press (Portugal's 1575 colonisation of
      Angola/founding of Luanda). Alencastro, L.F. de (2018). The Trade in the Living:
      The Formation of Brazil in the South Atlantic, Sixteenth to Seventeenth Centuries.
      SUNY Press (the 1648 Portuguese-Brazilian recapture of Luanda from the Dutch
      securing the Angola-Brazil slave axis). Borucki, A., Eltis, D. & Wheat, D. (2015).
      "Atlantic History and the Slave Trade to Spanish America." American Historical
      Review, 120(2), 433-461. doi:10.1093/ahr/120.2.433 (the 1525 Sao Tome-to-Hispaniola
      voyage, the first transatlantic slave voyage, was Caribbean-bound and unrelated to
