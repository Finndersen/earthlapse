      Philippines — the first known human presence there — by about 2000 BC, per the
      primary excavation record (no preceramic occupation found across fifty-one
      radiocarbon-dated samples from seven sites) — the first leg of a maritime
      dispersal that eventually stretches from Madagascar (madagascar-arrival) to East
      Polynesia (east-polynesia-arrival) and Aotearoa (aotearoa-arrival). Linguistic and
      Bayesian phylogenetic evidence corroborates the archaeological picture of a series
      of expansion pulses moving outward from a Taiwanese homeland.
