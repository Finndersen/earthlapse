# events-core — the curated event set for the scrubbable timeline (EventSet "events-core").
#
# Hand-curated source of truth. This file IS the data; sources/events-core/normalise.py
# only parses and validates it into pipeline.shapes.EventSet. Do not treat any other file
# as authoritative for these dates.
#
# Time convention
# ---------------
# t_min / t_max are years BEFORE PRESENT (GeoTime, see pipeline/shapes.py), t_min nearer
# the present. For deep-time events, "present" is calendar year-independent (radiometric
# ages are already reported as "Ma"/"Ga" before present). For HISTORICAL events (agriculture
# onward), t is computed with a fixed reference year rather than the run date, so the file
# does not silently drift every time it is regenerated:
#
#     t = 2025 - CE_year        (a BCE year is negative, e.g. 3400 BCE -> CE_year = -3400)
#
# See sources/events-core/README.md for the full rationale.
#
# Every event's date is verified against its citation, not invented. Contested dates carry
# a wide t_min/t_max interval and say so explicitly in the description — see
# sources/events-core/README.md for the verification method and the full source list.

events:
  - id: earth-formation
    label: Earth forms
    kind: moment
    t_min: 4.49e9
    t_max: 4.59e9
    t: 4.54e9
    tags: [earth-climate]
    importance: 1.0
    description: >
      Earth accretes from the solar nebula and differentiates into a metallic core and
      silicate mantle. Radiometric ages of the oldest meteorites and terrestrial/lunar
      samples converge on 4.54 +/- 0.05 Ga for the completion of accretion.
    citation: >
      Dalrymple, G.B. (2001). "The age of the Earth in the twentieth century: a problem
      (mostly) solved." Geological Society, London, Special Publications, 190, 205-221.

  - id: moon-forming-impact
    label: Moon-forming impact
    kind: moment
    t_min: 4.35e9
    t_max: 4.52e9
    t: 4.515e9
    tags: [earth-climate, catastrophe]
    importance: 0.9
    description: >
      A Mars-sized protoplanet collides with the young Earth; debris from the collision
      accretes into the Moon. Contested: Hf-W and zircon U-Pb dating place the event at
      4.51-4.52 Ga, but a 2024 tidal-remelting model argues most lunar rock ages instead
      record a later heating event around 4.35 Ga rather than the original crystallisation
      age, so the two camps disagree on which age the rock record actually preserves.
    citation: >
      Barboni, M. et al. (2017). "Early formation of the Moon 4.51 billion years ago."
      Science Advances, 3, e1602365. Contested by: Nimmo, F., Kleine, T. & Morbidelli, A.
      (2024). "Tidally driven remelting around 4.35 billion years ago indicates the Moon
      is old." Nature, 636, 598-602.
    # docs/GLOBE.md §5.3/§6: the flash itself, then the globe settles into the
    # `magma-ocean-regime` regime in data/globe_regimes.yaml. No literature envelope is
    # claimed for the flash's own duration (artistic), so the window is this event's own
    # contested date range.
    effect:
      kind: giant-impact
      windows:
        - {t_min: 4.35e9, t_max: 4.52e9}

  - id: first-life
    label: Earliest evidence of life
    kind: moment
    t_min: 3.4e9
    t_max: 4.1e9
    t: 3.45e9
    tags: [life]
    importance: 1.0
    description: >
      The oldest markers of biological activity on Earth. Contested and wide: robust
      stromatolite and microfossil evidence is secure at ~3.4-3.5 Ga (Pilbara, Australia),
      while claims of biogenic carbon in 4.1 Ga zircons and in 3.7-3.8 Ga Isua (Greenland)
      metasediments remain disputed and lack scientific consensus.
    citation: >
      Allwood, A.C. et al. (2006). "Stromatolite reef from the Early Archaean era of
      Australia." Nature, 441, 714-718 (~3.43 Ga, robust). Bell, E.A. et al. (2015).
      "Potentially biogenic carbon preserved in a 4.1 billion-year-old zircon." PNAS,
      112(47), 14518-14521 (contested upper bound).

  - id: origin-of-photosynthesis
    label: Oxygenic photosynthesis evolves
    kind: moment
    t_min: 2.43e9
    t_max: 3.4e9
    t: 2.7e9
    tags: [life, earth-climate]
    importance: 0.55
    description: >
      Cyanobacteria evolve oxygen-releasing (oxygenic) photosynthesis, the innovation that
      eventually oxygenates the atmosphere. It must predate the Great Oxidation Event (onset
      ~2.46-2.43 Ga), and most estimates put cyanobacteria at 2.7 Ga or earlier. Claims
      pushing the origin to ~3.4-3.0 Ga rest on disputed biomarkers and stromatolite
      evidence, so the upper bound is contested.
    citation: >
      Lyons, T.W., Reinhard, C.T. & Planavsky, N.J. (2014). "The rise of oxygen in Earth's
      early ocean and atmosphere." Nature, 506, 307-315. Gumsley, A.P. et al. (2017).
      "Timing and tempo of the Great Oxidation Event." PNAS, 114(8), 1811-1816.

  - id: eukaryotes-origin
    label: Eukaryotes originate
    kind: moment
    t_min: 1.6e9
    t_max: 2.1e9
    t: 1.6e9
    tags: [life]
    importance: 0.65
    description: >
      The lineage bearing a nucleus and internal membrane-bound organelles diverges from
      other life. Contested: candidate fossils (the Francevillian Biota, Gabon) are dated
      to 2.1 Ga, but the oldest fossils with unambiguous crown-eukaryote features are
      ~1.6 Ga, closer to molecular-clock estimates for the last eukaryotic common ancestor.
    citation: >
      El Albani, A. et al. (2010). "Large colonial organisms with coordinated growth in
      oxygenated environments 2.1 Gyr ago." Nature, 466, 100-104 (contested, 2.1 Ga).
      Bengtson, S. et al. (2017). "Three-dimensional preservation of cellular and
      subcellular structures suggests 1.6 billion-year-old crown-group red algae." PLOS
      Biology, 15(3), e2000735.

  - id: great-oxidation-event
    label: Great Oxidation Event
    kind: period
    t_min: 2.1e9
    t_max: 2.4e9
    tags: [earth-climate, life]
    importance: 0.95
    description: >
      Atmospheric oxygen rises by orders of magnitude as cyanobacterial photosynthesis
      overwhelms reducing sinks in the crust and ocean — the first permanent oxygenation
      of Earth's atmosphere, ending the anoxic Archean.
    citation: >
      Lyons, T.W., Reinhard, C.T. & Planavsky, N.J. (2014). "The rise of oxygen in Earth's
      early ocean and atmosphere." Nature, 506, 307-315.

  - id: banded-iron-formations
    label: Banded iron formations peak
    kind: period
    t_min: 1.85e9
    t_max: 2.8e9
    tags: [earth-climate]
    importance: 0.35
    description: >
      Dissolved iron in the anoxic Archean ocean is oxidised by cyanobacterial oxygen and
      precipitates as banded iron formations, the main geochemical record of early
      oxygenation. Deposition peaks in the late Archean (2.8-2.5 Ga) with a second pulse
      around 1.85 Ga, after which the deposits largely stop — marking, it is generally
      argued, when the deep ocean itself finally became oxygenated.
    citation: >
      Cloud, P. (1973). "Paleoecological Significance of the Banded Iron-Formation."
      Economic Geology, 68(7), 1135-1143. Holland, H.D. (2006). "The oxygenation of the
      atmosphere and oceans." Philosophical Transactions of the Royal Society B, 361(1470),
      903-915.

  - id: nuna-columbia-supercontinent
    label: Nuna/Columbia assembles and rifts apart
    kind: period
    t_min: 1.2e9
    t_max: 2.1e9
    tags: [earth-climate]
    importance: 0.55
    description: >
      One of the first supercontinents reconstructable from the rock record — variously
      called Nuna or Columbia, with reconstructions differing in exact extent and timing.
      Global-scale collisional orogens weld its core together from roughly 2.1-1.8 Ga, with
      continued accretionary growth at its margins out to about 1.6-1.5 Ga. Breakup is
      diachronous, beginning as early as 1.6 Ga and largely complete by 1.3-1.2 Ga,
      scattering fragments that later reassemble as Rodinia (below).
    citation: >
      Zhao, G., Cawood, P.A., Wilde, S.A. & Sun, M. (2002). "Review of global 2.1-1.8 Ga
      orogens: implications for a pre-Rodinia supercontinent." Earth-Science Reviews,
      59(1-2), 125-162. Rogers, J.J.W. & Santosh, M. (2002). "Configuration of Columbia, a
      Mesoproterozoic supercontinent." Gondwana Research, 5(1), 5-22. Zhao, G., Sun, M.,
      Wilde, S.A. & Li, S. (2004). "A Paleo-Mesoproterozoic supercontinent: assembly,
      growth and breakup." Earth-Science Reviews, 67(1-2), 91-123. Cross-checked live via
      Wikipedia, "Columbia (supercontinent)" (accessed 2026-09-22).

  - id: vredefort-impact-crater
    label: Vredefort impact
    kind: moment
    t_min: 2.019e9
    t_max: 2.027e9
    t: 2.023e9
    tags: [catastrophe]
    importance: 0.4
    description: >
      An asteroid strikes what is now the Free State, South Africa, excavating the largest
      verified impact crater on Earth — an original structure some 170-280 km across, now
      eroded to the central Vredefort Dome. A 2022 re-analysis of the crater's formation
      revised the impactor upward to roughly 20-25 km across, larger than the impactor
      behind the Chicxulub crater that ends the non-avian dinosaurs (k-pg-impact, below).
    citation: >
      Kamo, S.L., Reimold, W.U., Krogh, T.E. & Colliston, W.P. (1996). "A 2.023 Ga age for
      the Vredefort impact event and a first report of shock metamorphosed zircons in
      pseudotachylitic breccias and Granophyre." Earth and Planetary Science Letters,
      144(3-4), 369-387. Allen, N.H. et al. (2022). "A Revision of the Formation
      Conditions of the Vredefort Crater." Journal of Geophysical Research: Planets,
      127(10), e2022JE007186.

  - id: sudbury-impact-crater
    label: Sudbury impact
    kind: moment
    t_min: 1.848e9
    t_max: 1.851e9
    t: 1.8495e9
    tags: [catastrophe]
    importance: 0.4
    description: >
      An asteroid or comet roughly 10-15 km across strikes what is now Ontario, Canada,
      excavating the second-largest verified impact crater on Earth, originally about
      130 km across. Its solidified melt sheet, the Sudbury Igneous Complex, later
      differentiated into one of the world's largest nickel-copper-platinum group element
      ore deposits.
    citation: >
      Davis, D.W. (2008). "Sub-million-year age resolution of Precambrian igneous events
      by thermal extraction-thermal ionization mass spectrometer Pb dating of zircon:
      Application to crystallization of the Sudbury impact melt sheet." Geology, 36(5),
      383-386.

  - id: multicellularity-sexual-reproduction
    label: Complex multicellularity and sex
    kind: moment
    t_min: 1.030e9
    t_max: 1.064e9
    t: 1.047e9
    tags: [life]
    importance: 0.55
    description: >
      Bangiomorpha pubescens, a red alga from Arctic Canada, is the oldest fossil with
      differentiated reproductive cells and complex multicellular organisation — the
      earliest direct evidence of eukaryotic sexual reproduction.
    citation: >
      Gibson, T.M. et al. (2018). "Precise age of Bangiomorpha pubescens dates the origin
      of eukaryotic photosynthesis." Geology, 46(2), 135-138. Age 1047 +/- 17 Ma via
      Re-Os dating.

  - id: first-seaweeds
    label: Early green seaweeds
    kind: moment
    t_min: 7.9e8
    t_max: 1.0e9
    t: 1.0e9
    tags: [life]
    importance: 0.4
    description: >
      Proterocladus antiquus, a multicellular chlorophyte (green alga) from the Nanfen
      Formation, China, is described from over 1,000 specimens showing branching thalli,
      varied cell shapes and asexual resting spores — a fully multicellular seaweed body
      plan roughly a billion years old. Red algae (Bangiomorpha, ~1.05 Ga) had already
      become multicellular slightly earlier.
    citation: >
      Tang, Q., Pang, K., Yuan, X. & Xiao, S. (2020). "A one-billion-year-old multicellular
      chlorophyte." Nature Ecology & Evolution, 4(4), 543-549.

  - id: rodinia-supercontinent
    label: Rodinia assembles and rifts apart
    kind: period
    t_min: 6.33e8
    t_max: 1.3e9
    tags: [earth-climate]
    importance: 0.65
    description: >
      Nearly every continental block then in existence collides together through worldwide
      orogenic events between about 1.3 and 0.9 Ga, forming Rodinia. Rifting begins by
      around 825-750 Ma and is largely complete by 750-633 Ma, as the continents that once
      bordered Laurentia scatter and later regroup as Gondwana (below); the rifting's
      silicate weathering is one leading hypothesis for the runaway cooling behind the
      Cryogenian Snowball Earth glaciations, which follow almost immediately.
    citation: >
      Li, Z.X. et al. (2008). "Assembly, configuration, and break-up history of Rodinia: A
      synthesis." Precambrian Research, 160(1-2), 179-210. Cross-checked live via
      Wikipedia, "Rodinia" (accessed 2026-09-22).

  - id: snowball-earth
    label: Snowball Earth glaciations
    kind: period
    t_min: 6.35e8
    t_max: 7.2e8
    tags: [earth-climate]
    importance: 0.85
    description: >
      Two near-global glaciations — the Sturtian (~717-661 Ma) and Marinoan (ending 635 Ma; ~4-15 Myr, duration contested)
      — bracket the Cryogenian Period, with geological evidence of ice reaching equatorial
      latitudes ("Snowball Earth"). Onset and termination ages carry real uncertainty.
    citation: >
      Prave, A.R. et al. (2016). "A new rock-based definition for the Cryogenian Period
      (circa 720-635 Ma)." Episodes, 39(2), 1-7. Base and top ages of the Cryogenian
      System per the ICS International Chronostratigraphic Chart v2024/12. Effect windows:
      Rooney, A.D., Strauss, J.V., Brandon, A.D. & Macdonald, F.A. (2015). "A Cryogenian
      chronology: Two long-lasting synchronous Neoproterozoic glaciations." Geology, 43,
      459-462 (Sturtian, 56 Myr). Tasistro-Hart, A.R., Macdonald, F.A., Crowley, J.L. &
      Schmitz, M.D. (2025). "Four-million-year Marinoan snowball shows multiple routes to
      deglaciation." PNAS, 122(18), e2418281122 (Marinoan, duration contested).
    # docs/GLOBE.md §4.3/§6: this event's own t_min/t_max stay the full Cryogenian span
    # above; the effect carries the two glaciations as separate windows, each narrower and
    # separately cited.
    effect:
      kind: ice-shell
      windows:
        # Sturtian, ~717-661 Ma, 56 Myr duration (radioisotopic ages).
        - {t_min: 6.61e8, t_max: 7.17e8}
        # Marinoan, termination 635 Ma; duration contested (4-15 Myr) — Tasistro-Hart et
        # al. 2025's Namibian record gives ~4 Myr, i.e. roughly 639-635 Ma.
        - {t_min: 6.35e8, t_max: 6.39e8}

  - id: ediacaran-biota
    label: Ediacaran biota
    kind: period
    t_min: 5.388e8
    t_max: 5.71e8
    tags: [life]
    importance: 0.75
    description: >
      The Ediacara Biota — the first macroscopic, complex, soft-bodied multicellular
      organisms — appear worldwide (Avalon assemblage, ~571 Ma) and persist until the
      Ediacaran-Cambrian boundary. The interval here spans the biota's known stratigraphic
      range, not date uncertainty about a single origin event.
    citation: >
      Narbonne, G.M. (2005). "The Ediacara Biota: Neoproterozoic origin of animals and
      their ecosystems." Annual Review of Earth and Planetary Sciences, 33, 421-442. Top
      of Ediacaran Period (Fortune Head GSSP) = 538.8 +/- 0.2 Ma per the ICS International
      Chronostratigraphic Chart v2024/12.

  - id: acraman-impact-crater
    label: Acraman impact
    kind: moment
    t_min: 5.7e8
    t_max: 5.9e8
    t: 5.8e8
    tags: [catastrophe]
    importance: 0.35
    description: >
      An asteroid strikes the Gawler Ranges of South Australia, excavating a crater up to
      90 km across — among the largest known Precambrian impacts. Unlike most events in
      this file, its age comes not from dating the crater itself (deeply eroded, its melt
      long gone) but from the stratigraphic position of a shocked-ejecta horizon within the
      Bunyeroo Formation, several hundred kilometres away.
    citation: >
      Williams, G.E. & Wallace, M.W. (2003). "The Acraman asteroid impact, South
      Australia: magnitude and implications for the late Vendian environment." Journal of
      the Geological Society, 160(4), 545-554. Grey, K., Walter, M.R. & Calver, C.R.
      (2003). "Neoproterozoic biotic diversification: Snowball Earth, GOE, and the rise
      of bilaterians." Geology, 31(6), 459-462 (ejecta-horizon age constraint, ~580 Ma).

  - id: gondwana-supercontinent-assembly
    label: Gondwana assembles
    kind: period
    t_min: 5.3e8
    t_max: 6.0e8
    tags: [earth-climate]
    importance: 0.55
    description: >
      Fragments scattered by Rodinia's breakup (above) — Africa, South America,
      Madagascar, India, Australia and Antarctica — collide back together as the
      Mozambique Ocean closes, in the overlapping Brasiliano and Kuunga orogenies of the
      Pan-African orogenic episode, c. 600-530 Ma. An earlier phase, the East African
      Orogeny (c. 800-650 Ma), had already stitched together Gondwana's eastern cratons.
      Gondwana persists as the southern half of Pangaea (below) until that supercontinent's
      own breakup.
    citation: >
      Meert, J.G. & Van der Voo, R. (1997). "The assembly of Gondwana 800-550 Ma."
      Journal of Geodynamics, 23(3-4), 223-235. Meert, J.G. (2003). "A synopsis of events
      related to the assembly of eastern Gondwana." Tectonophysics, 362(1-4), 1-40.
      Cross-checked live via Wikipedia, "Gondwana" (accessed 2026-09-22).

  - id: cambrian-explosion
    label: Cambrian explosion
    kind: period
    t_min: 5.21e8
    t_max: 5.388e8
    tags: [life]
    importance: 1.0
    description: >
      Most modern animal phyla appear in the fossil record within a geologically short
      interval at the base of the Cambrian, as hard skeletons, complex eyes and burrowing
      behaviour become widespread for the first time.
    citation: >
      Base of the Cambrian System (Ediacaran-Cambrian boundary, Fortune Head GSSP,
      Newfoundland) = 538.8 +/- 0.2 Ma, per the ICS International Chronostratigraphic
      Chart v2024/12. Erwin, D.H. & Valentine, J.W. (2013). The Cambrian Explosion: The
      Construction of Animal Biodiversity. Roberts and Company (main diversification
      pulse ends within Cambrian Stage 3, ~521 Ma).

  - id: great-ordovician-biodiversification
    label: Great Ordovician Biodiversification Event
    kind: period
    t_min: 4.6733e8
    t_max: 4.9705e8
    tags: [life]
    importance: 0.6
    description: >
      Marine animal diversity rises sharply through the Ordovician as reef-building,
      suspension-feeding and pelagic clades radiate, tripling the number of marine families and
      replacing the sparser Cambrian fauna with a richer, more modern-looking Paleozoic
      one. Neither instantaneous nor globally synchronous — different clades diversify at
      different times in different places.
    citation: >
      Fan, J. et al. (2020). "A high-resolution summary of Cambrian to Early Triassic
      marine invertebrate biodiversity." Science, 367(6475), 272-277.

  - id: land-plants
    label: Land plants colonise land
    kind: moment
    t_min: 4.25e8
    t_max: 4.70e8
    t: 4.475e8
    tags: [life]
    importance: 0.8
    description: >
      Embryophytes (land plants) colonise the terrestrial surface. Contested: the oldest
      fossil evidence is liverwort-like cryptospores at ~470 Ma (Dapingian, Ordovician),
      while the oldest unambiguous vascular macrofossils (Cooksonia) are ~425 Ma (Silurian).
    citation: >
      Rubinstein, C.V. et al. (2010). "Early Middle Ordovician evidence for land plants in
      Argentina (eastern Gondwana)." New Phytologist, 188(2), 365-369. Edwards, D., Fanning,
      U. & Richardson, J.B. (1994) for Cooksonia macrofossils, Silurian, ~425 Ma.

  - id: end-ordovician-extinction
    label: End-Ordovician mass extinction
    kind: period
    t_min: 4.40e8
    t_max: 4.45e8
    tags: [catastrophe]
    importance: 0.8
    description: >
      One of the "Big Five" mass extinctions, eliminating roughly 85% of marine species in
      two pulses: a first pulse tied to rapid Gondwanan glaciation and sea-level fall, a
      second later in the Hirnantian, tied to widespread ocean anoxia and euxinia that
      persisted into the earliest Silurian. Bracketing dates carry real uncertainty; the two-pulse structure is well
      established.
    citation: >
      Sheehan, P.M. (2001). "The Late Ordovician Mass Extinction." Annual Review of Earth
      and Planetary Sciences, 29(1), 331-364. Stockey, R.G. et al. (2020). "Persistent
      global marine euxinia in the early Silurian." Nature Communications, 11(1), 1804.

  - id: insects
    label: First insects
    kind: moment
    t_min: 3.96e8
    t_max: 4.11e8
    t: 4.09e8
    tags: [life]
    importance: 0.5
    description: >
      Rhyniognatha hirsti, from the Rhynie chert, is the specimen most commonly cited as
      the oldest insect, based on mandible structure some interpret as diagnostic of a
      winged insect. Contested: the fragmentary specimen has also been reinterpreted as a
      myriapod rather than an insect.
    citation: >
      Engel, M.S. & Grimaldi, D.A. (2004). "New light shed on the oldest insect." Nature,
      427, 627-630. Rhynie chert radiometrically dated to ~407-411 Ma (Parry, S.F. et al.
      2011, Geology). Reinterpretation: Haug, C. & Haug, J.T. (2017). "The presumed oldest
      flying insect: more likely a myriapod?" PeerJ, 5, e3402.

  - id: tetrapods
    label: First tetrapods
    kind: moment
    t_min: 3.65e8
    t_max: 3.95e8
    t: 3.905e8
    tags: [life]
    importance: 0.85
    description: >
      The oldest evidence of tetrapods — four-limbed vertebrates capable of terrestrial
      locomotion. Trackways from Zachelmie, Poland predate the oldest body fossils
      (Ichthyostega, Acanthostega) by roughly 20-30 Myr.
    citation: >
      Niedzwiedzki, G. et al. (2010). "Tetrapod trackways from the early Middle Devonian
      period of Poland." Nature, 463, 43-48 (recalibrated to ~390-391 Ma against GTS2012).
      Ahlberg, P.E. & Clack, J.A. (2006) for Ichthyostega/Acanthostega body fossils,
      ~365 Ma, Late Devonian.

  - id: first-forests
    label: First forests
    kind: moment
    t_min: 3.78e8
    t_max: 3.93e8
    t: 3.90e8
    tags: [life]
    importance: 0.55
    description: >
      The first forests appear in the Middle Devonian. The oldest known, ~390 Ma in Somerset,
      England, is a stand of Calamophyton, a small cladoxylopsid tree; at Gilboa, New York,
      slightly younger stumps preserve dense stands of the taller cladoxylopsid
      Eospermatopteris. Archaeopteris, the first tree with true wood and fern-like leafy
      branches, is present by ~385 Ma and dominates Late Devonian forests.
    citation: >
      Davies, N.S., McMahon, W.J. & Berry, C.M. (2024). "Earth's earliest forest: fossilized
      trees and vegetation-induced sedimentary structures from the Middle Devonian (Eifelian)
      Hangman Sandstone Formation, Somerset and Devon, SW England." Journal of the Geological
      Society, doi:10.1144/jgs2023-204. Stein, W.E., Mannolini, F., Hernick, L.V., Landing, E.
      & Berry, C.M. (2007). "Giant cladoxylopsid trees resolve the enigma of the Earth's
      earliest forest stumps at Gilboa." Nature, 446(7138), 904-907.

  - id: first-seed-plants
    label: First seed plants
    kind: moment
    t_min: 3.6e8
    t_max: 3.7e8
    t: 3.70e8
    tags: [life]
    importance: 0.55
    description: >
      Elkinsia polymorpha, a seed fern from the Late Devonian of West Virginia, bears the
      oldest well-documented seeds: an integumented ovule enclosed in a cupule, freeing
      reproduction from the standing water that spore-dispersal required. The precursor
      Runcaria (~385 Ma, Middle Devonian, Belgium) shows the integument evolving slightly
      earlier, without yet being a true seed.
    citation: >
      Rothwell, G.W., Scheckler, S.E. & Gillespie, W.H. (1989). "Elkinsia gen. nov., a Late
      Devonian gymnosperm with cupulate ovules." Botanical Gazette, 150(2), 170-189. UNVERIFIED:
      author, year and the Elkinsia/Late-Devonian/~370 Ma facts were confirmed live; the title,
      journal, volume and pages were not — see sources/events-core/README.md "Verification
      method".

  - id: late-devonian-extinction
    label: Late Devonian mass extinction
    kind: period
    t_min: 3.5886e8
    t_max: 3.7215e8
    tags: [catastrophe]
    importance: 0.75
    description: >
      Two extinction pulses bracket the Late Devonian: the Kellwasser event at the
      Frasnian-Famennian boundary (~372.15 Ma), then the Hangenberg event ending the
      Devonian entirely (~358.86 Ma) — together one of the "Big Five," severely reducing
      reef-building and marine vertebrate diversity and triggering marked body-size
      reduction among surviving fish lineages.
    citation: >
      Becker, R.T. & House, M.R. "Kellwasser Events and goniatite successions in the
      Devonian of the Montagne Noire." Courier Forschungsinstitut Senckenberg, 169, 45-77
      (UNVERIFIED: the year is given as 1986 but looks inconsistent with that volume). Sallan, L. & Galimberti, A.K. (2015). "Body-size reduction in vertebrates
      following the end-Devonian mass extinction." Science, 350(6262), 812-815. Percival,
      L.M.E. et al. (2018). "Precisely dating the Frasnian-Famennian boundary." Scientific
      Reports, 8, 9578 (UNVERIFIED: bibliographic line not confirmed against its DOI page).

  - id: amniotes
    label: First amniotes
    kind: moment
    t_min: 3.07e8
    t_max: 3.589e8
    t: 3.125e8
    tags: [life]
    importance: 0.7
    description: >
      The amniotic egg allows vertebrates to reproduce away from standing water. Hylonomus
      lyelli (~318-307 Ma) is the oldest uncontroversial amniote. Contested: fossil
      trackways from the Snowy Plains Formation, Victoria, Australia, attributed to a
      crown-group amniote with clawed feet and dated to the early Tournaisian (~358.9-354
      Ma), would push the origin of crown Amniota back by 35-40 Myr if the attribution
      holds.
    citation: >
      Carroll, R.L. (1964). "The earliest reptiles." Zoological Journal of the Linnean
      Society, 45, 61-83 (Hylonomus lyelli). Contested pushback: Long, J.A. et al. (2025).
      "Earliest amniote tracks recalibrate the timeline of tetrapod evolution." Nature,
      641, 1193-1200 (Snowy Plains Formation track-bearing slab).

  - id: late-paleozoic-ice-age
    label: Late Paleozoic Ice Age
    kind: period
    t_min: 2.55e8
    t_max: 3.6e8
    tags: [earth-climate]
    importance: 0.6
    description: >
      Repeated glacial-interglacial cycles build and melt ice sheets across Gondwana for
      roughly a hundred million years, ice centres migrating from South America and
      Africa early on to a final Australian centre as Gondwana drifts across the South
      Pole. The ice age proper is usually dated from ~335-330 Ma, though isolated, more
      transient glacial episodes reach back to ~360 Ma (hence the wide t_max); its last
      alpine glaciers melt in eastern Australia around 255 Ma. Contested: whether the
      record reflects one continuous glaciation or as many as 25 separate, diachronous
      Gondwanan ice sheets is actively debated.
    citation: >
      Montanez, I.P. & Poulsen, C.J. (2013). "The Late Paleozoic Ice Age: An Evolving
      Paradigm." Annual Review of Earth and Planetary Sciences, 41, 629-656. Scotese,
      C.R. et al. (2021). "Phanerozoic paleotemperatures: The earth's changing climate
      during the last 540 million years." Earth-Science Reviews, 215, 103503. Overall
      360-255 Ma bracket and the one-event-vs-many-ice-sheets debate corroborated live
      via Wikipedia, "Late Paleozoic icehouse" (2026-09-14), which cites Rosa & Isbell
      (2021) and Kent & Muttoni (2020) for the same 360-255 Ma figures and Montanez
      (2021) for the ~335-330 Ma proper-onset date.

  - id: carboniferous-rainforest-collapse
    label: Carboniferous rainforest collapse
    kind: moment
    t_min: 3.0e8
    t_max: 3.07e8
    t: 3.05e8
    tags: [life, earth-climate]
    importance: 0.5
    description: >
      Around 305 Ma the lycopsid-dominated coal-swamp rainforests of equatorial Euramerica
      fragment into isolated refugia and give way to tree-fern-dominated vegetation as the
      climate dries; in Cathaysia (China) such rainforests persist until the end of the
      Permian. The scale and ecological effects are contested.
    citation: >
      Sahney, S., Benton, M.J. & Falcon-Lang, H.J. (2010). "Rainforest collapse triggered
      Carboniferous tetrapod diversification in Euramerica." Geology, 38(12), 1079-1082.
      Dunne, E.M. et al. (2018). Proceedings of the Royal Society B (contests the effect on
      tetrapod diversity). Montanez, I.P. et al. (2007). "CO2-forced climate and vegetation
      instability during late Paleozoic deglaciation." Science, 315(5808), 87-91.

  - id: gymnosperm-radiation
    label: Conifers and gymnosperms radiate
    kind: period
    t_min: 2.9e8
    t_max: 3.1e8
    tags: [life, earth-climate]
    importance: 0.35
    description: >
      As the coal-swamp lycopsids retreat with the Carboniferous rainforest collapse (above),
      walchian conifers (Voltziales, e.g. Walchia) spread across drier ground. They are among
      the earliest conifers, which first appear in the Middle Pennsylvanian, before this
      interval; it marks their spread within a broader seed-plant (gymnosperm) radiation that
      comes to dominate Permian and Triassic vegetation.
    citation: >
      UNVERIFIED: no primary source confirmed yet. Walchian conifer ranges were checked only
      against encyclopaedia summaries (Wikipedia, "Walchia" and "Voltziales"); Looy, C.V. &
      Duijnstee, I.A.P. (2020) on voltzialean cone evolution has its authors and year
      confirmed but not its journal or volume.

  # UNVERIFIED which source pair a curator should anchor the interval on: Scotese
  # (2004)/Torsvik & Cocks (2017) vs. Wikipedia's own cited Rogers & Santosh (2004), which
  # give the same broad shape but different precise assembly/breakup bounds.
  - id: pangaea-supercontinent
    label: Pangaea assembles and rifts apart
    kind: period
    t_min: 1.75e8
    t_max: 3.35e8
    tags: [earth-climate]
    importance: 0.7
    description: >
      Nearly all of Earth's continental crust collides into the single supercontinent
      Pangaea through the Carboniferous and into the Permian, then spends over 150
      million years slowly rifting apart into the modern continents, opening the
      Atlantic and Indian Oceans. Assembly begins around 335 Ma; when it counts as
      complete is itself debated, with estimates ranging from the Early Permian (~300
      Ma) to as late as ~270 Ma once Siberia's collision is counted. Breakup begins near
      the Triassic-Jurassic boundary (~200 Ma); near-total fragmentation is dated to
      ~175 Ma by some sources and not until the Middle Jurassic (~160 Ma) by others.
    citation: >
      Scotese, C.R. (2004). "A Continental Drift Flipbook." Journal of Geology, 112(6),
      729-741 (assembly by ~335-320 Ma). Torsvik, T.H. & Cocks, L.R.M. (2017). Earth
      History and Palaeogeography. Cambridge University Press (breakup onset ~200 Ma,
      near-total fragmentation by ~175 Ma). Cross-checked live via Wikipedia, "Pangaea"
      (2026-09-14), which instead names Rogers, J.J.W. & Santosh, M. (2004), Continents
      and Supercontinents (Oxford University Press), for a ~335 Ma assembly start / ~300
      Ma completion and a breakup running to the Middle Jurassic (~160 Ma) — the same
      broad shape, different precise bounds; UNVERIFIED which pair of sources a curator
      should anchor the interval on.

  - id: siberian-traps
    label: Siberian Traps eruptions
    kind: period
    t_min: 2.5e8
    t_max: 2.54e8
    tags: [catastrophe, earth-climate]
    importance: 0.7
    description: >
      One of the largest volcanic events in Earth's history: roughly two million years of
      flood-basalt eruptions across Siberia, releasing enormous volumes of CO2, sulphur
      and halogens. Widely held to be the principal driver of the end-Permian mass
      extinction (below), through some combination of runaway warming, ocean acidification
      and anoxia.
    citation: >
      Burgess, S.D. & Bowring, S.A. (2015). "High-precision geochronology confirms
      voluminous magmatism before, during, and after Earth's most severe extinction."
      Science Advances, 1(7), e1500470. Kamo, S.L. et al. (2003). "Rapid eruption of
      Siberian flood-volcanic rocks and evidence for coincidence with the
      Permian-Triassic boundary and mass extinction at 251 Ma." Earth and Planetary
      Science Letters, 214(1-2), 75-91.

  - id: permian-extinction
    label: End-Permian mass extinction
    kind: period
    t_min: 2.5188e8
    t_max: 2.51941e8
    tags: [catastrophe]
    importance: 1.0
    description: >
      The most severe mass extinction in Earth's history eliminates over 90% of marine
      species and roughly 70% of terrestrial vertebrate genera, over an interval as short
      as ~60,000 years — one of the most precisely dated events in deep time.
    citation: >
      Burgess, S.D., Bowring, S. & Shen, S.Z. (2014). "High-precision timeline for Earth's
      most severe extinction." PNAS, 111(9), 3316-3321. Extinction interval bracketed
      between 251.941 +/- 0.037 Ma and 251.880 +/- 0.031 Ma at the Meishan GSSP, Zhejiang,
      China.

  - id: dinosaurs
    label: First dinosaurs
    kind: moment
    t_min: 2.31e8
    t_max: 2.43e8
    t: 2.31e8
    tags: [life]
    importance: 0.8
    description: >
      The oldest unambiguous dinosaurs (Eoraptor, Herrerasaurus) appear in the
      Ischigualasto Formation of Argentina ~231 Ma. Contested: the fragmentary
      Nyasasaurus parringtoni, if correctly identified as a dinosaur rather than a close
      relative, would push the origin back to ~243 Ma.
    citation: >
      Martinez, R.N. et al. (2011). "A basal dinosaur from the dawn of the dinosaur era in
      southwestern Pangaea." Science, 331(6014), 206-210 (Eoraptor, ~231 Ma). Nesbitt, S.J.
      et al. (2013). "The oldest dinosaur? A Middle Triassic dinosauriform from Tanzania."
      Biology Letters, 9(1), 20120949 (Nyasasaurus, contested, ~243 Ma).

  - id: mammals-origin
    label: First mammals
    kind: moment
    t_min: 2.05e8
    t_max: 2.25e8
    t: 2.15e8
    tags: [life]
    importance: 0.55
    description: >
      The earliest mammaliaforms — small, likely nocturnal insectivores — diverge from
      cynodont therapsids around the Triassic-Jurassic boundary.
    citation: >
      Lucas, S.G. & Luo, Z. (1993). "Adelobasileus from the Upper Triassic of West Texas:
      the oldest mammal." Journal of Vertebrate Paleontology, 13(3), 309-334 (~225 Ma).
      Kermack, K.A., Mussett, F. & Rigney, H.W. (1981) for Morganucodon, ~205 Ma.

  - id: manicouagan-impact-crater
    label: Manicouagan impact
    kind: moment
    t_min: 2.13e8
    t_max: 2.15e8
    t: 2.14e8
    tags: [catastrophe]
    importance: 0.35
    description: >
      A ~5 km asteroid strikes what is now Quebec, Canada, excavating a crater originally
      about 100 km across — Earth's sixth-largest confirmed impact structure, now the
      ring-shaped Manicouagan Reservoir. At 214 Ma it long predates the end-Triassic
      extinction (201 Ma, below) by too wide a margin to be its trigger, a hypothesis once
      proposed and since abandoned; a contested link to a smaller, localised Late Triassic
      faunal turnover remains debated.
    citation: >
      Hodych, J.P. & Dunning, G.R. (1992). "Did the Manicouagan impact trigger
      end-of-Triassic mass extinction?" Geology, 20(1), 51-54. Cross-checked live via
      Wikipedia, "Manicouagan Reservoir" (accessed 2026-09-22), which cites a more recent
      Ramezani et al. U-Pb zircon age of 215.56 +/- 0.05 Ma.

  - id: end-triassic-extinction
    label: End-Triassic mass extinction
    kind: period
    t_min: 2.010e8
    t_max: 2.018e8
    tags: [catastrophe]
    importance: 0.8
    description: >
      One of the "Big Five", and the one that hands the world to the dinosaurs. Its trigger
      is the Central Atlantic Magmatic Province, erupting as Pangaea begins to tear open
      along the line that becomes the Atlantic. The dying falls hardest on the crurotarsans
      — the crocodile-line archosaurs that had dominated Triassic landscapes and kept
      dinosaurs in a minor role for some 30 million years — and takes the last conodonts
      with it. Dinosaurs inherit the emptied niches and hold them for the next 135 million
      years.
    citation: >
      Blackburn, T.J. et al. (2013). "Zircon U-Pb Geochronology Links the End-Triassic
      Extinction with the Central Atlantic Magmatic Province." Science, 340(6135), 941-945.

  - id: birds-origin
    label: First birds
    kind: moment
    t_min: 1.485e8
    t_max: 1.508e8
    t: 1.4965e8
    tags: [life]
    importance: 0.6
    description: >
      Archaeopteryx lithographica, from the Solnhofen limestone of Bavaria, is the
      earliest widely accepted bird — a feathered, winged theropod bridging non-avian
      dinosaurs and modern birds.
    citation: >
      Foth, C. & Rauhut, O.W.M. (2017). "Re-evaluation of the Haarlem Archaeopteryx and
      the radiation of maniraptoran theropod dinosaurs." BMC Evolutionary Biology, 17,
      236. Archaeopteryx horizon within the Solnhofen Limestone (Late Jurassic,
      Tithonian), ~150.8-148.5 Ma.

  - id: earliest-pollinating-insects
    label: Earliest pollinating insects
    kind: period
    t_min: 9.3e7
    t_max: 1.65e8
    tags: [life]
    importance: 0.5
    description: >
      Long-proboscid scorpionflies (Aneuretopsychidae and kin, Jurassic-Cretaceous,
      ~165-93 Ma) carry a tubular mouthpart interpreted as adapted to drink the
      pollination droplets of insect-pollinated gymnosperms such as Bennettitales,
      evidence for insect pollination well before flowers existed. Contested: a separate
      ~100 Ma Burmese-amber specimen, Melittosphex burmensis, was described as the oldest
      bee, but is now reassessed as an aculeate wasp of uncertain position rather than a
      true bee.
    citation: >
      Ren, D., Labandeira, C.C., Santiago-Blay, J.A. et al. (2009). "A Probable
      Pollination Mode Before Angiosperms: Eurasian, Long-Proboscid Scorpionflies."
      Science, 326(5954), 840-847. Poinar, G.O. & Danforth, B.N. (2006). "A fossil bee
      from Early Cretaceous Burmese amber." Science, 314(5799), 614 (original bee claim,
      contested reclassification).

  - id: flowering-plants
    label: Flowering plants
    kind: moment
    t_min: 1.25e8
    t_max: 1.33e8
    t: 1.30e8
    tags: [life]
    importance: 0.75
    description: >
      The oldest undisputed flowering plants (Montsechia vidalii, Archaefructus) appear
      in Early Cretaceous lake deposits. A disputed claim of Middle Triassic
      angiosperm-like pollen (~247-242 Ma) from the Alps has not been widely accepted, so
      the timing of angiosperm origin well before the Cretaceous remains unresolved.
    citation: >
      Gomez, B. et al. (2015). "Montsechia, an ancient aquatic angiosperm." PNAS,
      112(35), 10985-10988 (~130 Ma, Barremian). Earliest undisputed angiosperm pollen
      spans the Hauterivian-Barremian, ~132.9-125 Ma.

  - id: angiosperm-radiation
    label: Flowering plants spread and radiate
    kind: period
    t_min: 8.0e7
    t_max: 1.25e8
    tags: [life]
    importance: 0.55
    description: >
      Within the "Cretaceous Terrestrial Revolution," angiosperms spread from a marginal
      lake-edge presence to ecological dominance over roughly 45 million years, coevolving
      with pollinating insects and reshaping terrestrial food webs; the traditional bound
      is 125-80 Ma, though some authors extend the revolution's later phase into the
      Paleogene.
    citation: >
      Lloyd, G.T. et al. (2008). "Dinosaurs and the Cretaceous Terrestrial Revolution."
      Proceedings of the Royal Society B, 275(1650), 2483-2490. Benton, M.J., Wilf, P. &
      Sauquet, H. "The Angiosperm Terrestrial Revolution and the origins of modern
      biodiversity." New Phytologist, 233(5), 2017-2035 (UNVERIFIED: year given as 2021; the
      volume may be dated 2022).

  # UNVERIFIED: Wikipedia's own reference list does not name Roberts & Kirschbaum (1995)
  # directly, though its stated 100-66 Ma range matches it.
  - id: western-interior-seaway
    label: Western Interior Seaway
    kind: period
    t_min: 6.6e7
    t_max: 1.0e8
    tags: [earth-climate]
    importance: 0.45
    description: >
      A shallow epicontinental sea floods the middle of North America through the
      Cretaceous greenhouse's high sea level, splitting the continent into the western
      landmass Laramidia and the eastern Appalachia for roughly 34 million years, before
      draining at the very end of the Cretaceous. Its final closure lines up with the
      K-Pg boundary already anchored elsewhere in this file by k-pg-impact.
    citation: >
      Roberts, L.N.R. & Kirschbaum, M.A. (1995). "Paleogeography of the Late Cretaceous
      of the Western Interior of Middle North America — Coal Distribution and Sediment
      Accumulation." USGS Professional Paper 1561. The 100-66 Ma bracket was
      corroborated live via Wikipedia, "Western Interior Seaway" (2026-09-14);
      UNVERIFIED — that article's own citations do not name the USGS paper directly,
      though its stated 100-66 Ma range matches it.

  - id: deccan-traps
    label: Deccan Traps eruptions
    kind: period
    t_min: 6.56e7
    t_max: 6.63e7
    tags: [catastrophe, earth-climate]
    importance: 0.5
    description: >
      Massive flood-basalt volcanism in west-central India straddles the K-Pg boundary,
      with the bulk of the eruptive volume concentrated in the ~66-65 Ma window. A
      long-running debate weighs Deccan volcanism against the Chicxulub impact (below) as
      a contributor to the end-Cretaceous extinction; a 2015 study argued the impact
      itself triggered a shift in Deccan's eruptive tempo.
    citation: >
      Schoene, B. et al. (2021). "An evaluation of Deccan Traps eruption rates using
      geochronologic data." Geochronology, 3(1), 181-198. Renne, P.R. et al. (2015).
      "State shift in Deccan volcanism at the Cretaceous-Paleogene boundary, possibly
      induced by impact." Science, 350(6256), 76-78.

  - id: k-pg-impact
    label: K-Pg impact
    kind: moment
    t_min: 6.6032e7
    t_max: 6.6054e7
    t: 6.6043e7
    tags: [catastrophe, earth-climate]
    importance: 1.0
    description: >
      The Chicxulub asteroid impacts the Yucatan Peninsula, triggering the
      Cretaceous-Paleogene mass extinction that ends the age of non-avian dinosaurs.
    citation: >
      Renne, P.R. et al. (2013). "Time scales of critical events around the
      Cretaceous-Paleogene boundary." Science, 339(6120), 684-687. Chicxulub impact and
      K-Pg boundary dated to 66.043 +/- 0.011 Ma.
    effect:
      kind: impact-winter
      # Conventional Chicxulub crater centre (Yucatan Peninsula, Mexico) — the coordinates
      # docs/GLOBE.md §5.3 flags to verify against a citable source. Present-day lat/lon;
      # as shipped (G6) the globe uses it exactly there, unreconstructed, rather than at
      # Chicxulub's 66 Ma plate position — a flagged approximation, not a bug (see
      # web/src/globe/effects/overlays.ts's `impactWinterAnchor` doc comment and
      # docs/GLOBE.md §5.3's "As shipped" note).
      anchor: {lat: 21.3, lon: -89.5}
      windows:
        - {t_min: 6.6032e7, t_max: 6.6054e7}

  - id: k-pg-aftermath
    label: K-Pg aftermath fern spike
    kind: period
    t_min: 6.6038e7
    t_max: 6.6043e7
    tags: [life, catastrophe]
    importance: 0.5
    description: >
      Over roughly the first thousand years at well-dated sites after the Chicxulub impact, sections worldwide (most
      densely sampled in North America and New Zealand) record a sharp spike in fern
      spores — a "fern spike" — as ferns, opportunistic recolonisers of disturbed ground,
      dominate a landscape stripped of the forest that stood before impact.
    citation: >
      Vajda, V., Raine, J.I. & Hollis, C.J. (2001). "Indication of global deforestation at
      the Cretaceous-Tertiary boundary by New Zealand fern spike." Science, 294(5547),
      1700-1702.

  - id: paleocene-mammal-radiation
    label: Paleocene mammal radiation
    kind: period
    t_min: 5.6e7
    t_max: 6.6043e7
    tags: [life]
    importance: 0.5
    description: >
      In the aftermath of the K-Pg extinction, placental mammals rapidly radiate to fill the
      large-herbivore niches the non-avian dinosaurs left empty: mammal maximum body size is
      near pre-extinction values within ~100 kyr and has tripled by ~300 kyr. Pantodonts such
      as Pantolambda, a heavy-bodied browsing mammal, appear by the mid-Paleocene; the
      interval spans the radiation from the extinction to the close of the Paleocene.
    citation: >
      Lyson, T.R. et al. (2019). "Exceptional continental record of biotic recovery after the
      Cretaceous-Paleogene mass extinction." Science, 366, 977-983. Halliday, T.J.D.,
      Upchurch, P. & Goswami, A. (2017; online 2015). "Resolving the relationships of
      Paleocene placental mammals." Biological Reviews, 92(1), 521-550. Pantolambda ~63-57 Ma
      per Wikipedia, "Pantolambda" (tertiary; the weakest source in this record).

  - id: primates
    label: First primates
    kind: moment
    t_min: 5.6e7
    t_max: 6.59e7
    t: 6.59e7
    tags: [life]
    importance: 0.7
    description: >
      Purgatorius, a stem primate from Montana, appears within roughly 150,000 years of
      the K-Pg extinction. Crown-group primates (Euprimates, e.g. Teilhardina) are not
      securely documented until ~56 Ma — the interval spans this stem-vs-crown ambiguity.
    citation: >
      Wilson Mantilla, G.P. et al. (2021). "Earliest Palaeocene purgatoriids and the
      initial radiation of stem primates." Royal Society Open Science, 8(2), 210050
      (Purgatorius, ~65.9 Ma). Smith, T., Rose, K.D. & Gingerich, P.D. (2006) for
      Teilhardina, oldest crown primate, ~55.8 Ma.

  - id: petm
    label: Paleocene-Eocene Thermal Maximum (PETM)
    kind: period
    t_min: 5.58e7
    t_max: 5.60e7
    tags: [earth-climate]
    importance: 0.55
    description: >
      A sudden release of isotopically light carbon drives several degrees of global warming
      in geologically almost no time, the most extreme of several Cenozoic hyperthermals. The
      rapid onset (on the order of 6 kyr) is followed by a ~100-170 kyr warm "body" phase and
      a slower ~50-135 kyr recovery.
    citation: >
      Kirtland Turner, S. (2018). "Constraints on the onset duration of the Paleocene-Eocene
      Thermal Maximum." Philosophical Transactions of the Royal Society A, 376(2130),
      20170082. Onset
      dated to 55.9-56.0 Ma.

  - id: india-asia-collision
    label: India-Asia collision begins
    kind: moment
    t_min: 3.4e7
    t_max: 5.9e7
    t: 4.65e7
    tags: [earth-climate]
    importance: 0.6
    description: >
      India's continental margin collides with Asia, initiating the Himalayan orogeny and
      the uplift of the Tibetan Plateau — a collision still ongoing today. Contested: the
      timing of initial contact is one of the most debated questions in Earth science, with
      proposals ranging from a middle-Paleocene 59 +/- 1 Ma sediment-provenance signal to
      paleomagnetic estimates as young as 34 Ma.
    citation: >
      Aitchison, J.C., Ali, J.R. & Davis, A.M. (2007). "When and where did India and Asia
      collide?" Journal of Geophysical Research: Solid Earth, 112, B05423 (review of
      competing timing estimates spanning 70-34 Ma). Middle-Paleocene 59 +/- 1 Ma
      sediment-provenance estimate per "The timing of India-Asia collision onset: facts,
      theories, controversies," Earth-Science Reviews (2016).

  - id: early-eocene-climatic-optimum
    label: Early Eocene Climatic Optimum
    kind: period
    t_min: 4.9e7
    t_max: 5.4e7
    tags: [earth-climate]
    importance: 0.55
    description: >
      The warmest sustained interval of the last 66 million years. Swamp forests,
      crocodilians and year-round mammal residents such as Coryphodon live above the Arctic
      Circle. Published bounds vary, from about 53-50 Ma to about 54-49 Ma.
    citation: >
      Woodburne, M.O., Gunnell, G.F. & Stucky, R.K. (2009). PNAS, 106(32), 13399-13403 (EECO
      53-50 Ma). Eberle, J.J. et al. (2014). PLOS ONE, 9(5), e96079. Eberle, J.J., Fricke,
      H.C. & Humphrey, J.D. (2009). "Lower-latitude mammals as year-round residents in Eocene
      Arctic forests." Geology, 37, 499-502.

  - id: popigai-impact-crater
    label: Popigai impact
    kind: moment
    t_min: 3.55e7
    t_max: 3.59e7
    t: 3.57e7
    tags: [catastrophe, earth-climate]
    importance: 0.4
    description: >
      An asteroid strikes northern Siberia, excavating a 90-100 km crater and
      shock-converting graphite in the target rock into microscopic diamonds — the source
      of one of the world's largest diamond deposits. It forms within about 25,000 years
      of the Chesapeake Bay impact (below), and a link between the two impacts and the
      Eocene-Oligocene cooling step that follows soon after has been proposed but is not
      established: a 2024 reassessment found no paleoclimatic anomaly associated with
      either impact.
    citation: >
      Bottomley, R., Grieve, R., York, D. & Masaitis, V. (1997). "The age of the Popigai
      impact event and its relation to events at the Eocene/Oligocene boundary." Nature,
      388(6640), 365-368. Wade, B. & Cheng, N.K.Y. (2024). "No paleoclimatic anomalies are
      associated with the late Eocene extraterrestrial impact events." Communications
      Earth & Environment, 5, 710.

  - id: chesapeake-bay-impact-crater
    label: Chesapeake Bay impact
    kind: moment
    t_min: 3.52e7
    t_max: 3.58e7
    t: 3.55e7
    tags: [catastrophe, earth-climate]
    importance: 0.4
    description: >
      An asteroid strikes the edge of the continental shelf off what is now Virginia, USA,
      excavating an 85 km crater — one of the best-preserved "wet-target" impact
      structures known, now buried beneath the mouth of Chesapeake Bay. It forms within
      about 25,000 years of the Popigai impact (above); geochemical evidence for two
      chemically distinct impactor types rules out a single parent-body breakup, pointing
      instead to an unexplained multi-source asteroid shower.
    citation: >
      Poag, C.W., Koeberl, C. & Reimold, W.U. (2004). The Chesapeake Bay Crater: Geology
      and Geophysics of a Late Eocene Submarine Impact Structure. Springer. Schmitz, B. et
      al. (2015). "Fragments of Late Eocene Earth-impacting asteroids linked to
      disturbance of asteroid belt." Earth and Planetary Science Letters, 425, 77-83.

  - id: eocene-oligocene-transition
    label: Eocene-Oligocene transition; first Antarctic ice sheet
    kind: period
    t_min: 3.365e7
    t_max: 3.44e7
    tags: [earth-climate]
    importance: 0.75
    description: >
      Earth's climate steps from the early Cenozoic greenhouse into the modern icehouse: the
      Antarctic ice sheet grows rapidly in two pulses, the EOT-1 cooling event (~34.1-33.9 Ma)
      and the larger Oi-1 glaciation (~33.8-33.6 Ma), reaching the coastline for the first
      time. The associated cooling drives a major mammalian faunal turnover in Europe known
      as the Grande Coupure.
    citation: >
      Hutchinson, D.K. et al. (2021). "The Eocene-Oligocene transition: a review of marine
      and terrestrial proxy data, models and model-data comparisons." Climate of the Past, 17,
      269 (EOT 34.44-33.65 Ma). Coxall, H.K. et al. (2005). "Rapid stepwise onset of Antarctic glaciation and deep-sea
      acidification in the late Eocene." Nature, 433, 53-57. Eocene-Oligocene boundary age
      33.9 Ma per the ICS International Chronostratigraphic Chart v2024/12. "Grande Coupure"
      term coined by Stehlin, H.G. (1910).

  - id: antarctic-circumpolar-current
    label: Drake Passage opens; proto-Antarctic Circumpolar Current
    kind: moment
    t_min: 2.1e7
    t_max: 3.4e7
    t: 2.75e7
    tags: [earth-climate]
    importance: 0.45
    description: >
      The opening of the Drake Passage lets an eastward current begin to encircle Antarctica,
      thermally isolating the continent. Contested and poorly constrained: estimates for the
      onset range from the Eocene-Oligocene boundary (~34 Ma) through 31-26 Ma to
      23.5 +/- 2.5 Ma for a proto-current. The modern, deep-reaching current came later:
      Evangelinos et al. (2024) place its onset in the late Miocene, so this interval marks
      the gateway opening, not the modern current.
    citation: >
      Evangelinos, D. et al. (2024). "Late Miocene onset of the modern Antarctic Circumpolar
      Current." Nature Geoscience, 17, 165-170. "Drake Passage gateway opening and Antarctic
      Circumpolar Current onset 31 Ma ago: The message of foraminifera and reconsideration of
      the Neodymium isotope record." Chemical Geology (2021) (31-26 Ma estimate).

  - id: grassland-spread
    label: Spread of C3 grasslands
    kind: period
    t_min: 1.55e7
    t_max: 2.3e7
    tags: [life, earth-climate]
    importance: 0.55
    description: >
      The first definitive grass-dominated open habitats appear in the early Miocene, though
      forest and woodland remain globally dominant. Phytolith diversity in open-habitat
      grasses rises through the late early Miocene and early late Miocene, roughly
      19-15.5 Ma, marking the start of the multistage shift from a forested to a
      grassland-dominated world that later culminates in the Late Neogene spread of C4
      grasses.
    citation: >
      Stromberg, C.A.E. (2005). "Decoupled taxonomic radiation and ecological expansion of
      open-habitat grasses in the Cenozoic of North America." PNAS, 102, 11980-11984
      (open-habitat grass dominance in North America by the late Oligocene-early Miocene).
      Stromberg, C.A.E. (2011). "Evolution of Grasses and Grassland Ecosystems." Annual
      Review of Earth and Planetary Sciences, 39, 517-544.

  - id: hipparion-dispersal
    label: Hipparionine horses reach the Old World
    kind: moment
    t_min: 1.11e7
    t_max: 1.14e7
    t: 1.125e7
    tags: [life]
    importance: 0.4
    description: >
      Three-toed hipparionine horses disperse from North America across the Bering land
      bridge into Eurasia and Africa, a rapid, near-synchronous "Hipparion datum" long taken
      as a marker for the westward spread of open savanna — though open C3 grassland habitats
      are now known to predate their arrival in some regions.
    citation: >
      "Old World first appearance datum of 'Hipparion' horses: Late Miocene large-mammal
      dispersal and global events." Geology, 25(1), 19-22 (1997). First appearance at Chron
      C5r, minimum age 11.1 Ma; Hippotherium primigenium at Atzelsdorf, Austria, ~11.2-11.4
      Ma.

  - id: c4-expansion
    label: C4 grasses expand across the tropics
    kind: period
    t_min: 5.0e6
    t_max: 8.0e6
    tags: [life, earth-climate]
    importance: 0.65
    description: >
      Carbon-isotope evidence from fossil soils and tooth enamel across multiple continents
      records the late Miocene replacement of C3-dominated woodland and grassland by
      C4-dominated open savanna, a major shift in the base of terrestrial food webs and the
      habitat in which the human lineage's own later evolution plays out. Timing varied by
      region, and C3 woodland persisted in places such as Greece (Quade, Solounias & Cerling
      1994).
    citation: >
      Cerling, T.E., Harris, J.M., MacFadden, B.J., Leakey, M.G., Quade, J., Eisenmann, V. &
      Ehleringer, J.R. (1997). "Global vegetation change through the Miocene/Pliocene
      boundary." Nature, 389, 153-158. Cerling, T.E., Ehleringer, J.R. & Harris, J.M. (1998).
      Phil. Trans. R. Soc. B, 353, 159-170 (C4 biomass in mammal diets in Asia, Africa, North
      and South America ~8-5 Ma). Uno, K.T. et al. (2011). PNAS, 108, 6509-6514 (East African
      bovids on C4-dominated diets by 7.4 Ma; equids taking significant C4 by ~9.9-9.6 Ma).

  - id: hominins
    label: First hominins
    kind: moment
    t_min: 6.0e6
    t_max: 7.2e6
    t: 7.0e6
    tags: [human-origins]
    importance: 0.8
    description: >
      Sahelanthropus tchadensis, from Chad, is the earliest widely proposed hominin, with
      skeletal evidence interpreted by its describers as consistent with bipedalism.
      Contested: its age predates the molecular estimate for the human-chimpanzee split
      (~6.3-5.4 Ma), and its classification as a hominin rather than a stem great ape is
      actively debated.
    citation: >
      Brunet, M. et al. (2002). "A new hominid from the Upper Miocene of Chad, Central
      Africa." Nature, 418, 145-151. Site dated 7.2-6.8 Ma via biostratigraphy and
      cosmogenic nuclide dating (Lebatard, A.-E. et al. 2008, PNAS, 105(9), 3226-3231).

  - id: isthmus-of-panama
    label: Isthmus of Panama forms
    kind: moment
    t_min: 2.8e6
    t_max: 1.6e7
    t: 2.8e6
    tags: [earth-climate]
    importance: 0.55
    description: >
      A continuous land connection rises between North and South America, closing the
      Central American Seaway and triggering the Great American Biotic Interchange.
      Contested: one synthesis dates final closure to ~2.8 Ma (O'Dea et al. 2016),
      biological evidence argues for earlier, stepwise emergence (Bacon et al. 2015), and
      detrital-zircon evidence suggests the deep seaway had already closed by the middle
      Miocene (Montes et al. 2015).
    citation: >
      O'Dea, A. et al. (2016). "Formation of the Isthmus of Panama." Science Advances, 2(8),
      e1600883 (~2.8 Ma final closure). Bacon, C.D. et al. (2015). "Biological evidence
      supports an early and complex emergence of the Isthmus of Panama." PNAS, 112(19),
      6110-6115 (contested, early-emergence hypothesis). Montes, C. et al.
      (2015). "Middle Miocene closure of the Central American Seaway." Science, 348, 226-229.

  - id: messinian-salinity-crisis
    label: Messinian salinity crisis
    kind: period
    t_min: 5.33e6
    t_max: 5.96e6
    tags: [earth-climate]
    importance: 0.55
    description: >
      Tectonic closure of the Atlantic gateways, the Betic and Rifian corridors through
      southern Spain and northern Morocco, isolates the Mediterranean from the Atlantic;
      extreme evaporation deposits kilometre-scale salt beds across the basin floor. The
      crisis ends at 5.33 Ma when Atlantic water floods back through the Strait of Gibraltar
      in the Zanclean flood. Contested: how dry the basin actually became, and how
      catastrophic the final refill was, remain disputed.
    citation: >
      Krijgsman, W., Hilgen, F.J., Raffi, I., Sierro, F.J. & Wilson, D.S. (1999). "Chronology,
      causes and progression of the Messinian salinity crisis." Nature, 400, 652-655 (onset
      chronology). Garcia-Castellanos, D. et al. (2009). "Catastrophic flood of the
      Mediterranean after the Messinian Salinity Crisis." Nature, 462, 778-781 (Zanclean
      reflooding).

  - id: lomekwi-stone-tools
    label: Oldest known stone tools (Lomekwi 3)
    kind: moment
    t_min: 3.25e6
    t_max: 3.35e6
    t: 3.3e6
    tags: [human-origins, science-technology]
    importance: 0.6
    description: >
      Stone artefacts at Lomekwi 3, West Turkana, Kenya, predate the Oldowan industry by
      roughly 700,000 years and are the oldest known deliberately flaked stone tools — made
      500,000 years before the genus Homo appears in the fossil record, contradicting the
      long-standing assumption that toolmaking began with Homo. Questioned: some
      researchers remain sceptical that the artefacts are securely of Pliocene age.
    citation: >
      Harmand, S. et al. (2015). "3.3-million-year-old stone tools from Lomekwi 3, West
      Turkana, Kenya." Nature, 521, 310-315. Dominguez-Rodrigo, M. & Alcala, L.
      (2019). "Pliocene Archaeology at Lomekwi 3? New Evidence Fuels More Skepticism." Journal
      of African Archaeology, doi:10.1163/21915784-20190006.

  - id: australopithecus-afarensis
    label: "Lucy (AL 288-1), Australopithecus afarensis"
    kind: moment
    t_min: 3.18e6
    t_max: 3.22e6
    t: 3.2e6
    tags: [human-origins]
    importance: 0.65
    description: >
      The AL 288-1 skeleton ("Lucy"), discovered at Hadar, Ethiopia in 1974, is the most
      complete Australopithecus afarensis specimen known: an ape-sized skull paired with a
      pelvis and leg bones built for upright bipedal walking.
    citation: >
      Discovered by Donald Johanson's team, Hadar, Ethiopia, 24 November 1974. Age and
      description per the Natural History Museum, "Australopithecus afarensis, Lucy's
      species," and Britannica, "Lucy | Australopithecus afarensis, 3.2 Million Years,
      Ethiopia." Smithsonian National Museum of Natural History, Human Origins Program,
      "Australopithecus afarensis" (species range ~3.85-2.95 Ma).

  - id: quaternary-glaciation-begins
    label: Quaternary Period begins
    kind: moment
    t_min: 2.58e6
    t_max: 2.58e6
    t: 2.58e6
    tags: [earth-climate]
    importance: 0.6
    description: >
      The base of the Gelasian Stage marks the start of the Quaternary Period and the
      Pleistocene Series, and the onset of major, sustained Northern Hemisphere glaciation —
      the beginning of the ice-age cycles the planet has lived through ever since.
    citation: >
      GSSP for the base of the Gelasian Stage, Monte San Nicola, Italy, per the ICS
      International Chronostratigraphic Chart v2024/12: 2.58 Ma.

  - id: homo-erectus
    label: Homo erectus appears
    kind: moment
    t_min: 1.5e6
    t_max: 2.04e6
    t: 2.0e6
    tags: [human-origins]
    importance: 0.7
    description: >
      Homo erectus, the first hominin with fully modern human body proportions, appears in
      Africa. The oldest confirmed fossil, KNM-ER 2598, is securely dated to older than
      1.855 Ma; the species is conventionally held to have evolved roughly 2 million years
      ago, and its fossils persist across Africa and Asia for well over a million years
      afterward.
    citation: >
      "New hominin remains and revised context from the earliest Homo erectus locality in
      East Turkana, Kenya." Nature Communications (2021), article s41467-021-22208-x
      (KNM-ER 2598, >1.855 Ma). Herries, A.I.R. et al. (2020). "Contemporaneity of
      Australopithecus, Paranthropus, and early Homo erectus in South Africa." Science, 368,
      eaaw7293 (DNH 134, ~2.04-1.95 Ma). Mussi, M. et al. (2023). Science, eadd9115 (Melka
      Kunture mandible ca. 2 Ma).

  - id: acheulean-technology
    label: Acheulean handaxe technology begins
    kind: moment
    t_min: 1.72e6
    t_max: 1.95e6
    t: 1.835e6
    tags: [human-origins, science-technology]
    importance: 0.5
    description: >
      Symmetrical, bifacially flaked handaxes appear by about 1.95 Ma at Melka Kunture,
      Ethiopia, and by 1.76 Ma at Kokiselei, West Turkana, Kenya, a marked advance in
      complexity over the simple Oldowan flakes that preceded them.
    citation: >
      Mussi, M. et al. (2023). "Early Homo erectus lived at high altitudes and produced both
      Oldowan and Acheulean tools." Science, eadd9115. Lepre, C.J. et al. (2011). "An earlier
      origin for the Acheulian." Nature, 477, 82-85. Kokiselei 4 dated to 1.76 Ma (nonlinear
      interpolation) / 1.72 Ma (linear interpolation) via magnetostratigraphy bracketed by
      dated volcanic ash.

  - id: control-of-fire
    label: Habitual control of fire
    kind: period
    t_min: 4.0e5
    t_max: 1.5e6
    tags: [human-origins, science-technology]
    importance: 0.5
    description: >
      Evidence for hominin-controlled fire ranges from isolated early occurrences
      (~1.0-1.5 Ma) to unambiguous, habitual, everyday use only from around 400 ka onward.
      Contested: the gap between sporadic and habitual fire use spans over a million years
      and the transition is not sharply dated.
    citation: >
      Berna, F. et al. (2012). "Microstratigraphic evidence of in situ fire in the
      Acheulean strata of Wonderwerk Cave, Northern Cape province, South Africa." PNAS,
      109(20), E1215-E1220 (~1.0 Ma). Roebroeks, W. & Villa, P. (2011). "On the earliest
      evidence for habitual use of fire in Europe." PNAS, 108(13), 5209-5214 (habitual use
      not clearly established before ~300-400 ka).

  - id: homo-sapiens-origin
    label: Homo sapiens appears
    kind: moment
    t_min: 2.81e5
    t_max: 3.49e5
    t: 3.15e5
    tags: [human-origins]
    importance: 0.9
    description: >
      Fossils from Jebel Irhoud, Morocco, combine a modern-looking face with a more
      archaic braincase shape. They are among the earliest known members of the Homo
      sapiens lineage, pushing the species' origins back roughly 100,000 years earlier
      than previously recognised and supporting a pan-African rather than single-region
      origin.
    citation: >
      Hublin, J.-J. et al. (2017). "New fossils from Jebel Irhoud, Morocco and the
      pan-African origin of Homo sapiens." Nature, 546, 289-292. Richter, D. et al.
      (2017). "The age of the hominin fossils from Jebel Irhoud, Morocco, and the origins
      of the Middle Stone Age." Nature, 546, 293-296. doi:10.1038/nature22335. Combined
      age estimate: 315 +/- 34 ka. Bergström, A., Stringer, C., Hajdinjak, M., Scerri,
      E.M.L. & Skoglund, P. (2021). "Origins of modern human ancestry." Nature, 590,
      229-237. doi:10.1038/s41586-021-03244-5 (pan-African population structure).
    # ADR-032: a degenerate (zero-length) arrival arc marking where the species emerges,
    # schematic per Hublin et al.'s own "pan-African" finding (deliberately not the single
    # Jebel Irhoud site, which sits far north/west of the broader African range the paper
    # itself argues against reading as the origin point).
    effect:
      kind: arrival
      arrival_kind: peopling
      origin: {lat: 2.0, lon: 20.0}
      destination: {lat: 2.0, lon: 20.0}
      established: 3.15e5
      windows:
        - {t_min: 0.0, t_max: 3.49e5}

  - id: levant-early-dispersal
    label: Early dispersal into the Levant
    kind: moment
    t_min: 1.77e5
    t_max: 1.94e5
    t: 1.855e5
    tags: [human-origins]
    importance: 0.45
    description: >
      The Misliya-1 maxilla, from Misliya Cave on Mount Carmel, Israel, is among the
      earliest known Homo sapiens fossils outside Africa, dated by combined U-Th/ESR
      and thermoluminescence methods. An older, contested claim for Apidima 1, Greece
      (>210 ka) is not treated as better-dated here. This early excursion predates the
      main Out-of-Africa migration (out-of-africa-migration) by well over 100,000 years;
      ancient-genome analysis indicates modern-human populations that left Africa before
      about 50 ka, including this one, were genetically distinct from -- and did not
      contribute ancestry to -- the population whose later expansion is ancestral to
      living non-African humans.
    citation: >
      Hershkovitz, I. et al. (2018). "The earliest modern humans outside Africa."
      Science, 359(6374), 456-459. doi:10.1126/science.aap8369. Misliya-1 dated to
      177,000-194,000 years ago (95% CI), combined U-Th/ESR and thermoluminescence
      dating. Harvati, K. et al. (2019). "Apidima Cave fossils provide earliest evidence
      of Homo sapiens in Eurasia." Nature, 571, 500-504. doi:10.1038/s41586-019-1376-z
      (contested >210 ka claim). Sumer, A.P. et al. (2025). "Earliest modern human
      genomes constrain timing of Neanderthal admixture." Nature. doi:10.1038/s41586-024-08420-x
      (early non-African lineages genetically distinct from the later out-of-Africa
      expansion).
    effect:
      kind: arrival
      arrival_kind: peopling
      origin: {lat: 15.0, lon: 33.0}
      destination: {lat: 32.7, lon: 35.0}
      established: 1.855e5
      windows:
        - {t_min: 0.0, t_max: 1.94e5}

  - id: eemian-interglacial
    label: Eemian last interglacial
    kind: period
    t_min: 1.15e5
    t_max: 1.3e5
    tags: [earth-climate]
    importance: 0.45
    description: >
      The most recent interglacial before the present one: global temperatures rival or
      exceed today's, peaking around 128,000-123,000 years ago and briefly averaging up
      to ~2 degC warmer than the Holocene; ice sheets retreat further than modern
      extents (part of the West Antarctic Ice Sheet is thought to have melted), and sea
      level stands roughly 6-9 metres higher, before the planet tips back into the last
      glacial period.
    citation: >
      Shackleton, N.J., Sanchez-Goni, M.F., Pailler, D. & Lancelot, Y. (2003). "Marine
      Isotope Substage 5e and the Eemian Interglacial." Global and Planetary Change,
      36(3), 151-155. van Leeuwen, J.F.N. et al. (2000), U/Th dating a late-Eemian age
      of 118.2 +/- 6.3 ka. Full range and peak-warmth window corroborated live via
      Wikipedia, "Last interglacial" (2026-09-14, the current article title for the
      Eemian), which names Shackleton et al. and van Leeuwen et al. directly for the
      same figures.

  - id: toba-eruption
    label: Toba supereruption
    kind: moment
    t_min: 7.356e4
    t_max: 7.42e4
    t: 7.388e4
    tags: [catastrophe, earth-climate]
    importance: 0.4
    description: >
      The Youngest Toba eruption in Sumatra is the largest known volcanic event of the last
      2.5 million years. Its effect on global climate and on contemporary human populations
      is heavily contested: the original "volcanic winter" hypothesis of a decade-long
      hemispheric cooling has been challenged by more recent regional climate and
      archaeological evidence showing human populations persisted through the eruption
      without a severe bottleneck.
    citation: >
      Storey, M., Roberts, R.G. & Saidin, M. (2012). "Astronomically calibrated 40Ar/39Ar age
      for the Toba supereruption and global synchronization of late Quaternary records."
      PNAS, 109, 18684-18688 (73.88 +/- 0.32 ka, 1 sigma). Contested effects per "Understanding the overestimated impact of the
      Toba volcanic super-eruption on global environments and ancient hominins,"
      Earth-Science Reviews (2020).

  - id: out-of-africa-migration
    label: Out-of-Africa migration
    kind: moment
    t_min: 5.0e4
    t_max: 7.0e4
    t: 6.0e4
    tags: [human-origins]
    importance: 0.6
    description: >
      Genomic evidence dates the principal migration of modern humans out of Africa,
      ancestral to all non-African populations living today, to this window. The exact
      route (a northern crossing via Egypt and the Sinai, or a southern one via the Bab
      el-Mandeb strait) is unresolved and not asserted here. Earlier, smaller dispersals
      (e.g. into the Levant by ~180 ka, levant-early-dispersal) left populations
      genetically distinct from this later, successful expansion.
    citation: >
      Bergstrom, A., Stringer, C., Hajdinjak, M., Scerri, E.M.L. & Skoglund, P. (2021).
      "Origins of modern human ancestry." Nature, 590, 229-237.
      doi:10.1038/s41586-021-03244-5 ("worldwide expansion of modern humans between 40
      and 60 thousand years ago"). Iasi, L.N.M. et al. (2024). "Neanderthal ancestry
      through time: Insights from genomes of ancient and present-day humans." Science,
      386(6727). doi:10.1126/science.adq3010 (the shared Neanderthal-admixture pulse
      dating this population's spread to ~50,500-43,500 years ago).
    effect:
      kind: arrival
      arrival_kind: peopling
      origin: {lat: 15.0, lon: 33.0}
      destination: {lat: 28.0, lon: 42.0}
      established: 6.0e4
      windows:
        - {t_min: 0.0, t_max: 7.0e4}

  - id: south-southeast-asia-arrival
    label: Arrival in South and Southeast Asia
    kind: moment
    t_min: 5.0e4
    t_max: 6.0e4
    t: 5.5e4
    tags: [human-origins]
    importance: 0.5
    description: >
      Modern humans following the main Out-of-Africa dispersal (out-of-africa-migration)
      reach South and mainland Southeast Asia along a coastally oriented route roughly
      60-50 thousand years ago, per genetic and archaeological synthesis. An older,
      contested claim (Tam Pa Ling, Laos, 70 +/- 3 ka) would push a Southeast Asian
      presence earlier still; it is not treated as the primary arrival date here.
    citation: >
      Mellars, P., Gori, K.C., Carr, M., Soares, P.A. & Richards, M.B. (2013). "Genetic
      and archaeological perspectives on the initial modern human colonization of
      southern Asia." PNAS, 110(26), 10699-10704. doi:10.1073/pnas.1306043110.
      Coastally oriented dispersal dated to approximately 60-50 ka. Freidline, S.E. et
      al. (2023). "Early presence of Homo sapiens in Southeast Asia by 86-68 kyr at Tam
      Pa Ling, Northern Laos." Nature Communications, 14, 3193.
      doi:10.1038/s41467-023-38715-y (contested older claim, TPL 6 dated to 70 +/- 3 ka).
    effect:
      kind: arrival
      arrival_kind: peopling
      origin: {lat: 28.0, lon: 42.0}
      destination: {lat: 15.0, lon: 100.0}
      established: 5.5e4
      windows:
        - {t_min: 0.0, t_max: 6.0e4}

  - id: sahul-arrival
    label: Arrival in Sahul (Australia and New Guinea)
    kind: moment
    t_min: 4.7e4
    t_max: 7.1e4
    t: 5.0e4
    tags: [human-origins]
    importance: 0.55
    description: >
      Optically stimulated luminescence dating at Madjedbebe, in Australia's Northern
      Territory, leads Clarkson et al. (2017) to state that "human occupation began
      around 65,000 years ago" -- a long chronology also supported by a 2025
      mitogenomic study proposing settlement "by ~60 ka via at least two distinct
      routes." A shorter chronology of ~47,000-51,000 years is argued instead by
      O'Connell et al. (2018), who question Madjedbebe's stratigraphic integrity, and
      by Williams et al. (2020), who propose termite bioturbation could explain
      anomalously old dates at the site; genetic evidence that Sahul's earliest
      populations share a single pulse of Neanderthal admixture datable to roughly
      45,000-50,500 years ago is also read as favouring the shorter chronology. Both
      readings remain live in the literature -- the arc here is shown dashed across the
      full contested range and solid from the shorter chronology's estimate.
    citation: >
      Clarkson, C. et al. (2017). "Human occupation of northern Australia by 65,000
      years ago." Nature, 547, 306-310. doi:10.1038/nature22968. O'Connell, J.F. et al.
      (2018). "When did Homo sapiens first reach Southeast Asia and Sahul?" PNAS,
      115(34), 8482-8490. doi:10.1073/pnas.1808385115. Williams, M.A.J., Spooner, N.A.,
      McDonnell, K. & O'Connell, J.F. (2020, published online; 2021 in print).
      "Identifying disturbance in archaeological sites in tropical northern Australia."
      Geoarchaeology. doi:10.1002/gea.21822. Sumer, A.P. et al. (2025). Nature.
      doi:10.1038/s41586-024-08420-x (shared Neanderthal-admixture pulse ~45-49 ka).
      Gandini, F. et al. (2025). "Genomic evidence supports the 'long chronology' for
      the peopling of Sahul." Science Advances. doi:10.1126/sciadv.ady9493 (summarises
      the long, ~60-65 ka, vs. short, 47-51 ka, debate).
    effect:
      kind: arrival
