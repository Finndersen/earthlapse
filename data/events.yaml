    importance: 0.55
    description: >
      Allied and German forces fight a four-and-a-half-month battle along the Somme
      river in northern France, one of the largest and costliest battles of the
      First World War. More than three million men take part; over a million are
      killed, wounded or reported missing on both sides, for a front line that moves
      only a few kilometres.
    citation: >
      Wikipedia, "Battle of the Somme" (accessed 2026-09-15): 1 July - 18 November
      1916; over 3 million combatants; British casualties ~420,000, French ~200,000,
      German 237,159-429,209.

  # Review fix (2026-09-15): the subway clause read as if the line ran beneath Ginza's own
  # streets across 1927-1934; in fact the 1927 opening was the Ueno-Asakusa section, and the line
  # reached Ginza itself only in 1934 (Wikipedia "Ginza Line", already cited below) -- reworded to
  # state both dates and places explicitly.
  - id: ginza-modern-urban-culture
    label: Ginza's mass urban culture
    kind: period
    t_min: 91
    t_max: 101
    tags: [society, science-technology]
    importance: 0.5
    description: >
      Tokyo's Ginza district becomes interwar Japan's showcase of a new, first-of-its-
      kind mass urban lifestyle: a Ginza department store lets customers keep their
      shoes on indoors from 1924, Japan's first radio broadcasts begin the following
      year, and Tokyo's first subway line — Asia's oldest, opened in 1927 — reaches
      Ginza itself only in 1934, as crowds throng the district for "Ginbura," the
      fashionable pastime of strolling Ginza simply to see and be seen.
    citation: >
      Wikipedia, "Department store" (accessed 2026-09-15): "In 1924, Matsuzakaya
      store in Ginza allowed street shoes to be worn indoors." Wikipedia, "NHK"
      (accessed 2026-09-15): Tokyo Broadcasting Station begins radio broadcasts in
      1925. Wikipedia, "Ginza Line" (accessed 2026-09-15): Ueno-Asakusa section opens
      30 December 1927, Asia's oldest subway line; reaches Shimbashi 21 June 1934.
      Wikipedia, "Ginza" (accessed 2026-09-15): the "Ginbura" strolling custom
      "developing strongly between the two world wars."

  - id: penicillin-discovery
    label: Penicillin discovered
    kind: moment
    t_min: 96
    t_max: 97
    t: 97
    tags: [science-technology, life]
    importance: 0.6
    description: >
      Alexander Fleming notices that a mould contaminating a bacterial culture plate at
      St Mary's Hospital, London, has killed the surrounding bacteria — the observation
      that opens the antibiotic era, though mass production waits until the 1940s.
    citation: >
      Fleming, A. (1929). "On the antibacterial action of cultures of a penicillium,
      with special reference to their use in the isolation of B. influenzae." British
      Journal of Experimental Pathology, 10(3), 226-236 (received 10 May 1929,
      describing the culture-plate observation dated 3 September 1928).

  # Added in review (2026-09-15): see world-war-i's comment -- the Second World War was likewise
  # missing as its own event, with only its D-Day and Trinity moments individually dated.
  - id: world-war-ii
    label: The Second World War
    kind: period
    t_min: 79.33
    t_max: 85.33
    tags: [catastrophe, society]
    importance: 0.7
    description: >
      Beginning with Germany's invasion of Poland, the Second World War becomes the
      deadliest conflict in human history, fought across Europe, the Pacific, North
      Africa and beyond and marked by genocide, including the Holocaust, and the
      first use of nuclear weapons. It ends with Japan's surrender on 2 September
      1945. Estimates of the total dead, the majority civilians, range from 60 to 75
      million.
    citation: >
      Wikipedia, "World War II" (accessed 2026-09-15): began 1 September 1939; ended
      2 September 1945; estimated 60-75 million deaths, military and civilian, a
      majority of them civilian.

  # Review fix (2026-09-15): the description originally credited "156,000 troops ashore on the
  # first day alone" to the beach landings alone. That figure is the whole day's combined total
  # across sea and air; Wikipedia "Normandy landings" gives 24,000 of the 156,000 as airborne
  # troops dropped by parachute and glider overnight, so only about 132,000 actually came ashore
  # by landing craft. Both figures are now stated separately.
  - id: d-day-normandy-landings
    label: D-Day, the Normandy landings
    kind: moment
    t_min: 81
    t_max: 81
    t: 81
    tags: [catastrophe, society]
    importance: 0.6
    description: >
      Allied forces land on five beaches along the Normandy coast in the largest
      seaborne invasion in history, opening the Western Front against Nazi Germany.
      About 132,000 troops come ashore by landing craft on the first day, alongside
      a further 24,000 airborne troops dropped by parachute and glider overnight —
      some 156,000 in total; the campaign that follows leads to the liberation of
      Western Europe within a year.
    citation: >
      Wikipedia, "Normandy landings" (accessed 2026-09-15): 6 June 1944; Utah,
      Omaha, Gold, Juno and Sword beaches; approximately 156,000 troops landed on
      D-Day in total, including 24,000 airborne troops.

  - id: trinity-test
    label: First nuclear weapon detonated
    kind: moment
    t_min: 80
    t_max: 80
    t: 80
    tags: [science-technology, society]
    importance: 0.6
    description: >
      The US Army detonates the first nuclear weapon, a plutonium implosion device, at
      the Trinity site in the New Mexico desert, three weeks before the atomic bombings
      of Hiroshima and Nagasaki — opening the nuclear age.
    citation: >
      US Department of Energy / Manhattan Project records. Trinity test, 16 July 1945,
      05:29:21 Mountain War Time, Jornada del Muerto desert, New Mexico; yield ~24.8 kt.
      Uncontested — among the most precisely documented events of the 20th century.

  - id: postwar-suburban-boom
    label: Postwar highway and suburban boom
    kind: period
    t_min: 65
    t_max: 80
    tags: [society, science-technology]
    importance: 0.55
    description: >
      In the fifteen years after the Second World War, the United States builds a new
      mass-produced suburbia and the highways to connect it. Levittown, New York, the
      first mass-produced suburb, raises 17,447 houses in under four years; the
      Federal-Aid Highway Act of 1956 then authorises 40,000 miles of new divided
      interstate highway, the largest public-works programme in the country's history.
      Car and home ownership become mass-market goods within a single generation.
    citation: >
      Wikipedia, "Levittown, New York" and "Interstate Highway System" (both accessed
      2026-09-15). Levittown built 1947-1951, 17,447 houses, peak rate 30 houses/day.
      Federal-Aid Highway Act of 1956 signed June 1956, authorising 40,000 miles of
      divided highway.

  # Added 2026-09-18, tag-balance pass (see amazon-deforestation's comment above). The app's own
  # CO2 layer (sources/co2-o2) switches from an ice-core reconstruction to this exact instrumental
  # record at t = 66 (AD 1959) -- `sources/co2-o2/README.md`: "Instrumental | co2_annmean_mlo.txt
  # (NOAA GML) | Mauna Loa annual means, AD 1959-2025", credited there to "Lan/Keeling (GML/SIO)".
  # So this event dates the moment the curated data this project already renders begins, not a
  # separate claim about it. No single day is documented for the first reading, so this is dated
  # to the month/year only, per the file's convention for imprecisely-dated moments (e.g.
  # personal-computers).
  - id: keeling-curve-begins
    label: Keeling begins measuring atmospheric CO2
    kind: moment
    t_min: 67
    t_max: 67
    t: 67
    tags: [science-technology, earth-climate]
    importance: 0.45
    description: >
      Charles David Keeling, at the Scripps Institution of Oceanography, begins
      continuous measurement of atmospheric CO2 at Mauna Loa Observatory, recording
      313 parts per million. The resulting Keeling Curve becomes the foundational
      record of humanity's own atmospheric measurement of itself, still running today.
    citation: >
      Wikipedia, "Keeling Curve" (accessed 2026-09-18): measurements begin March 1958,
      Mauna Loa Observatory, Scripps Institution of Oceanography; initial reading 313
      ppm; prior Kew Observatory measurements (1898-1901) averaged 274 ppm.

  - id: green-revolution
    label: Green Revolution
    kind: period
    t_min: 55
    t_max: 65
    tags: [science-technology, society]
    importance: 0.65
    description: >
      Norman Borlaug's short-stemmed, disease-resistant Mexican wheat lines, and the
      high-yield rice varieties (such as IR8, released 1966) bred alongside them,
      spread through South Asia and are credited with saving perhaps a billion people
      from famine. India's wheat harvest rises from about 10 million tonnes a year in
      the 1960s to 73 million by 2006.
    citation: >
      Wikipedia, "Green Revolution" (accessed 2026-09-15). Borlaug hired 1940 to lead
      Mexico's agricultural research; Nobel Peace Prize 1970; India wheat production
      10 Mt (1960s) to 73 Mt (2006); IR8 rice released 1966, yielding up to ~10 t/ha
      under optimal conditions by 1968. Review fix (2026-09-15): dropped this page's
      separate claim of India rice yields rising ~2 to ~6 t/ha (1960s to mid-1990s) --
      Wikipedia "Rice production in India"'s own yield table gives India's actual
      national average as ~1.0 t/ha (1960s) to ~1.9 t/ha (1996-97/1997-98), roughly a
      third of that figure, so it is not used as a national-average claim.

  - id: containerization
    label: Container shipping remakes world trade
    kind: period
    t_min: 45
    t_max: 69
    tags: [science-technology, society]
    importance: 0.55
    description: >
      Malcom McLean's SS Ideal X sails the first successful container voyage, from
      Newark to Houston. Standardised steel shipping containers and dedicated
      gantry-crane terminals spread through the world's ports over the following
      decades; by 2004 they carry 354 million TEU (twenty-foot container units) of
      traffic a year, and within a few more years roughly nine-tenths of the world's
      non-bulk seaborne trade moves in a box.
    citation: >
      Wikipedia, "Containerization" (accessed 2026-09-15). SS Ideal X voyage 26 April
      1956; ISO container standardisation 1968-1970; global container traffic 354
      million TEU in 2004, ~82% handled by the top 100 ports; roughly 90% of non-bulk
      cargo moved by containers by 2009.

  - id: shenzhen-sez-designated
    label: Shenzhen designated first Special Economic Zone
    kind: moment
    t_min: 45
    t_max: 45
    t: 45
    tags: [society]
    importance: 0.5
    description: >
      China designates Shenzhen, then a market town of fishing villages and paddy
      fields with about 30,000 people, as its first Special Economic Zone, opening it
      to foreign investment and market reforms. Within forty-five years it grows into
      a city of some 18.2 million and a global centre of electronics manufacturing.
    citation: >
      Wikipedia, "Shenzhen" (accessed 2026-09-15). Designated China's first Special
      Economic Zone in May 1980; population about 30,000 in 1980; population 18.2
      million in 2025.

  # Removes aral-sea-shrinkage (2026-09-18: the user found "The Shrinking Aral Sea" too obscure
  # and asked for "amazon deforestation and chernobyl" instead; see scenes.yaml
  # chernobyl-exclusion-zone/amazon-deforestation-fishbone). This event backs
  # chernobyl-exclusion-zone.
  - id: chernobyl-disaster
    label: Chernobyl disaster
    kind: moment
    t_min: 39
    t_max: 39
    t: 39
    tags: [catastrophe, science-technology]
    importance: 0.6
    description: >
      Reactor 4 at the Chernobyl Nuclear Power Plant in the Ukrainian SSR explodes and
      catches fire, releasing radioactive material across the surrounding region and
      much of Europe. The nearby city of Pripyat, home to 49,360 people, is evacuated
      the next day and never resettled; a 30-kilometre exclusion zone is declared ten
      days later and remains in force.
    citation: >
      Wikipedia, "Chernobyl disaster" (accessed 2026-09-18): explosion and fire at
      01:23 on 26 April 1986, Reactor 4; exclusion zone expanded from 10 km to 30 km
      within ten days. Wikipedia, "Pripyat" (accessed 2026-09-18): population 49,360;
      evacuated 27 April 1986, one day after the disaster; never resettled.

  # Added 2026-09-18, part of a tag-balance pass (coordinator audit: 25 of 32 events since 1925
  # tagged science-technology, only 2 earth-climate). "The only optimistic entry available in this
  # stretch -- a planetary-scale problem detected and then actually fixed" (brief). One event
  # spanning both halves, not two: the discovery and the treaty are inseparable in the story this
  # timeline tells (a problem found, then closed), and neither half alone would carry the
  # "detected and fixed" arc the brief asks for. t_min/t_max span discovery to signing, the
  # detect-to-fix interval itself, rather than reaching for the (still-running) recovery: full
  # recovery is not yet observed, only forecast.
  - id: ozone-hole-montreal-protocol
    label: Ozone hole found, then closed by treaty
    kind: period
    t_min: 38
    t_max: 40
    tags: [earth-climate, science-technology]
    importance: 0.55
    description: >
      Farman, Gardiner and Shanklin report a dramatic springtime thinning of the ozone
      layer over Antarctica — later found to reach 70% — the first clear evidence of a
      man-made hole in the atmosphere. Within two years 46 nations sign the Montreal
      Protocol, phasing out the CFCs responsible; ozone levels stabilise by the
      mid-1990s and later assessments project the Antarctic hole recovering to 1980
      levels by around 2066.
    citation: >
      Wikipedia, "Ozone depletion" (accessed 2026-09-18): Antarctic ozone hole first
      reported 1985 (Farman et al.), reductions up to 70%; ozone levels stabilised by
      the mid-1990s; recovery to 1980 levels projected by around 2066 (Antarctica),
      2045 (Arctic), 2040 (rest of world). Wikipedia, "Montreal Protocol" (accessed
      2026-09-18): agreed 16 September 1987 in Montreal, 46 original signatories,
      entered into force 1 January 1989.

  # This event backs scenes.yaml amazon-deforestation-fishbone; see that scene's own comment for
  # the 1995 year choice.
  - id: amazon-deforestation
    label: Amazon deforestation accelerates
    kind: period
    t_min: 21
    t_max: 37
    tags: [earth-climate, catastrophe]
    importance: 0.55
    description: >
      Brazil's national space agency INPE begins systematic satellite monitoring of
      Amazon deforestation, recording 21,050 km² of forest cleared in 1988 alone.
      Clearing peaks at 29,059 km² in 1995 — by far the highest annual total in the
      record to that point, as new roads cut "fishbone" patterns of side-clearings into
      primary forest, most of it converted to cattle pasture — before a second peak of
      27,772 km² in 2004.
    citation: >
      Wikipedia, "Deforestation of the Amazon rainforest" (accessed 2026-09-18). INPE
      PRODES annual clearing figures: 21,050 km² (1988), 29,059 km² (1995), 18,161 km²
      (1996), 27,772 km² (2004); by 1995, 70% of previously forested land in the Amazon
      (91% of land deforested since 1970) had been converted to cattle ranching.

  - id: renewable-energy-scaleup
    label: Solar and wind power scale up rapidly
    kind: period
    t_min: 10
    t_max: 15
    tags: [science-technology, earth-climate]
    importance: 0.5
    description: >
      Global installed solar photovoltaic capacity grows more than fivefold in five
      years, from 41.6 gigawatts in 2010 to 229.1 gigawatts in 2015, while offshore
      wind turbines begin to spread along temperate coastlines too — the leading edge
      of a still-early transition away from fossil-fuelled electricity.
    citation: >
      Wikipedia, "Growth of photovoltaics" (accessed 2026-09-15). Global cumulative
      installed solar PV capacity 41.6 GW (2010, 76% YoY growth) to 229.1 GW (2015,
      27% YoY growth). Review fix (2026-09-15): no global offshore-wind capacity
      figure for both 2010 and 2015 could be verified live (Wikipedia "Offshore wind
      power" gives only a 2015 European total, 11,027 MW, not a global one for either
      year), so the offshore-wind clause is kept qualitative rather than quantitative.

  - id: transistor-invented
    label: Transistor invented
    kind: moment
    t_min: 77
    t_max: 78
    t: 78
    tags: [science-technology]
    importance: 0.6
    description: >
      John Bardeen and Walter Brattain at Bell Labs get a point-contact germanium device
      to amplify a signal, between 17 November and 23 December 1947 — the first working
      transistor, which comes to replace the vacuum tube and underlies nearly all modern
      solid-state electronics and computing. Bell Labs made no public announcement
      before June 1948, but this session could not confirm an exact announcement date.
    citation: >
      Bardeen, J. & Brattain, W.H. (1948). "The transistor, a semi-conductor triode."
      Physical Review, 74(2), 230-231. Point-contact device demonstrated 17 November-23
      December 1947 at Bell Labs, Murray Hill, New Jersey. UNVERIFIED: the commonly
      cited 30 June 1948 public-announcement date could not be confirmed live against
      Wikipedia "Transistor" or "History of the transistor" — both state only "not
      before June 1948," with no specific day. Dropped from the description per
      instruction rather than asserted; flag for a direct check against Bell Labs' own
      press-conference record or the Physical Review submission/publication dates before
      relying on the day-level figure.

  - id: dna-double-helix
    label: DNA double helix described
    kind: moment
    t_min: 72
    t_max: 72
    t: 72
    tags: [science-technology, life]
    importance: 0.6
    description: >
      James Watson and Francis Crick publish the double-helix structure of DNA in
      Nature, built on Rosalind Franklin's and Maurice Wilkins's X-ray diffraction data
      — the structural discovery underlying all of modern molecular biology and
      genetics.
    citation: >
      Watson, J.D. & Crick, F.H.C. (1953). "Molecular structure of nucleic acids: a
      structure for deoxyribose nucleic acid." Nature, 171(4356), 737-738. Published 25
      April 1953.

  - id: sputnik-1-launch
    label: First artificial satellite
    kind: moment
    t_min: 68
    t_max: 68
    t: 68
    tags: [science-technology]
    importance: 0.45
    description: >
      The Soviet Union launches Sputnik 1 from Baikonur, the first artificial satellite
      to orbit Earth, opening the Space Age.
    citation: >
      Launch record, Sputnik 1, 4 October 1957, 19:28:34 UTC, Site No. 1, Baikonur
      Cosmodrome; initial orbit 223 x 950 km. Uncontested.

  # Digital-age batch (2026-09-14): integrated-circuit-invented and the ten events added with
  # it (listed in sources/events-core/README.md) were each checked live against the page named
  # in their citation, never asserted from model memory. Where a day-level date could not be
  # confirmed, the event is dated to the year only and the citation says so.
  - id: integrated-circuit-invented
    label: Integrated circuit invented
    kind: moment
    t_min: 67
    t_max: 67
    t: 67
    tags: [science-technology]
    importance: 0.55
    description: >
      Jack Kilby demonstrates the first working integrated circuit, putting several
      electronic components on a single piece of semiconductor; about six months later
      Robert Noyce at Fairchild Semiconductor develops the first practical monolithic
      chip. Every later computer, phone and network builds on the microchip.
    citation: >
      Wikipedia, "Integrated circuit" (accessed 2026-09-14). Kilby's first working
      example demonstrated 12 September 1958; Noyce's monolithic IC about six months
      later (1959). Kilby shared the 2000 Nobel Prize in Physics for the invention
      (the nobelprize.org facts page refused a live fetch; confirmed via Wikipedia only).

  - id: gagarin-first-spaceflight
    label: First human spaceflight
    kind: moment
    t_min: 64
    t_max: 64
    t: 64
    tags: [science-technology]
    importance: 0.45
    description: >
      Yuri Gagarin completes a single orbit of Earth aboard Vostok 1, becoming the first
      human in space, and returns safely to Earth the same day.
    citation: >
      Launch record, Vostok 1, 12 April 1961, 06:07 UTC, Baikonur Cosmodrome; single
      orbit, landing 07:55 UTC the same day. Uncontested.

  - id: moon-landing
    label: Moon landing
    kind: moment
    t_min: 56
    t_max: 56
    t: 56
    tags: [science-technology]
    importance: 0.7  # raised from 0.35 (ADR-022 migration): comparable to the newly added
    # wright-flyer-first-flight (0.65) rather than well below it, per USER DECISIONS
    description: >
      Apollo 11 lands the first humans on the Moon. Chosen as a precise, uncontested
      near-present anchor point for the timeline — the rare event in this set with
      effectively zero date uncertainty.
    citation: >
      NASA (1969). Apollo 11 Mission Report. Neil Armstrong and Buzz Aldrin land at Mare
      Tranquillitatis on 20 July 1969 UTC.

  - id: arpanet-first-message
    label: First message over ARPANET
    kind: moment
    t_min: 56
    t_max: 56
    t: 56
    tags: [science-technology]
    importance: 0.5
    description: >
      UCLA student programmer Charley Kline sends the first message over ARPANET to SRI
      programmer Bill Duvall at the Stanford Research Institute. The receiving computer
      crashes after two characters, so the first transmission is just "lo", from
      "login". ARPANET is the network the Internet grew out of.
    citation: >
      Wikipedia, "ARPANET" (accessed 2026-09-14), citing the first ARPANET IMP log: 29
      October 1969, 10:30 pm PST (06:30 UTC, 30 October 1969), UCLA's SDS Sigma 7 host to
      SRI's SDS 940 host.

  - id: first-microprocessor
    label: Intel 4004, first commercial microprocessor
    kind: moment
    t_min: 54
    t_max: 54
    t: 54
    tags: [science-technology]
    importance: 0.5
    description: >
      Intel releases the 4004, the first microprocessor sold as a stand-alone component: a
      computer's whole central processor on one chip rather than spread across several.
      Its designers were Federico Faggin, Marcian Hoff, Stanley Mazor and Masatoshi Shima.
      The title of "first microprocessor" is contested, because earlier single-chip
      processors existed (Texas Instruments' TMS0100, Four-Phase's AL1 and the
      then-classified MP944).
    citation: >
      Wikipedia, "Intel 4004" (accessed 2026-09-14). Released 15 November 1971, announced
      in Intel's "Announcing a new era of integrated electronics" advertisement in that
      day's Electronic News; "the first commercially available (sold as a component)
      microprocessor". The same page gives the competing claims: TI's TMS0100 (launched
      17 September 1971), Four-Phase's AL1 (in a commercial product earlier) and the MP944
      (finished 1970, classified until 1998).

  - id: first-handheld-mobile-call
    label: First public handheld mobile phone call
    kind: moment
    t_min: 52
    t_max: 52
    t: 52
    tags: [science-technology]
    importance: 0.45
    description: >
      Martin Cooper of Motorola, standing on a Manhattan sidewalk, places the first public
      call from a handheld cellular phone to Joel Engel at rival AT&T. The prototype
      is a 1.1 kg "brick"; a consumer version of the handset goes on sale a decade later,
      in 1983.
    citation: >
      Wikipedia, "Martin Cooper (inventor)" (accessed 2026-09-14). Call placed 3 April
      1973 on a DynaTAC prototype weighing 2.5 lb (1.1 kg); handset commercially available
      by 1983 after four iterations.

  - id: mass-market-personal-computers
    label: Personal computers go mass-market
    kind: moment
    t_min: 48
    t_max: 48
    t: 48
    tags: [science-technology, society]
    importance: 0.55
    description: >
      The Apple II, Commodore PET 2001 and Tandy TRS-80 all reach the market in 1977 as
      complete, ready-to-use machines rather than hobbyist kits. They are the first widely
      successful mass-market personal computers, later called the "1977 Trinity" by Byte
      magazine. IBM's PC of 1981 then sets the "IBM PC compatible" standard that most later
      personal computers follow.
    citation: >
      Wikipedia, "History of personal computers" (accessed 2026-09-14): the 1977 Trinity,
      Byte's naming, and dominance by late 1978. Wikipedia, "IBM Personal Computer"
      (accessed 2026-09-14): released 12 August 1981, the basis of the IBM PC compatible de
      facto standard. The three 1977 release months were not confirmed live, so the event
      is dated to the year only. Dated to 1977 rather than 1981 because that is when
      personal computers first became a mass-market product.

  - id: internet-tcp-ip-switchover
    label: ARPANET switches to TCP/IP
    kind: moment
    t_min: 42
    t_max: 42
    t: 42
    tags: [science-technology, society]
    importance: 0.6
    description: >
      On "flag day", ARPANET retires its original Network Control Protocol and makes the
      TCP/IP protocols its standard. TCP/IP is the protocol suite for connecting separate
      networks together, and the Internet still runs on it today.
    citation: >
      Wikipedia, "ARPANET" (accessed 2026-09-14). "On 1 January 1983, known as flag day,
      TCP/IP protocols became the standard for the ARPANET, replacing the earlier Network
      Control Protocol."

  - id: berlin-wall-falls
    label: Fall of the Berlin Wall
    kind: moment
    t_min: 36
    t_max: 36
    t: 36
    tags: [society]
    importance: 0.6
    description: >
      Overwhelmed East German border guards at Berlin's checkpoints open the gates
      to crowds demanding passage, and the Wall that has divided the city since 1961
      becomes passable overnight. Within days, Berliners are chipping souvenir
      fragments from it in daylight; the Wall's fall becomes the defining image of
      the Cold War's end and is followed within a year by German reunification.
    citation: >
      Wikipedia, "Fall of the Berlin Wall" (accessed 2026-09-15): checkpoints
      opened the night of 9 November 1989 after crowds gathered demanding passage;
      guards overwhelmed, held with little or no identity-checking.

  - id: www-invented
    label: World Wide Web invented
    kind: period
    t_min: 34
    t_max: 36
    tags: [science-technology, society]
    importance: 0.55
    description: >
      Tim Berners-Lee proposes a hypertext system for information management at CERN,
      then builds the first web browser, server and page, releasing it to the wider
      Internet in 1991 — the technology underlying the information age's global reach.
    citation: >
      Berners-Lee, T. (1989). "Information Management: A Proposal." CERN, 12 March 1989.
      First web page live 6 August 1991; released publicly 23 August 1991.

  - id: ibm-simon-first-smartphone
    label: First smartphone (IBM Simon)
    kind: moment
    t_min: 31
    t_max: 31
    t: 31
    tags: [science-technology]
    importance: 0.4
    description: >
      The IBM Simon Personal Communicator goes on sale. It combines a mobile phone with
      handheld-organiser (PDA) features and a touchscreen, and is now looked back on as the
      first true smartphone, though General Magic's Magic Cap devices, released later in
      1994, are also counted among the first commercial smartphones. Only about 50,000
      Simons were sold in its six months on the market.
    citation: >
      Wikipedia, "IBM Simon" (accessed 2026-09-14). On sale through BellSouth Cellular
      from 16 August 1994; prototype shown at COMDEX, 16 November 1992; about 50,000 units
      sold; "retrospectively referred to as the first true smartphone." Wikipedia,
      "Smartphone" (accessed 2026-09-14): "The first commercial smartphones are widely
      recognized to be the IBM Simon Personal Communicator ... and General Magic's Magic
      Cap devices released by Sony ('magic link') and Motorola ('envoy') in 1994."

  - id: gps-fully-operational
    label: GPS fully operational
    kind: moment
    t_min: 30
    t_max: 30
    t: 30
    tags: [science-technology]
    importance: 0.4
    description: >
      The US Air Force declares the Global Positioning System fully operational. Its
      24-satellite constellation had been complete since December 1993, and a 1983
      presidential directive had already promised it for free civilian use. Accurate
      positioning for everyone follows on 2 May 2000, when the deliberate degrading of the
      civilian signal ("Selective Availability") is switched off.
    citation: >
      Wikipedia, "Global Positioning System" (accessed 2026-09-14). Initial operational
      capability December 1993; Full Operational Capability declared by Air Force Space
      Command April 1995; Selective Availability discontinued 2 May 2000. UNVERIFIED: the
      often-quoted 17 July 1995 date for Full Operational Capability could not be checked
      live (the gps.gov page returned 404), so the event is dated to the year only (t = 30
      for either date).

  - id: human-genome-project-completed
    label: Human Genome Project completed
    kind: period
    t_min: 22
    t_max: 35
    tags: [science-technology, life]
    importance: 0.45
    description: >
      An international public consortium sequences the roughly 3 billion base pairs of
      the human genome, from initial NIH funding through a working draft to a finished
      sequence completed two years ahead of schedule — a foundational resource for
      modern genomics and medicine.
    citation: >
      National Human Genome Research Institute, project timeline. Funding begins 1
      October 1990; working draft announced 26 June 2000; completion announced 14 April
      2003.

  - id: iphone-launch
    label: iPhone brings smartphones to the mass market
    kind: moment
    t_min: 18
    t_max: 18
    t: 18
    tags: [science-technology, society]
    importance: 0.55
    description: >
      Apple announces the iPhone in January and releases it in the US in June. It is the
      first phone with a multi-touch screen, and it does away with almost all physical
      buttons. Not the first smartphone (see the IBM Simon, 1994), but the design that made
      the touchscreen smartphone the industry standard.
    citation: >
      Wikipedia, "iPhone (1st generation)" (accessed 2026-09-14). Announced 9 January 2007
      at Macworld, San Francisco; US release 29 June 2007; one millionth unit sold 74 days
      after release; 6,124,000 units sold before discontinuation on 11 July 2008.

  - id: urban-majority-milestone
    label: Half of humanity lives in cities
    kind: moment
    t_min: 18
    t_max: 18
    t: 18
    tags: [society]
    importance: 0.5
    description: >
      For the first time in recorded history, more than half of the world's
      population lives in cities, in 2007 — up from just 15% in 1900. The share
      keeps rising, reshaping daily life around the metro systems, office towers and
      mass transit that a century before did not exist.
    citation: >
      Wikipedia, "Urbanization" (accessed 2026-09-15), citing United Nations
      population data: "just 15% of the world's population lived in cities" in 1900;
      "in 2007, more than 50% of the world population was living in cities, for the
      first time in human history."

  - id: half-of-humanity-online
    label: Half of humanity online
    kind: moment
    t_min: 7
    t_max: 7
    t: 7
    tags: [society, science-technology]
    importance: 0.5
    description: >
      The International Telecommunication Union estimates that by the end of 2018, 51.2%
      of the world's population (3.9 billion people) is using the Internet. It is the
      first time more than half of humanity is online. This is a statistical estimate
      crossing a threshold, not a single observed moment. By 2025 an estimated 6 billion
      people, about 74%, are online.
    citation: >
      International Telecommunication Union (2018). Press release, Geneva, 7 December 2018:
      "at the end of 2018, 51.2 per cent of the global population, or 3.9 billion people,
      will be using the Internet." 2025 figure: Wikipedia, "Global Internet usage"
      (accessed 2026-09-14).

  # Added 2026-09-18, tag-balance pass (see amazon-deforestation's comment above). This event
  # backs scenes.yaml covid-19-venice-lockdown; see that scene's own comment for the place and
  # date chosen. t_min/t_max run PHEIC declaration to PHEIC end -- the WHO's own two dated
  # emergency-status bookends -- not the epidemiologically fuzzier "pandemic is over" question,
  # which WHO itself never declared on a single date.
  - id: covid-19-pandemic
    label: COVID-19 pandemic
    kind: period
    t_min: 2
    t_max: 5
    tags: [catastrophe, society]
    importance: 0.65
    description: >
      The WHO declares SARS-CoV-2 a public health emergency of international concern
      on 30 January 2020, then a pandemic on 11 March 2020, as it spreads worldwide;
      the emergency declaration is lifted on 5 May 2023. More than 7 million confirmed
      deaths are reported to the WHO over the course of the pandemic, with
      excess-mortality estimates running several times higher.
    citation: >
      Wikipedia, "COVID-19 pandemic" (accessed 2026-09-18): PHEIC declared 30 January
      2020; characterised a pandemic 11 March 2020; PHEIC ended 5 May 2023; over
      7 million confirmed deaths reported to WHO.

  - id: chatgpt-release
    label: ChatGPT released
    kind: moment
    t_min: 3
    t_max: 3
    t: 3
    tags: [science-technology, society]
    importance: 0.5
    description: >
      ChatGPT, a conversational artificial-intelligence chatbot, is released to the public.
      It reaches an estimated 100 million users within two months and speeds up an ongoing
      wave of investment in, and public attention to, AI. Its long-term significance is
      still unfolding.
    citation: >
      Wikipedia, "ChatGPT" (accessed 2026-09-14). Released 30 November 2022; one million
      users in five days and 100 million in two months; "accelerated the AI boom." The
      developer's own announcement page refused a live fetch.

