  - id: coinage-invented
    label: Coinage invented in Lydia
    kind: moment
    t_min: 2585
    t_max: 2650
    t: 2625
    tags: [society, science-technology]
    importance: 0.4
    description: >
      Standardized metal coinage — electrum pieces stamped with an issuing authority's
      mark — first appears in Iron Age Lydia and Ionia in the late 7th century BC,
      replacing weighed bullion with a portable, trust-based medium of exchange.
      Alyattes of Lydia is conventionally credited with early state-issued coinage, and
      his son Croesus (r. c. 560-546 BC) with the first coins of standardized purity;
      the earliest known inscribed coins come from Ephesus.
    citation: >
      Via Wikipedia "Coin", drawing on Herodotus, Aristotle and Pollux, plus the Ephesus
      Artemision hoard; primary/archaeological sources not independently checked.

  # Added for the classical-athens-parthenon scene (data/scenes.yaml), filling the gap
  # between great-pyramid-giza and roman-empire-peak. No existing event covered classical
