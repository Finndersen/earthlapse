    kind: period
    t_min: 3925
    t_max: 4625
    tags: [society]
    importance: 0.5
    description: >
      The Indus Valley Civilisation's Mature ("Integration Era") Harappan phase, roughly
      2600-1900 BC, sees Mohenjo-daro and Harappa grow into planned cities of tens of
      thousands of people each, laid out on street grids with covered brick drains,
      public wells and standardised fired-brick construction — a scale and uniformity of
