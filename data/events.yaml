  - id: earliest-cave-art
    label: Earliest known cave and rock art
    kind: moment
    t_min: 6.4e4
    t_max: 7.16e4
    t: 6.78e4
    tags: [human-origins, society]
    importance: 0.6
    description: >
      The oldest securely dated cave art is a hand stencil in Liang Metanduno, Muna Island,
      Sulawesi, at least 67,800 +/- 3,800 years old (a laser-ablation U-series minimum age).
      Narrative art, human-like figures with a pig, follows at Leang Karampuang, Sulawesi, by
      51,200 years ago. Contested: U-Th ages of over 65,000 years for Iberian cave art
      attributed to Neanderthals have been disputed, with critics arguing for ~47,000 years.
    citation: >
      Oktaviana, A.A. et al. (2026). "Rock art from at least 67,800 years ago in Sulawesi."
      Nature, 650, 652-656. Oktaviana, A.A. et al. (2024). "Narrative cave art in Indonesia by
      51,200 years ago." Nature, 631, 814-818. Hoffmann, D.L. et al. (2018). Science, 359,
      912-915. Slimak, L. et al. (2018). Science, 361, eaau1371 (comment).

  - id: neanderthal-sapiens-overlap
    label: Neanderthals and Homo sapiens overlap in Europe
    kind: period
    t_min: 3.9e4
    t_max: 4.7e4
    tags: [human-origins]
    importance: 0.55
    description: >
      Homo sapiens is present in Europe from roughly 45-47 ka, while radiocarbon dating of
      material from 40 Neanderthal sites across Europe shows Neanderthals disappearing from
      the continent between about 41 and 39 ka. Rather than a single abrupt replacement,
      populations vanish at different times in different regions, with the two species
      overlapping there for an estimated 2,600-5,400 years before Neanderthal extinction.
      The earliest securely dated Homo sapiens presence in Europe is the Initial Upper
      Palaeolithic layer at Bacho Kiro Cave, Bulgaria, radiocarbon-dated to 45,820-43,650
      cal BP and probably present from as early as 46,940 cal BP. A contested, possibly
      earlier incursion is claimed at Grotte Mandrin, France (Neronian layer E,
      ~56,800-51,700 years ago), which would place Homo sapiens in Europe well before
      Bacho Kiro if the association holds.
    citation: >
      Higham, T. et al. (2014). "The timing and spatiotemporal patterning of Neanderthal
      disappearance." Nature, 512, 306-309. Fewlass, H. et al. (2020). "A 14C chronology
      for the Middle to Upper Palaeolithic transition at Bacho Kiro Cave, Bulgaria."
      Nature Ecology & Evolution, 4, 794-801. doi:10.1038/s41559-020-1136-3 (Initial
      Upper Palaeolithic layer, 45,820-43,650 cal BP, probably from 46,940 cal BP).
      Slimak, L. et al. (2022). "Modern human incursion into Neanderthal territories
      54,000 years ago at Mandrin, France." Science Advances, 8, eabj9496.
      doi:10.1126/sciadv.abj9496 (contested).
    # ADR-032: `established` (~46 ka, Bacho Kiro) is independent of this event's own kind/t --
    # this is a `period` (ADR-022) with no single instant of its own, but the arrival arc
    # still needs one transition point. The window's t_max (47 ka) reflects Fewlass et
    # al.'s "probably from 46,940 cal BP" figure (+75 yr cal-BP-to-project-t offset).
    effect:
      kind: arrival
      arrival_kind: peopling
      origin: {lat: 35.0, lon: 38.0}
      destination: {lat: 45.0, lon: 20.0}
      established: 4.6e4
      windows:
        - {t_min: 0.0, t_max: 4.7e4}

  # Divergence date is heavily contested across methods (Skoglund/Fan 2015-16
  # Pleistocene-wolf recalibration vs. Thalmann 2013's own 19,000-32,000 YBP figure);
  # t=27,000 is an illustrative midpoint, not an authoritative single value. Verified
  # via Wikipedia only -- primary genomic papers not read directly.
  - id: dog-domestication
    label: Dog domestication
    kind: moment
    t_min: 17096
    t_max: 40000
    t: 27000
    tags: [society, life]
    importance: 0.35
    description: >
      Dogs diverge from grey wolves through close co-evolution with Late Pleistocene
      humans, becoming the first domesticated species. Genetic divergence estimates
      disagree sharply: mitochondrial-genome analysis puts the split at 19,000-32,000
      years ago, recalibrated against a Pleistocene wolf's mutation rate to
      27,000-40,000 years ago, while the oldest undisputed archaeological dog remains
      (the Erralla dog, Spain) date to only ~17,100 years ago, already showing
      selection-altered morphology. The geographic origin of domestication (Siberia,
      Central Asia, Europe or East Asia) remains unresolved.
    citation: >
      Thalmann, O. et al. (2013). "Complete mitochondrial genomes of ancient canids
      suggest a European origin of domestic dogs." Science, 342(6160), 871-874.
      Skoglund, P. et al. (2015) / Fan, Z. et al. (2016), Pleistocene-wolf-calibrated
      divergence of 27,000-40,000 YBP; Erralla dog dated 17,410-17,096 BP. Via Wikipedia
      "Domestication of the dog"; primary genomic papers not read directly.

  - id: beringia-arrival
    label: Arrival in Beringia
    kind: moment
    t_min: 2.0e4
    t_max: 3.2e4
    t: 2.5e4
    tags: [human-origins]
    importance: 0.5
    description: >
      Ancient-genome analysis of the Upward Sun River infant (USR1), Alaska, dates
      population splits and the "Beringian standstill" rather than arrival directly: the
      Ancient Beringian lineage diverges from the ancestral Native American lineage about
      20,000 years ago, within a 20,000-25,000-year window for the formation of that
      ancestral lineage itself. Direct archaeological evidence for people in the region
      brackets this: the Yana Rhinoceros Horn Site, Siberia, dates human presence at the
      Arctic edge of Beringia to about 32,000 years ago, while Bluefish Caves, Yukon --
      on the Beringian side of the later ice-free corridor -- has a contested radiocarbon
      case for human presence by about 24,000 years ago. The date used here, 25 ka, is a
      judgement call within this bracket, not a single securely dated arrival.
    citation: >
      Moreno-Mayar, J.V. et al. (2018). "Terminal Pleistocene Alaskan genome reveals
      first founding population of Native Americans." Nature, 553, 203-207.
      doi:10.1038/nature25173. Pitulko, V.V. et al. (2004). "The Yana RHS Site: Humans
      in the Arctic Before the Last Glacial Maximum." Science, 303(5654), 52-56.
      doi:10.1126/science.1085219. Bourgeon, L., Burke, A. & Higham, T. (2017).
      "Earliest Human Presence in North America Dated to the Last Glacial Maximum: New
      Radiocarbon Dates from Bluefish Caves, Canada." PLOS ONE, 12(1), e0169486.
      doi:10.1371/journal.pone.0169486 (contested).
    effect:
      kind: arrival
      arrival_kind: peopling
      origin: {lat: 60.0, lon: 125.0}
      destination: {lat: 65.0, lon: -170.0}
      established: 2.5e4
      windows:
        - {t_min: 0.0, t_max: 3.2e4}

  - id: last-glacial-maximum
    label: Last Glacial Maximum
    kind: period
    t_min: 1.9e4
    t_max: 2.65e4
    tags: [earth-climate]
    importance: 0.7
    description: >
      The height of the last ice age: most of the great Northern Hemisphere ice sheets stand
      at their maximum extent, global sea level sits well over 100 m lower than today, and
      cold, dry mammoth steppe spreads across northern Eurasia. The interval is the span over
      which the ice sheets held near-maximum extent, not uncertainty about a single date.
      Ages are calibrated years before 1950; the 75-year offset from this file's 2025
      reference year is far inside the interval.
    citation: >
      Clark, P.U. et al. (2009). "The Last Glacial Maximum." Science, 325(5941), 710-714.
      Most ice sheets reached their maximum extent between 26.5 and 19-20 ka, with
      deglaciation beginning ~19-20 ka.

  - id: peopling-of-americas
    label: Peopling of the Americas
    kind: period
    t_min: 14000
    t_max: 23255
    tags: [human-origins]
    importance: 0.5
    description: >
      Humans reach and spread across the Americas, the last continents to be peopled.
      Fossilised footprints at White Sands, New Mexico, dated across two stratigraphic
      layers to 22,860 +/- 320 and 21,130 +/- 250 calibrated years BP, push the earliest
      secure evidence back to the Last Glacial Maximum, still debated but independently
      supported by two follow-up dating studies; that is well before the older
      "Clovis-first" model, which placed first peopling at only around 13,000 BP. The
      pre-Clovis consensus that superseded it -- sites such as Cooper's Ferry, Idaho,
      dated to ~16,000 years ago -- already placed broad dispersal by roughly 14,000-
      16,000 BP; still-older claimed sites (Chiquihuite Cave, the Cerutti Mastodon site)
      remain without scientific consensus, which is what the interval's older bound
      reflects, not settled measurement error.
    citation: >
      Bennett, M.R. et al. (2021). "Evidence of humans in North America during the Last
      Glacial Maximum." Science, 373(6562), 1528-1531 (White Sands footprints, 22,860
      +/- 320 and 21,130 +/- 250 cal yr BP). Pigati, J.S. et al. (2023). "Independent
      age estimates resolve the controversy of ancient human footprints at White
      Sands." Science, 382(6666), 73-75. doi:10.1126/science.adh5007. Holliday, V.T.
      et al. (2025). "Paleolake geochronology supports Last Glacial Maximum (LGM) age
      for human tracks at White Sands, New Mexico." Science Advances.
      doi:10.1126/sciadv.adv4951 (both corroborate, debate continues). Nielsen, R. et
      al. (2017). "Tracing the peopling of the world through genomics." Nature, 541,
      302-310. doi:10.1038/nature21347. Davis, L.G. et al. (2019). "Late Upper
      Paleolithic occupation at Cooper's Ferry, Idaho, USA, ~16,000 years ago."
      Science, 365(6456), 891-897. doi:10.1126/science.aax9830.
    # ADR-032: `established` (15,000 BP) is independent of this event's own kind (a
    # `period`, no single `t` of its own) -- a conservative point within the pre-Clovis
    # dispersal range the description cites (~14,000-16,000 BP), not a re-derivation of
    # this event's own t_min.
    effect:
      kind: arrival
      arrival_kind: peopling
      origin: {lat: 65.0, lon: -170.0}
      destination: {lat: -10.0, lon: -65.0}
      established: 15000.0
      windows:
        - {t_min: 0.0, t_max: 23255.0}

  # A secondary human-origins tag is plausible (Beringia's role in peopling-of-americas)
  # but this event's own description stays geographic, so it is left single-tagged.
  - id: pleistocene-land-bridges
    label: Beringia, Sunda and Doggerland exposed
    kind: period
    t_min: 7.0e3
    t_max: 3.0e4
    tags: [earth-climate]
    importance: 0.55
    description: >
      Glacial-age sea level, over 100 metres below today's, exposes wide continental
      shelves as dry land: Beringia connects Siberia to Alaska, the Sunda Shelf joins
      Sumatra, Java and Borneo to mainland Southeast Asia, and Doggerland links Britain
      to continental Europe — all drowned again as the ice sheets melt. Each bridge has
      its own history and does not submerge at the same time (Beringia's main land-
      bridge phase runs ~30,000-11,000 BP after intermittent earlier connection; Sunda
      is exposed from the Last Glacial Maximum until a rapid meltwater flood around
      14,300 BP; Doggerland's last remnants submerge by roughly 7,000 BP); the interval
      given is the window over which all three stood substantially above water together,
      not any one bridge's full individual span.
    citation: >
      Elias, S.A. & Brigham-Grette, J. (2007). "Beringia." In Encyclopedia of Quaternary
      Science. Sathiamurthy, E. & Voris, H.K. (2006). "Pleistocene Sea Level and
      Coastline Reconstructions of Sundaland." Natural History Journal of Chulalongkorn
      University, 2, 1-43. Gaffney, V., Fitch, S. & Smith, D. (2009). Europe's Lost
      World: The Rediscovery of Doggerland. Council for British Archaeology. Per-bridge
      windows corroborated live via Wikipedia, "Beringia," "Sunda Shelf" and
      "Doggerland" (all 2026-09-14).

  - id: natufian-settlements
    label: First permanent settlements (Natufian)
    kind: period
    t_min: 11500
    t_max: 15000
    tags: [society]
    importance: 0.55
    description: >
      Natufian communities across the Levant (Ain Mallaha, El Wad and others) live in
      sedentary or semi-sedentary villages with stone architecture and food-storage
      facilities, sustained by wild-food abundance rather than farming — the earliest
      known durable settlements anywhere, and likely ancestral to the region's first
      Neolithic villages. They precede plant domestication (`agriculture`) by roughly
      two millennia, laying the social groundwork — fixed residence, stored surplus —
      that domestication would later intensify.
    citation: >
      Munro, N.D. (2003). "Small game, the Younger Dryas, and the transition to
      agriculture in the southern Levant." Mitteilungen der Gesellschaft für
      Urgeschichte, 12, 47-71. Via Wikipedia "Natufian culture" (15,000-11,500 BP);
      primary source not read directly.

  - id: younger-dryas
    label: Younger Dryas cold reversal
    kind: period
    t_min: 1.17e4
    t_max: 1.29e4
    tags: [earth-climate]
    importance: 0.5
    description: >
      A sharp, roughly 1,300-year return to near-glacial cold interrupts the warming at the
      end of the last ice age, onsetting in under a century and ending abruptly within
      decades — one of the fastest, largest climate swings of the whole glacial termination.
    citation: >
      Younger Dryas dated to approximately 12,900-11,700 years ago per Britannica, "Younger
      Dryas | Definition, Causes, & Termination." Rasmussen, S.O. et al. (2006), GICC05
      Greenland ice-core chronology (volume and pages UNVERIFIED).

  - id: livestock-domestication
    label: Sheep and goat domestication
    kind: period
    t_min: 9500
    t_max: 13025
    tags: [society, life]
    importance: 0.45
    description: >
      Sheep and goats become the first domesticated livestock in the Fertile Crescent,
      herded alongside the earliest cultivated cereals — a pastoral counterpart to
      `agriculture`'s plant domestication. Goat domestication is dated genetically to
      ~9,900-9,500 BP in the Zagros/southeastern Anatolia region; sheep domestication,
      in the same broader Mesopotamian window (~11,000-8,000 BCE, roughly 13,025-10,025
      BP), is less precisely dated — two related but separately documented processes,
      not one event, hence the wide combined interval.
    citation: >
      Naderi, S. et al. (2008). "The goat domestication process inferred from large-
      scale mitochondrial DNA analysis of wild and domestic individuals." PNAS, 105(46),
      17659-17664. Ensminger, M.E. & Parker, R.O. (1986). Sheep and Goat Science, 5th
      ed. Interstate Printers & Publishers (sheep date range, via Wikipedia
      "Domestication of the sheep").

  - id: agriculture
    label: Agriculture begins
    kind: period
    t_min: 10025
    t_max: 11525
    tags: [society]
    importance: 0.85
    description: >
      Plant domestication begins in the Fertile Crescent — the first of several
      independent origins of agriculture worldwide. The transition from cultivation of
      wild stands to fixed morphological domestication (non-shattering cereals) was
      gradual, spanning roughly two millennia, so the interval reflects that process
      rather than a single event.
    citation: >
      Zeder, M.A. (2011). "The Origins of Agriculture in the Near East." Current
      Anthropology, 52(S4), S221-S235. Domestication of founder crops (einkorn, emmer,
      barley) begins ~10,500-9,500 cal BC, with morphological domestication clearly
      established by ~8,000 cal BC.

  - id: gobekli-tepe
    label: Göbekli Tepe monumental site
    kind: period
    t_min: 10025
    t_max: 11525
    tags: [society, science-technology]
    importance: 0.4
    description: >
      Pre-Pottery Neolithic foragers without agriculture, pottery or metal tools raise
      massive T-shaped limestone pillars into ring enclosures at Göbekli Tepe,
      southeastern Anatolia — among the earliest monumental architecture anywhere —
      before the site falls out of use roughly 1,500 years later. The long-standard idea
      that the enclosures were deliberately backfilled has fallen out of favour since
      excavator Klaus Schmidt's death; burial is now attributed to natural landslides,
      with a severe one likely triggering the final abandonment.
    citation: >
      Dietrich, O. et al. (2013), radiocarbon dating Layer III to c. 9500 BC; Kinzel, M.
      & Clare, L. (2020), continued use to c. 8000 BC. Via Wikipedia "Göbekli Tepe";
      primary radiocarbon papers not read directly.

  - id: african-humid-period
    label: African Humid Period (Green Sahara)
    kind: period
    t_min: 5.0e3
    t_max: 1.46e4
    tags: [earth-climate]
    importance: 0.5
    description: >
      Orbitally driven strengthening of the African monsoon turns the Sahara into
      grassland, lakes and rivers, supporting hippos, crocodiles and human settlement
      across what is now the world's largest hot desert, before the monsoon weakens and
      the desert returns. The humid period begins around 14,600-14,500 years ago and
      ends in stages between roughly 6,000 and 5,000 years ago; some researchers
      subdivide it into a wetter early phase (AHP I, to ~8,000 years ago) and a drier
      later phase (AHP II).
    citation: >
      deMenocal, P. et al. (2000). "Abrupt onset and termination of the African Humid
      Period: rapid climate responses to gradual insolation forcing." Quaternary Science
      Reviews, 19(1-5), 347-361. Liu, Z. et al. (2017). Journal of Geophysical Research:
      Atmospheres (AHP I/AHP II subdivision at ~8 ka; full paper title UNVERIFIED).
      Corroborated live via Wikipedia, "African humid period" (2026-09-14), which names
      both papers directly for the same figures.

  # Later-migrations batch (2026-09-17): eleven new arrival events, distinct from the
  # thirteen pre-existing `arrival_kind: peopling` arcs -- most (nine) are `migration`,
  # a later movement of people into land already inhabited or previously settled,
  # rather than first human settlement of an uninhabited region. A 2026-09-17
  # fact-check (ADR-032 amendment, docs/DECISIONS.md) reclassified two of the eleven to
  # `peopling` -- austronesian-expansion-taiwan, and norse-north-atlantic-settlement,
  # which was also split into an Iceland-only event plus a new
  # greenland-norse-settlement `peopling` event -- per the destination's prior-
  # population status. See sources/events-core/README.md for the full batch list and
  # verification method.
  - id: neolithic-farmers-europe
    label: Neolithic farmers spread from Anatolia into Europe
    kind: period
    t_min: 6925
    t_max: 8525
    tags: [human-origins, society]
    importance: 0.5
    description: >
      Farming spreads from the Fertile Crescent through Anatolia into Europe as a
      population movement, not merely a diffusion of ideas: ancient DNA shows migrating
      farmers, genetically distinct from Europe's resident hunter-gatherers, crossing
      into the Aegean and Balkans by around 6500 BC and reaching Central Europe's Linear
      Pottery (LBK) culture by around 5500 BC. The farmers substantially replace, while
      also admixing with, the Mesolithic populations they encounter, carrying
      agriculture as far as Britain and Scandinavia over the following two millennia.
    citation: >
      Pinhasi, R., Fort, J. & Ammerman, A.J. (2005). "Tracing the Origin and Spread of
      Agriculture in Europe." PLoS Biology, 3(12), e410. doi:10.1371/journal.pbio.0030410
      (radiocarbon wave-of-advance model; farming reaches the Aegean by c. 6500 BC).
      Haak, W. et al. (2010). "Ancient DNA from European Early Neolithic Farmers Reveals
      Their Near Eastern Affinities." PLoS Biology, 8(11), e1000536.
      doi:10.1371/journal.pbio.1000536 (Near Eastern-derived ancestry in Linear Pottery
      culture farmers, central Germany, c. 5,500 BC). Mathieson, I. et al. (2018). "The
      genomic history of southeastern Europe." Nature, 555, 197-203.
      doi:10.1038/nature25778 (Anatolian-related ancestry spreading into the
      Aegean/Balkans, with substantial genetic replacement of local hunter-gatherers).
    effect:
      kind: arrival
      arrival_kind: migration
      origin: {lat: 38.5, lon: 35.0}
      destination: {lat: 48.5, lon: 16.0}
      established: 7525.0
      windows:
        - {t_min: 0.0, t_max: 8525.0}

  - id: uruk-first-city
    label: Uruk becomes the first city
    kind: period
    t_min: 5125
    t_max: 6025
    tags: [society]
    importance: 0.65
    description: >
      Over the Uruk period, small agricultural villages in southern Mesopotamia grow
      into Uruk, a walled city reaching up to 250 ha with a population of around 50,000
      (plus 80,000-90,000 more in its immediate hinterland) by its zenith around 3100 BC
      — commonly credited as the world's first true city, and the largest urban
      settlement on Earth at the time.
    citation: >
      Nissen, H.J. (2003), population estimates; Harmansah, Ö. (2007), chronology. Via
      Wikipedia "Uruk" (Uruk period conventionally c. 4000-3200 BC, peak
      extent/population c. 3100 BC); primary works not read directly.

  - id: wheel-invented
    label: The wheel is invented
    kind: moment
    t_min: 5375
    t_max: 5656
    t: 5525
    tags: [science-technology, society]
    importance: 0.55
    description: >
      The earliest evidence for the wheel clusters in the mid-4th millennium BC:
      wheeled-cart pictographs on clay tablets from Uruk (c. 3500-3350 BC), a wheeled-
      vehicle image on the Bronocice pot from southern Poland (3631-3380 BC), and wheel
      tracks and the oldest surviving physical wheel-and-axle, from the Ljubljana
      Marshes, Slovenia. Independent, near-simultaneous appearances across Mesopotamia
      and central Europe leave the point of origin — and whether it was invented once or
      several times — unresolved.
    citation: >
      Via Wikipedia "Wheel": Uruk (Eanna) pictographs c. 3500-3350 BC; Bronocice pot
      3631-3380 BC; Ljubljana Marshes wheel 3340-3030 BC, axle radiocarbon-dated
      3360-3045 BC. Underlying excavation reports not independently fetched.

  - id: writing
    label: Writing invented
    kind: period
    t_min: 5025
    t_max: 5425
    tags: [society, science-technology]
    importance: 0.75
    description: >
      Proto-cuneiform, the earliest writing system, develops at Uruk in southern
      Mesopotamia as an administrative technology for tracking goods, labour and rations,
      before evolving into full logographic cuneiform script by ~3200 BC.
    citation: >
      Englund, R.K. (1998). "Texts from the Late Uruk Period." In Mesopotamien:
      Spaturuk-Zeit und Fruhdynastische Zeit (Orbis Biblicus et Orientalis 160/1).
      Proto-cuneiform administrative tablets from Uruk date to the Uruk IV-III periods,
      ~3400-3000 BC.

  - id: yamnaya-steppe-migration
