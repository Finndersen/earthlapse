    label: World population reaches 8 billion
    kind: moment
    t_min: 2.13
    t_max: 2.13
    t: 2.13
    tags: [society]
    importance: 0.5
    description: >
      The United Nations estimates that the world's population reaches 8 billion
      people on 15 November 2022, up from 1 billion around 1804 — a sevenfold increase
      achieved mostly within two centuries of the roughly 300,000-year history of
      Homo sapiens.
    citation: >
      United Nations Department of Economic and Social Affairs, "World Population to
      reach 8 billion on 15 November 2022" (press release, 2022), via Wikipedia,
      "World population" (accessed 2026-09-18): UN-dated 8 billion milestone,
      15 November 2022; 1 billion reached around 1804.

