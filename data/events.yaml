  - id: aotearoa-arrival
    label: Arrival in Aotearoa New Zealand
    kind: moment
    t_min: 725
    t_max: 775
    t: 745
    tags: [human-origins]
    importance: 0.5
    description: >
      Aotearoa New Zealand is the last major landmass settled by humans. Radiocarbon
      dating of rat-gnawed seeds and Pacific rat (kiore) bone -- a reliable proxy for
      human arrival, since the rat travelled only with Polynesian voyagers -- points to
      settlement around AD 1280. A synthesis of archaeological, genealogical and
      genetic evidence points to the same event: a single mass migration of Polynesian
      settlers in the early 14th century, rather than the sporadic earlier arrivals some
      older accounts proposed.
    citation: >
      Wilmshurst, J.M., Anderson, A.J., Higham, T.F.G. & Worthy, T.H. (2008). "Dating
      the late prehistoric dispersal of Polynesians to New Zealand using the commensal
      Pacific rat." PNAS, 105(22), 7676-7680. doi:10.1073/pnas.0801507105 (rat-bone
