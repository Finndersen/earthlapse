  # t_max (1368) runs to the fall of the last successor state (Yuan dynasty), a
  # "founding to final dissolution" framing choice broader than the unified empire's own
  # life, which fragmented into four khanates after 1259.
  - id: mongol-empire
    label: Mongol Empire spans Eurasia
    kind: period
    t_min: 657
    t_max: 819
    tags: [society]
    importance: 0.45
    description: >
      Genghis Khan is proclaimed khan of the united Mongol tribes in 1206, founding an
      empire that becomes the largest contiguous land empire in history, spanning the
      Pacific to Eastern Europe at its territorial peak around 1294. The politically
      unified empire itself fragmented after Möngke Khan's death in 1259, splitting into
      four khanates; the interval used here runs to 1368, when the last successor state,
      the Yuan dynasty, fell to Ming forces — a "founding to final dissolution" span,
      broader than the shorter life of the empire as a single unified polity.
    citation: >
      Via Wikipedia "Mongol Empire": proclaimed 1206; Möngke Khan's death and
      fragmentation, 1259; territorial peak ~23.5M km^2 (1294); Yuan dynasty fall, 1368.

  - id: black-death
    label: Black Death pandemic
    kind: period
    t_min: 672
    t_max: 679
    tags: [catastrophe, society]
    importance: 0.55
    description: >
      The Black Death, a plague pandemic carried along trade routes from Central/East
      Asia, sweeps Europe, Western Asia and North Africa between 1346 and 1353, killing
      an estimated 25-50 million people (some Eurasia-wide estimates run to 75-200
      million) — 30-60% of Europe's population in a few years. Its demographic shock
      reshaped labour markets, land tenure and social structure across the continent for
      generations afterward.
    citation: >
      Via Wikipedia "Black Death": 1346-1353 across Europe, Western Asia and North
      Africa; death toll 25-50M (Eurasia-wide estimates 75-200M); European mortality
      30-60%. Underlying demographic studies not independently fetched.

  - id: gutenberg-printing-press
    label: Gutenberg's printing press
    kind: period
    t_min: 570
    t_max: 577
    tags: [science-technology, society]
    importance: 0.7
    description: >
      Johannes Gutenberg develops a movable-type printing press in Mainz, combining
      reusable metal type, oil-based ink and a wooden press adapted from a wine press.
      He is documented back in Mainz taking out a loan, plausibly for press equipment,
      by 1448; the press is in operation by 1450, and the 42-line Bible is being printed
      by 1455. An earlier, unconfirmed tradition places experimental trials in
      Strasbourg around 1440, but the surviving record does not establish what work he
      was actually doing there, so the interval here starts at the better-documented
      1448 Mainz loan rather than the Strasbourg claim.
    citation: >
      Wikipedia, "Johannes Gutenberg" and "Printing press" (accessed 2026-09-14). Merges
      two independently drafted candidate events for the same milestone (workshop-
      founding vs. operational vs. Bible- printing framings). UNVERIFIED beyond
      Wikipedia: the ~1440 Strasbourg claim is flagged uncertain in the source itself
      and was not used to set t_max.

