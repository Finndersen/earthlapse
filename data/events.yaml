  - id: phoenician-alphabet
    label: Phoenician alphabet emerges
    kind: moment
    t_min: 3025
    t_max: 3125
    t: 3075
    tags: [science-technology, society]
    importance: 0.5
    description: >
      The Phoenician script — a 22-letter consonantal alphabet ancestral to Greek,
      Latin, and most alphabets in use today — is conventionally dated to 1050 BC,
      though this is an acknowledged gap-bridging convention: no Phoenician inscriptions
      survive securely dated to the 11th century BC itself. The oldest securely dated,
      fully developed inscriptions come from the 10th century BC (the Ahiram
      sarcophagus, KAI 1); the al-Khader arrowheads (c. 1100 BC) provide transitional
      evidence bridging it to the earlier Proto-Canaanite script.
    citation: >
      Via Wikipedia "Phoenician alphabet": conventional emergence 1050 BC; Ahiram
      sarcophagus (KAI 1) ~1000 BC; al-Khader arrowheads ~1100 BC. Primary epigraphic
      sources not independently checked.

