  - id: greenland-norse-settlement
    label: Norse settlement of Greenland
    kind: period
    t_min: 595
    t_max: 1045
    tags: [society]
    importance: 0.4
    description: >
      Norse settlers from Iceland, led by Erik the Red, colonise Greenland's
      south-western coast from around AD 985, founding the Eastern and Western
      Settlements. Unlike Iceland, the region had no established prior population at the
      time of Norse arrival: Dorset presence was concentrated far to the north, and
      Thule Inuit reach and come into contact with the Norse settlement area only later,
      in the 13th-14th century (thule-arctic-expansion). Cut off from Norway, the
      settlements disappear by the mid-15th century — the most recent radiocarbon date
      from the Eastern Settlement is AD 1430 +/-15 years — for reasons still debated
      among climate change, resource depletion, economic/trade collapse and conflict
      with expanding Thule Inuit populations.
