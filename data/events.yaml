  # Construction window (Ramsey et al. 2010 Bayesian reanalysis, 2613-2577 BC) is
  # contested against conflicting mortar-radiocarbon evidence and one unexplained older
  # cedar-plank date -- see description. The linked scene (giza-great-pyramid,
  # data/scenes.yaml) instead uses the older conventional completion date, ~2560 BC.
  - id: great-pyramid-giza
    label: Great Pyramid of Giza built
    kind: moment
    t_min: 4602
    t_max: 4638
    t: 4620
    tags: [society, science-technology]
    importance: 0.35
    description: >
      The Great Pyramid of Giza, Khufu's tomb and the sole surviving Wonder of the
      Ancient World, is built over roughly a 26-year span; a 2010 Bayesian re-analysis
      of Egyptian radiocarbon chronology brackets construction to 2613-2577 BC. Earlier
      mortar-sample radiocarbon dating gave a conflicting, older range (calibrated up to
      2871 BC, later reanalysed to 2620-2484 BC using only the youngest samples), and a
      2020-dated cedar plank from the Queen's Chamber shaft came back over 500 years too
      old — both treated as unresolved anomalies here, not used to set the interval.
    citation: >
      Ramsey, C.B. et al. (2010), Egyptian radiocarbon chronology re-analysis, 2613-2577
      BC. Via Wikipedia "Great Pyramid of Giza"; primary paper not independently read.

