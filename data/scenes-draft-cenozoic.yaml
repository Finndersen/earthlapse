# DRAFT — Cenozoic scene proposals, 66.0 Ma -> present, EXCLUDING the K-Pg impact pair.
#
# Not yet merged into data/scenes.yaml. Same schema (pipeline/scenes.py SceneBook), no pins:
# a human runs `earthtime review pick <scene_id> <n>` after these are merged and generated.
# This file validates standalone through the same loader as the main file
# (pipeline.scenes.load_scene_book) — see tests/sources/... or run:
#
#   .venv/bin/python -c "from pipeline.scenes import load_scene_book; \
#       from pathlib import Path; load_scene_book(Path('data/scenes-draft-cenozoic.yaml'))"
#
# Integration note for whoever merges this
# -----------------------------------------
# All ten scenes stay on the existing `waters-edge` chapter (WATER_EDGE shot,
# water-edge-series composition) — no new shot type or chapter was needed, matching this
# brief's constraint against introducing new shot types beyond the deep-time author's
# UNDERWATER. See docs/DECISIONS.md ADR-014 for the (short) rationale. To merge: move each
# scene record into data/scenes.yaml's existing `scenes:` list (the loader sorts by `t`, so
# position in the file doesn't matter beyond readability) and delete this file. Existing
# scenes already in this time range — eocene-jungle (50 Ma), pleistocene-steppe (20 ka),
# neolithic-river-settlement (9 ka), modern-city (0) — are NOT duplicated here.
#
# Two scenes sit close together in time by design, not oversight: arctic-hothouse-forest
# (52 Ma) and the existing eocene-jungle (50 Ma) are the same hothouse world viewed from two
# very different latitudes, exactly as suggested by this brief (a "different angle" on the
# PETM/EECO hothouse rather than a duplicate of eocene-jungle's equatorial rainforest). On
# the symlog timeline the two will sit only a few pixels apart and dissolve almost
# instantly during playback (ADR-011/012) — flagged for whoever tunes pacing next, not
# something this brief owns.
#
# Conditions and sourcing
# ------------------------
# Each scene's `t` and subject content is backed by the citation in its comment block, per
# this brief's verification rule (WebSearch against a citable source, never memory). One
# citation is weaker than the rest and is flagged inline: paleocene-recovery's Pantolambda
# detail rests on a paraphrased tertiary source (Wikipedia), not primary literature — noted
# there and in the work-package report.
#
# `unsourced.o2_percent` / `mean_temp_c` follow data/scenes.yaml's own convention: rounded,
# plausible figures for values no curated WorldState source covers yet, not citations in
# themselves — see that file's header.
#
# Six of the ten scenes' dates correspond to a NEW events.yaml entry added by this same
# work package (comments below name it); the other four (arctic-hothouse-forest,
# eocene-oligocene-icesheet[*], lucy-afarensis[*], acheulean-erectus[*]) also match a new
# event — [*] marks the three that also double as a direct match. See the report for the
# full events-to-scenes mapping.

chapters:
  - id: waters-edge
    label: At the water's edge
    shot: WATER_EDGE
    composition: water-edge-series

scenes:
  # Paleocene mammal radiation, ~66.04-55.8 Ma (events.yaml paleocene-mammal-radiation),
  # placed at 62 Ma, roughly four million years after the K-Pg impact (events.yaml
  # k-pg-impact, 66.043 Ma). Pantolambda, an early large-bodied pantodont, is described only
  # generically (heavy-bodied, bear-sized, long-snouted) rather than pinned to a precise
  # date: the only numeric date found for it this session was the qualitative "mid-Paleocene"
  # on its Wikipedia page (a paraphrased tertiary source, not primary literature) — flagged
  # here and in the work-package report as the one weaker citation in this file. Recovery
  # vegetation (ferns, low palms, open ground) is a plausible generic reconstruction, not
  # drawn from a study of this specific interval.
  - id: paleocene-recovery
    t: 6.2e7
    chapter: waters-edge
    shot: WATER_EDGE
    caption: Four million years after the impact that ended the dinosaurs, a heavy-bodied mammal already fills one of the largest niches in a recovering Paleocene forest.
    unsourced:
      o2_percent: 21  # rounded: near modern by the Paleocene
      mean_temp_c: 24  # rounded: warm Paleocene greenhouse, cooler than the coming PETM
    subject:
      setting: The bank of a slow river crossing a recovering Paleocene floodplain, roughly four million years after the extinction that ended the age of dinosaurs
      left_mass: a stand of young palms and broad-leaved recovery trees, none more than a few metres tall, growing dense and low with a still-open canopy
      vegetation: fast-growing ferns, low palms and a few taller broad-leaved trees recolonising open ground, with patches of bare soil still visible between them
      fauna: a heavy-bodied, bear-sized pantodont mammal at the water's edge; no birds larger than a pigeon, no reptiles bigger than a small lizard
      main_subject: a thickset, bear-sized pantodont mammal with a long snout, blunt peg-like teeth and a thick tapering tail, wading in the shallows to drink
      ground: damp, dark floodplain silt scattered with fallen fern fronds and small pebbles
      water: a slow, muddy brown river, calm and shallow
      far_bank: low regrowth forest of palms and small trees, patchy and still far from a closed canopy
      sky_and_light: a warm, hazy pale sky with scattered cumulus; soft, humid, even light
      absent: [dinosaurs, large predators, grass, flowers, primates, birds larger than a pigeon, people, buildings]
    pin: null

  # Late early Eocene, Margaret Formation, Ellesmere Island (~77N palaeolatitude), ~52 Ma,
  # within the Early Eocene Climatic Optimum. A deliberately different angle on the same
  # hothouse world as the existing eocene-jungle scene (50 Ma) rather than a duplicate — see
  # this file's header note on timeline spacing. Verified: Dunn, R.E. et al. (2023, PLOS
  # ONE), "Basal Primatomorpha colonized Ellesmere Island (Arctic Canada) during the
  # hyperthermal conditions of the early Eocene climatic optimum" (age ~52 Ma, Margaret
  # Formation, warm temperate ecosystem at 77N with a polar light regime); and Scientific
  # Reports (2016), "The palaeobiology of high latitude birds from the early Eocene
  # greenhouse of Ellesmere Island, Arctic Canada" (thermophilic taxa including crocodilians
  # and tapiroid perissodactyls).
  - id: arctic-hothouse-forest
    t: 5.2e7
    chapter: waters-edge
    shot: WATER_EDGE
    caption: At the height of the hottest greenhouse world of the last 66 million years, armoured crocodilians and swamp-cypress forest reach the high Arctic, 77 degrees from the equator.
    unsourced:
      o2_percent: 23  # rounded: near modern
      mean_temp_c: 23  # rounded: EECO Arctic warm-temperate estimate, cooler than eocene-jungle's equatorial mean
    subject:
      setting: A swampy deciduous conifer forest on the shore of a still lake at 77 degrees north, deep in the Arctic, during the hottest greenhouse climate of the last 66 million years
      left_mass: a stand of tall, deciduous swamp conifers with soft feathery foliage turning copper-brown, growing straight out of the shallow water
      vegetation: deciduous swamp conifers and broadleaf trees in autumn colour, a low understory of ferns, and no evergreen needle trees
      fauna: a broad-snouted, armour-backed crocodilian basking at the waterline; a large freshwater turtle nearby; a stocky, short-trunked hoofed mammal drinking at the far edge of the water
      main_subject: a broad, blunt-snouted crocodilian about two metres long, its back studded with bony armour plates, hauled out half in and half out of the shallow water
      ground: waterlogged peat and fallen copper-coloured conifer needles
      water: a still, dark, tannin-brown lake reflecting the low sun
      far_bank: more swamp conifer forest fading into a low mist, the sun sitting low on the horizon despite the warmth
      sky_and_light: a pale, hazy sky with the sun low and reddish near the horizon even at midday, the light of a high Arctic summer; warm, humid air despite the polar latitude
      absent: [snow, ice, evergreen conifers, palm trees, open grassland, large predators, people, buildings]
    pin: null

  # Eocene-Oligocene transition, ~33.9 Ma boundary (ICS chart v2024/12), within the Oi-1
  # glaciation event (~33.8-33.6 Ma) that marks the first major build-up of the Antarctic ice
  # sheet (events.yaml eocene-oligocene-transition). Verified: Coxall, H.K. et al. (2005),
  # "Rapid stepwise onset of Antarctic glaciation and deep-sea acidification in the late
  # Eocene," Nature, 433, 53-57. Fauna deliberately sparse and unnamed: no source consulted
  # this session identifies a specific taxon at a newly glaciated coast at this date.
  - id: eocene-oligocene-icesheet
    t: 3.4e7
    chapter: waters-edge
    shot: WATER_EDGE
    caption: As Antarctica's first permanent ice sheet reaches the coast, Earth tips from forty million years of greenhouse climate into the icehouse world it has lived in ever since.
    unsourced:
      o2_percent: 24  # rounded: Late Eocene estimates run a little above modern
      mean_temp_c: 11  # rounded: global cooling of several degrees across the EOT into an icehouse world
    subject:
      setting: A cold, rocky coastline where a young ice sheet's outlet glacier meets the sea for the first time, at the moment Earth's climate tips from greenhouse to icehouse
      left_mass: a tall wall of blue-white glacier ice, freshly advanced to the coast, its front cracked and streaked with rock debris
      vegetation: a few hardy, low, cold-adapted shrubs and mosses clinging to bare rock above the tideline; no forest anywhere in view
      fauna: none large enough to be visible; the coast is too new and too cold for anything but scattered seabirds
      main_subject: a low, growler-sized block of freshly calved glacier ice grounded in the shallows, meltwater dripping from its face
      ground: bare, frost-shattered grey rock and gravel, with patches of thin moss
      water: a cold, dark grey-green sea, choppy, carrying scattered fragments of ice
      far_bank: the glacier's calving front stretching along the coast, hazed by blowing spray
      sky_and_light: a cold, pale, high-latitude sky with fast-moving cloud; flat, diffuse, chilly light
      absent: [forest, palms, flowering plants in bloom, large mammals, penguins, polar bears, people, buildings, ships]
    pin: null

  # Early Miocene, ~18 Ma, within the interval of rising open-habitat grass diversity,
  # ~19-15.5 Ma (events.yaml grassland-spread). Verified: Stromberg, C.A.E. (2011),
  # "Evolution of Grasses and Grassland Ecosystems," Annual Review of Earth and Planetary
  # Sciences, 39, 517-544 — the first definitive C3 grass-dominated open habitats appear in
  # the early Miocene, though forest and woodland still dominate globally at this point.
  # Grazing fauna described generically: no specific early Miocene taxon at this vantage is
  # sourced here.
  - id: miocene-grassland
    t: 1.8e7
    chapter: waters-edge
    shot: WATER_EDGE
    caption: Where unbroken forest stood only a few million years earlier, the first true grass-dominated plains now open a horizon no earlier scene has shown.
    unsourced:
      o2_percent: 21  # modern
      mean_temp_c: 19  # rounded: warm early Miocene climatic optimum
    subject:
      setting: A broad, open river valley where the first true grass-dominated plains are spreading between patches of retreating woodland
      left_mass: a ragged stand of broadleaf trees, the last remnant of what was recently unbroken forest, thinning toward open ground
      vegetation: tall, tawny-green open grassland stretching toward the horizon, with scattered trees and woodland only near the water
      fauna: a small herd of medium-sized, three-toed hoofed grazing mammals out on the open grass; a few browsing mammals still near the tree line
      main_subject: three medium-sized, three-toed hoofed mammals with long legs, grazing low in the open grass at the water's edge
      ground: a mix of bare sandy soil and low, cropped grass near the water
      water: a slow, clear river reflecting the open sky
      far_bank: open rolling grassland with only scattered trees, running to a distant, treeless horizon
      sky_and_light: a wide, bright blue sky with scattered fair-weather cumulus; clear, strong sunlight with a broad view to the horizon
      absent: [dense unbroken forest, dinosaurs, primates, modern-style farmland, fences, people, buildings]
    pin: null

  # Late Miocene, ~7 Ma, within the global isotopic expansion of C4 grasses,~8-6 Ma
  # (events.yaml c4-expansion), well after the Old World arrival of hipparionine horses at
  # ~11.1-11.4 Ma (events.yaml hipparion-dispersal). Verified: Quade, J., Solounias, N. &
  # Cerling, T.E. (1994), carbon-isotope reconstruction of Late Miocene vegetation from
  # paleosol carbonates; "Old World first appearance datum of 'Hipparion' horses," Geology,
  # 25(1), 19-22 (1997), for the hipparionine dispersal date. Antelope taxon left generic; no
  # specific 7 Ma genus is sourced here.
  - id: c4-savanna-hipparion
    t: 7.0e6
    chapter: waters-edge
    shot: WATER_EDGE
    caption: Coarse new C4 grasses have taken over the plain, and three-toed grazing horses crowd a shrinking waterhole in a drier, harder world.
    unsourced:
      o2_percent: 21  # modern
      mean_temp_c: 18  # rounded: Late Miocene cooling and aridification
    subject:
      setting: An open, sunburnt savanna at a shrinking waterhole, in a landscape where coarse, wiry grasses have replaced the softer grasslands of a few million years before
      left_mass: a single flat-topped acacia-like tree standing apart, its canopy thin, giving little shade over cracked bare ground
      vegetation: tough, wiry, straw-coloured grass covering the plain almost to the horizon, with only isolated trees
      fauna: a herd of small, three-toed hipparionine horses and a few small horned grazing mammals drinking together
      main_subject: a small, pony-sized three-toed horse with its outer toes reduced to dewclaws not touching the ground, head down and drinking at the water's edge
      ground: cracked, sun-baked pale earth around the shrinking waterhole, hoofprints pressed into the drying mud
      water: a shallow, muddy, shrinking waterhole, its margins rimmed with dried mud
      far_bank: open, sunburnt savanna running flat to a hazy, heat-shimmered horizon
      sky_and_light: a bleached, almost white sky with a fierce, high sun; hard, short shadows and visible heat haze over the distance
      absent: [dense forest, flowers in bloom, modern zebra, modern antelope, apes, hominins, people, fences, buildings]
    pin: null

  # Messinian salinity crisis, 5.96-5.33 Ma, placed mid-crisis at 5.6 Ma (events.yaml
  # messinian-salinity-crisis). Verified: Garcia-Castellanos, D. et al. (2009), "Catastrophic
  # flood of the Mediterranean after the Messinian Salinity Crisis," Nature, 462, 778-781 —
  # onset 5.96 +/- 0.02 Ma, Atlantic isolation established 5.59-5.33 Ma. How dry the basin
  # actually got, and how catastrophic the eventual Zanclean refill was, remain contested and
  # are not asserted here — this scene shows only the crisis's well-evidenced endpoint, a
  # basin floored in evaporite salt, not the contested refill event itself.
  - id: messinian-salt-flats
    t: 5.6e6
    chapter: waters-edge
    shot: WATER_EDGE
    caption: The Mediterranean has all but evaporated, and an entire sea floor now lies exposed as a blinding crust of salt.
    unsourced:
      o2_percent: 21  # modern
      mean_temp_c: 20  # rounded: Late Miocene, regionally hot and arid around the drying basin
    subject:
      setting: The floor of a vast, nearly evaporated inland sea, a thick white crust of salt running to every horizon
      left_mass: a low ridge of banded white and grey salt and gypsum, built up in thick evaporite layers like terraced steps
      vegetation: none; the salt crust supports no plant life at all
      fauna: none visible; nothing lives on the bare salt
      main_subject: a shallow, still, intensely saline brine pool, pink-tinged, rimmed with a crust of fresh white salt crystals forming at its edge
      ground: a hard, cracked, brilliant white salt pan, polygonal cracks running in every direction
      water: a small, shrinking, hypersaline brine pool, all that remains of an entire sea
      far_bank: more bare white salt flat stretching unbroken to a shimmering horizon
      sky_and_light: a cloudless, bleached white sky; a fierce sun and blinding glare off the salt, with almost no shadow
      absent: [any plant, any animal, boats, fish, blue open sea, green colour anywhere, people, buildings]
    pin: null

  # Australopithecus afarensis, specimen AL 288-1 ("Lucy"), Hadar, Ethiopia, dated to
  # ~3.2 Ma (events.yaml australopithecus-afarensis). Verified: Natural History Museum,
  # "Australopithecus afarensis, Lucy's species"; Britannica, "Lucy | Australopithecus
  # afarensis, 3.2 Million Years, Ethiopia"; discovered 24 November 1974 by Donald Johanson's
  # team. Hadar in the Pliocene was a lake-margin/floodplain setting, consistent with the
  # water-edge composition used here. Placed ~0.1 Myr before the (older, contested)
  # first-stone-tools event (events.yaml lomekwi-stone-tools, ~3.3 Ma) so a viewer scrubbing
  # forward sees Lucy's species before the first known stone tools appear, deliberately
  # showing that change.
  - id: lucy-afarensis
    t: 3.2e6
    chapter: waters-edge
    shot: WATER_EDGE
    caption: A small, upright hominin of Lucy's species walks on two legs at the edge of a Rift Valley lake, already committed to life on the ground.
    unsourced:
      o2_percent: 21  # modern
      mean_temp_c: 20  # rounded: Pliocene East African rift, similar to present
    subject:
      setting: The wooded margin of a shallow lake on the East African rift floor, where a small, upright hominin pauses at the water
      left_mass: a stand of flat-topped acacia-like trees and scattered low shrubs, with open grassy ground beneath them
      vegetation: scattered flat-topped trees and patches of grass and low shrub, more open than closed woodland
      fauna: none else in view; the focus is the hominin alone at the water's edge
      main_subject: a small, upright bipedal hominin about a metre tall, with a small, ape-like brow and face but a human-like curved lower back and long legs, walking along the shore on two legs
      ground: pale, sunbaked lakeshore mud and sand, with scattered pebbles
      water: a shallow, calm, sunlit lake, pale blue-green
      far_bank: open wooded grassland with scattered flat-topped trees, hazy with distance
      sky_and_light: a clear, warm, pale-blue East African sky with a few high clouds; bright, direct sunlight
      absent: [modern humans, clothing, tools, fire, other hominin species, large predators in view, people, buildings]
    pin: null

  # Final closure of the Isthmus of Panama, ~2.8 Ma per O'Dea et al. (2016), "Formation of
  # the Isthmus of Panama," Science Advances, 2(8), e1600883 (events.yaml
  # isthmus-of-panama). Contested: Bacon, C.D. et al. (2015), "Biological evidence supports
  # an early and complex emergence of the Isthmus of Panama," PNAS, 112(19), 6110-6115, argue
  # biotic interchange was already well underway many millions of years earlier via an
  # emergent, discontinuous landscape. This scene shows the O'Dea et al. convention of a
  # final, continuous land connection, not the contested earlier partial-connection
  # hypothesis; it does not assert exactly which named taxa crossed at this date beyond the
  # general, well-established Great American Biotic Interchange pattern (armoured South
  # American mammals moving north).
  - id: panama-land-bridge
    t: 2.8e6
    chapter: waters-edge
    shot: WATER_EDGE
    caption: A new strip of land now joins two continents, and an armoured giant from the south is among the first to cross it.
    unsourced:
      o2_percent: 21  # modern
      mean_temp_c: 21  # rounded: warm tropical latitude, near present-day equatorial climate
    subject:
      setting: A narrow, newly emerged strip of tropical land joining two continents, sea on both sides, where animals from north and south are crossing for the first time
      left_mass: a low ridge of dense tropical forest crowding the spine of the narrow land bridge
      vegetation: dense tropical broadleaf forest along the ridge, giving way to open, sandy, sparsely vegetated ground near the coast on either side
      fauna: a large, heavily built ground-dwelling mammal encased in bony armour plates, walking north along the shoreline; a large, long-legged flightless bird in the middle distance
      main_subject: a large, slow-moving mammal encased in a rigid dome of bony armour plates, about the size of a small car, walking along the coastal sand
      ground: pale coastal sand strewn with driftwood and shell fragments
      water: calm, clear turquoise water on both sides of the narrow strip of land
      far_bank: a second shoreline visible across a narrow strait to one side, and open ocean to the other
      sky_and_light: a bright, clear tropical sky with scattered cumulus; strong, direct equatorial sunlight
      absent: [primates, hominins, elephants, modern armadillos, people, boats, buildings]
    pin: null

  # Homo erectus with Acheulean bifacial tools, Kokiselei 4, West Turkana, Kenya, ~1.76 Ma
  # (events.yaml homo-erectus and acheulean-technology). Verified: Lepre, C.J. et al.
  # (2011), "An earlier origin for the Acheulian," Nature, 477, 82-85 (world's oldest known
  # Acheulean, dated via magnetostratigraphy bracketed by dated ash layers). Deliberately
  # shows tools, not fire: habitual fire control is not well evidenced this early (events.yaml
  # control-of-fire puts sporadic use at 1.0-1.5 Ma and habitual use only from ~400 ka), so a
  # campfire here would overstate the evidence, per this brief's instruction to be honest
  # about the contested date.
  - id: acheulean-erectus
    t: 1.76e6
    chapter: waters-edge
    shot: WATER_EDGE
    caption: An early human ancestor shapes a symmetrical stone handaxe at a rift lake shore, a technology that will not change for the next million years.
    unsourced:
      o2_percent: 21  # modern
      mean_temp_c: 20  # rounded: Early Pleistocene East African rift
    subject:
      setting: The shore of a shallow lake in the East African rift, where an early human ancestor crouches at a scatter of stone flakes
      left_mass: a low outcrop of dark volcanic rock, partly quarried, with a scatter of flaked stone debris at its base
      vegetation: scattered flat-topped trees and open grass near the water, with reeds along the immediate shoreline
      fauna: none else in view; the focus is on the toolmaker alone at the water's edge
      main_subject: an upright hominin with a robust brow ridge, a low sloping forehead and a large nose, crouched at the waterline, working one stone against another to shape a teardrop-shaped, symmetrical, sharp-edged handaxe
      ground: pale lakeshore sand and gravel scattered with dark, sharp-edged stone flakes
      water: a shallow, calm, clear lake reflecting the sky
      far_bank: open grassland dotted with flat-topped trees, hazy with distance
      sky_and_light: a bright, clear East African sky with scattered high cloud; strong, even daylight
      absent: [fire, modern humans, clothing beyond simple draped hide, metal, domesticated animals, people, buildings]
    pin: null

  # Neanderthal-Homo sapiens overlap in Europe, ~45-39 ka, placed at the midpoint, 42 ka
  # (events.yaml neanderthal-sapiens-overlap). Verified: Higham, T. et al. (2014), "The
  # timing and spatiotemporal patterning of Neanderthal disappearance," Nature, 512, 306-309
  # — Neanderthals disappear from the European record by ~41-39 ka, while Homo sapiens is
  # present in Europe from ~45 ka, an overlap of roughly 2,600-5,400 years. This scene
  # deliberately does NOT claim "first cave art": the current oldest confirmed rock/cave art
  # is in Sulawesi, Indonesia, at >=51.2 ka (narrative art) and >=67.8 ka (hand stencil) —
  # both older than, and unconnected to, this European scene (events.yaml
  # earliest-cave-art). The brief's suggested "first cave art ~40-45 ka" premise does not
  # hold up under verification, so this scene shows toolmaking, not painting.
  - id: ice-age-europe-neanderthal
    t: 4.2e4
    chapter: waters-edge
    shot: WATER_EDGE
    caption: In the last millennia before Neanderthals disappear from Europe, a hunter works a stone-tipped spear at a cold, fast river.
    unsourced:
      o2_percent: 21  # modern
      mean_temp_c: 4  # rounded: cold glacial stadial in ice-age Europe, well below present
    subject:
      setting: A river valley in ice-age Europe, cut into a landscape of open tundra-steppe scattered with patches of coniferous forest
      left_mass: a stand of hardy, wind-bent conifers on a low bluff above the river
      vegetation: cold steppe grasses and dwarf shrubs with scattered stands of conifer, no broadleaf forest
      fauna: a small herd of reindeer crossing the shallows in the middle distance; nothing else in view
      main_subject: a heavily built, powerfully muscled hominin with a strong brow ridge and a broad nose, wrapped in draped animal hide, crouched at the water's edge working a wooden shaft tipped with a flaked stone point
      ground: gravel and cobbles at the river's edge, with patches of frost-heaved soil
      water: a shallow, cold, clear river running fast over gravel
      far_bank: open cold steppe rising to low hills, patched with dark conifer stands
      sky_and_light: a pale, cold, high sky with fast-moving cloud; a low sun and long, cool-toned light
      absent: [cave paintings, agriculture, farm animals, metal, modern humans in modern dress, people, buildings]
    pin: null
