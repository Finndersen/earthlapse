[project]
name = "earthtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "typer>=0.12", "httpx>=0.27", "tenacity>=8.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
data = ["xarray>=2024.0", "netcdf4>=1.7", "pyarrow>=16.0", "pyyaml>=6.0"]
geo = ["gplately>=2.0"]

[project.scripts]
earthtime = "pipeline.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
